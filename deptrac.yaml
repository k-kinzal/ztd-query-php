# Package boundaries: concrete platforms implement the core contracts; adapters use platforms.
deptrac:
  paths:
    - packages/ztd-query-core/src
    - packages/ztd-query-mysql/src
    - packages/ztd-query-postgres/src
    - packages/ztd-query-sqlite/src
    - packages/ztd-query-pdo-adapter/src
    - packages/ztd-query-mysqli-adapter/src
    - packages/sql-faker/src
    - packages/sql-fixture/src
  analyser:
    types: [class, use, file]
  layers:
    - name: Core
      collectors: [{type: classLike, value: '^ZtdQuery\\(?!Adapter\\|Platform\\(?:MySql|Postgres|Sqlite)\\)'}]
    - name: MySql
      collectors: [{type: classLike, value: '^ZtdQuery\\Platform\\MySql\\'}]
    - name: Postgres
      collectors: [{type: classLike, value: '^ZtdQuery\\Platform\\Postgres\\'}]
    - name: Sqlite
      collectors: [{type: classLike, value: '^ZtdQuery\\Platform\\Sqlite\\'}]
    - name: PdoAdapter
      collectors: [{type: classLike, value: '^ZtdQuery\\Adapter\\Pdo\\'}]
    - name: MysqliAdapter
      collectors: [{type: classLike, value: '^ZtdQuery\\Adapter\\Mysqli\\'}]
    - name: SqlFaker
      collectors: [{type: classLike, value: '^SqlFaker\\'}]
    - name: SqlFixture
      collectors: [{type: classLike, value: '^SqlFixture\\'}]
    - name: Faker
      collectors: [{type: classLike, value: '^Faker\\'}]
    - name: SqlParser
      collectors: [{type: classLike, value: '^PhpMyAdmin\\SqlParser\\'}]
    - name: Composer
      collectors: [{type: classLike, value: '^Composer\\Autoload\\'}]
  ruleset:
    Core: [Composer]
    MySql: [Core, SqlParser, Composer]
    Postgres: [Core, Composer]
    Sqlite: [Core, Composer]
    PdoAdapter: [Core, MySql, Postgres, Sqlite]
    MysqliAdapter: [Core, MySql]
    SqlFaker: [Faker]
    SqlFixture: [Faker, SqlParser]
    Faker: []
    SqlParser: []
    Composer: []
