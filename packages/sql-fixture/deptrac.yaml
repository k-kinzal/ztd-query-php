# Core concepts, independent platforms, and outward provider composition.
deptrac:
  paths: [./src]
  analyser:
    types: [class, use]
  layers:
    - name: Schema
      collectors:
        - type: classLike
          value: '^SqlFixture\\Schema\\.*'
    - name: TypeMapping
      collectors:
        - type: classLike
          value: '^SqlFixture\\TypeMapper\\.*'
    - name: Hydration
      collectors:
        - type: classLike
          value: '^SqlFixture\\Hydrator\\.*'
    - name: Plan
      collectors:
        - type: classLike
          value: '^SqlFixture\\Plan\\.*'
    - name: Generation
      collectors:
        - type: classLike
          value: '^SqlFixture\\Fixture\\.*'
    - name: MySql
      collectors:
        - type: classLike
          value: '^SqlFixture\\Platform\\MySql\\.*'
    - name: PostgreSql
      collectors:
        - type: classLike
          value: '^SqlFixture\\Platform\\PostgreSql\\.*'
    - name: Sqlite
      collectors:
        - type: classLike
          value: '^SqlFixture\\Platform\\Sqlite\\.*'
    - name: Provider
      collectors:
        - type: classLike
          value: '^SqlFixture\\Provider\\.*'
    - name: Compatibility
      collectors:
        - type: classLike
          value: '^SqlFixture\\Compatibility\\.*'
    - name: Faker
      collectors:
        - type: classLike
          value: '^Faker\\.*'
    - name: SqlParser
      collectors:
        - type: classLike
          value: '^PhpMyAdmin\\SqlParser\\.*'
  ruleset:
    Schema: []
    TypeMapping: [Schema, Faker]
    Hydration: []
    Plan: []
    Generation: [Schema, Plan, TypeMapping, Hydration, Faker]
    MySql: [Schema, TypeMapping, Faker, SqlParser]
    PostgreSql: [Schema, TypeMapping, Faker]
    Sqlite: [Schema, TypeMapping, Faker]
    Provider: [Schema, TypeMapping, Hydration, Plan, Generation, MySql, PostgreSql, Sqlite, Faker]
    Compatibility: [Schema, TypeMapping, Generation, Provider, MySql, Faker]
    Faker: []
    SqlParser: []
