# Core concepts, independent platforms, and outward provider composition.
deptrac:
  paths: [./src]
  analyser:
    types: [class, use]
  layers:
    - name: Schema
      collectors:
        - type: classLike
          value: '^SqlFixture\\Schema\\.*'
    - name: TypeMapping
      collectors:
        - type: classLike
          value: '^SqlFixture\\TypeMapper\\.*'
    - name: Hydration
      collectors:
        - type: classLike
          value: '^SqlFixture\\Hydrator\\.*'
    - name: Plan
      collectors:
        - type: classLike
          value: '^SqlFixture\\Plan\\.*'
    - name: Generation
      collectors:
        - type: classLike
          value: '^SqlFixture\\Fixture\\.*'
    - name: MySql
      collectors:
        - type: classLike
          value: '^SqlFixture\\Platform\\MySql\\.*'
    - name: PostgreSql
      collectors:
        - type: classLike
          value: '^SqlFixture\\Platform\\PostgreSql\\.*'
    - name: Sqlite
      collectors:
        - type: classLike
          value: '^SqlFixture\\Platform\\Sqlite\\.*'
    - name: Provider
      collectors:
        - type: classLike
          value: '^SqlFixture\\Provider\\.*'
    - name: Version
      collectors:
        - type: classLike
          value: '^SqlFixture\\Version\\.*'
    - name: Faker
      collectors:
        - type: classLike
          value: '^Faker\\.*'
    - name: Analysis
      collectors:
        - type: classLike
          value: '^SqlFixture\\Analysis\\.*'
    - name: SqlSemantics
      collectors:
        - type: classLike
          value: '^SqlSemantics\\.*'
  ruleset:
    Schema: []
    TypeMapping: [Schema, Faker]
    Hydration: []
    Plan: []
    Generation: [Schema, Plan, TypeMapping, Hydration, Faker]
    Analysis: [Schema, SqlSemantics]
    MySql: [Schema, Analysis, TypeMapping, Faker, SqlSemantics]
    PostgreSql: [Schema, Analysis, TypeMapping, Faker, SqlSemantics]
    Sqlite: [Schema, Analysis, TypeMapping, Faker, SqlSemantics]
    Provider: [Schema, TypeMapping, Hydration, Plan, Generation, MySql, PostgreSql, Sqlite, Faker, Version]
    Version: []
    Faker: []
    SqlSemantics: []
