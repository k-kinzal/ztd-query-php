$schema: 'https://raw.githubusercontent.com/k-kinzal/ztd-query-php/main/packages/requirements/schemas/config.schema.json'
version: 1
bootstrap: bootstrap.php
definitions:
  - catalog.yaml
extensions:
  sources:
    catalog: RequirementsExample\CatalogSource
  runners:
    scenario: RequirementsExample\ScenarioRunner
runners:
  acceptance:
    extension: scenario
    command:
      - php
      - scenario.php
    timeout: 10
coverage:
  minimum: 100
