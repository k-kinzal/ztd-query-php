# NOTE: You do not have permission to overwrite this file. Please ask a human operator to perform the changes for you.
deptrac:
  paths:
    - ./src
  analyser:
    types: [class, use, file]
  layers:
    - name: Simulator
      collectors:
        - type: directory
          value: src/Simulator/.*
        - type: classLike
          value: ^ZtdQuery\\Simulator\\
    - name: Session
      collectors:
        - type: directory
          value: src/[^/]+\.php
        - type: directory
          value: src/Platform/SessionFactory.php$
        - type: classLike
          value: ^ZtdQuery\\[^\\]+$
        - type: directory
          value: src/Compatibility/.*
        - type: classLike
          value: ^ZtdQuery\\Platform\\SessionFactory$
    - name: Simulation
      collectors:
        - type: directory
          value: src/Rewrite/.*
        - type: classLike
          value: ^ZtdQuery\\Rewrite\\
        - type: directory
          value: src/Shadow/.*
        - type: classLike
          value: ^ZtdQuery\\Shadow\\
    - name: Contract
      collectors:
        - type: directory
          value: src/Connection/.*
        - type: classLike
          value: ^ZtdQuery\\Connection\\
        - type: bool
          must:
            - type: directory
              value: src/Platform/.*
          must_not:
            - type: directory
              value: src/Platform/SessionFactory.php$
    - name: Schema
      collectors:
        - type: directory
          value: src/Schema/.*
        - type: classLike
          value: ^ZtdQuery\\Schema\\
    - name: Sql
      collectors:
        - type: directory
          value: src/Sql/.*
        - type: classLike
          value: ^ZtdQuery\\Sql\\
    - name: Config
      collectors:
        - type: directory
          value: src/Config/.*
        - type: classLike
          value: ^ZtdQuery\\Config\\
    - name: Exception
      collectors:
        - type: directory
          value: src/Exception/.*
        - type: classLike
          value: ^ZtdQuery\\Exception\\
    - name: Composer
      collectors:
        - type: classLike
          value: ^Composer\\Autoload\\
  ruleset:
    Simulator:
      - Session
      - Simulation
      - Contract
      - Exception
    Session:
      - Composer
      - Simulation
      - Contract
      - Schema
      - Sql
      - Config
      - Exception
    Simulation:
      - Contract
      - Schema
      - Sql
      - Exception
    Contract:
      - Schema
      - Config
      - Exception
    Schema:
      - Exception
    Sql:
      - Exception
    Config: ~
    Exception: ~
    Composer: ~
