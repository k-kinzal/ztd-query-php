# NOTE: You do not have permission to overwrite this file. Please ask a human operator to perform the changes for you.
scan:
  roots:
    - src
  exclude: []

policies:
  standard:
    limits:
      file:
        lines: 500
        ncloc: 350
      class:
        lines: 400
      trait:
        lines: 300
      interface:
        lines: 200
      enum:
        lines: 200
      function:
        lines: 50
        cyclomatic_complexity: 20
      method:
        lines: 50
        cyclomatic_complexity: 20

  # PDO's inherited API requires these facades to declare many forwarding methods.
  # Require short methods with limited boundary dispatch for the larger native API surface.
  native-pdo-api:
    extends: standard
    limits:
      file:
        lines: 1000
      class:
        lines: 900
      function:
        lines: 10
        cyclomatic_complexity: 5
      method:
        lines: 10
        cyclomatic_complexity: 5

apply:
  default: standard
  rules:
    - name: native-pdo-api
      match:
        paths: [src/ZtdPdo.php, src/ZtdPdoStatement.php]
      policy: native-pdo-api

report:
  reporter: ai
  order_by:
    - path
    - line
    - rule
