deptrac:
  paths: [./src]
  analyser:
    types: [class, use]
  layers:
    - name: Core
      collectors:
        - type: classLike
          value: '^SqlFormatter\\Core\\.*'
    - name: MySql
      collectors:
        - type: classLike
          value: '^SqlFormatter\\Platform\\MySql\\.*'
    - name: PostgreSql
      collectors:
        - type: classLike
          value: '^SqlFormatter\\Platform\\PostgreSql\\.*'
    - name: Sqlite
      collectors:
        - type: classLike
          value: '^SqlFormatter\\Platform\\Sqlite\\.*'
    - name: Facade
      collectors:
        - type: classLike
          value: '^SqlFormatter\\Facade\\.*'
    - name: Compatibility
      collectors:
        - type: classLike
          value: '^SqlFormatter\\Compatibility\\.*'
    - name: ParserCore
      collectors:
        - type: classLike
          value: '^SqlParser\\(Parser|Lexer)\\.*'
    - name: ParserMySql
      collectors:
        - type: classLike
          value: '^SqlParser\\MySql\\.*'
    - name: ParserPostgreSql
      collectors:
        - type: classLike
          value: '^SqlParser\\PostgreSql\\.*'
    - name: ParserSqlite
      collectors:
        - type: classLike
          value: '^SqlParser\\Sqlite\\.*'
  ruleset:
    Core: [ParserCore]
    MySql: [Core, ParserCore]
    PostgreSql: [Core, ParserCore]
    Sqlite: [Core, ParserCore]
    Facade: [Core, MySql, PostgreSql, Sqlite, ParserCore, ParserMySql, ParserPostgreSql, ParserSqlite]
    Compatibility: [Core, Facade]
    ParserCore: []
    ParserMySql: []
    ParserPostgreSql: []
    ParserSqlite: []
