deptrac:
  paths: [./src]
  analyser:
    types: [class, use]
  layers:
    - name: API
      collectors:
        - type: classNameRegex
          value: '/^SqlFormatter\\Formatter$/'
    - name: Options
      collectors:
        - type: classNameRegex
          value: '/^SqlFormatter\\(Style|FormatOptions|FormattingException)$/'
    - name: Syntax
      collectors:
        - type: directory
          value: 'src/Syntax/'
    - name: Layout
      collectors:
        - type: directory
          value: 'src/Layout/'
    - name: Parser
      collectors:
        - type: classNameRegex
          value: '/^SqlParser\\/'
    - name: Compact
      collectors:
        - type: directory
          value: 'src/Compact/'
  ruleset:
    API: [Options, Syntax, Layout, Compact, Parser]
    Compact: [Options, Parser]
    Options: []
    Syntax: [Parser]
    Layout: [Options, Syntax, Parser]
    Parser: []
