$schema: 'https://raw.githubusercontent.com/k-kinzal/ztd-query-php/main/packages/requirements/schemas/definition.schema.json'
version: 1
source:
  id: sql-faker-algorithm
  uri: docs/algorithm.md
  format: markdown
  selector: p
items:
  -
    id: ALG-GRAMMAR-001
    statement: 'When a database version is selected, the generator shall derive SQL from the grammar bundled for that version.'
    evidence:
      -
        selector: 'p:nth-of-type(1)'
        quote: "SQL Faker generates SQL from the official grammar of the selected database version: MySQL's Bison grammar (sql_yacc.yy), PostgreSQL's Bison grammar (gram.y), or SQLite's Lemon grammar (parse.y). A grammar describes how statements, clauses, and expressions can be assembled from smaller parts."
    tests:
      -
        runner: unit
        target: 'Tests\Unit\MySql\Grammar\MySqlGrammarTest::testLoadWithExplicitVersion'
      -
        runner: unit
        target: 'Tests\Unit\MySql\Grammar\MySqlGrammarTest::testLoadedGrammarVersionsProduceDifferentRuleCounts'
    category: grammar
  -
    id: ALG-GRAMMAR-002
    statement: 'The generator shall bundle, for each supported version, a grammar that records the official grammar file of that version as its source.'
    evidence:
      -
        selector: 'p:nth-of-type(1)'
        quote: "SQL Faker generates SQL from the official grammar of the selected database version: MySQL's Bison grammar (sql_yacc.yy), PostgreSQL's Bison grammar (gram.y), or SQLite's Lemon grammar (parse.y). A grammar describes how statements, clauses, and expressions can be assembled from smaller parts."
    tests:
      -
        runner: unit
        target: 'Tests\Unit\Grammar\Resource\SqlVersionTest::testAllEnumeratesReleasesWhoseGrammarsRecordTheirOfficialSource'
    category: grammar
  -
    id: ALG-DERIVE-001
    statement: 'When a statement or fragment is generated, the generator shall repeatedly replace the leftmost remaining non-terminal with one of its alternatives until only terminals remain.'
    evidence:
      -
        selector: 'p:nth-of-type(2)'
        quote: 'A grammar contains non-terminals, which still need expansion, and terminals, which represent keywords, punctuation, identifiers, or literal tokens. Each non-terminal has one or more production alternatives.'
      -
        selector: 'p:nth-of-type(3)'
        quote: 'For example, a simplified SELECT grammar can be written as:'
      -
        selector: 'p:nth-of-type(4)'
        quote: 'Generation starts with a non-terminal representing the desired statement or fragment. The leftmost remaining non-terminal is replaced with one of its alternatives. Repeating this operation eventually produces only terminals:'
    tests:
      -
        runner: unit
        target: 'Tests\Unit\Generation\Derivation\DerivationTest::testFirstNonTerminalAnswersTheLeftmostPositionTheWalkActsOn'
      -
        runner: unit
        target: 'Tests\Unit\Generation\Derivation\DerivationTest::testOfRewritesTheStartSymbolUntilOnlyTerminalsAreLeft'
      -
        runner: unit
        target: 'Tests\Unit\Provider\SqlGeneratorFactoryTest::testForMySqlRealizesTheDocumentedSelectExample'
    category: derivation
  -
    id: ALG-DERIVE-002
    statement: "When a rule is selected, the generator shall start the derivation at that rule instead of at the grammar's entry point."
    evidence:
      -
        selector: 'p:nth-of-type(5)'
        quote: "Alternative selection introduces variation. Expanding an expression to another expression can produce nested operations, and expanding a list recursively can produce additional columns, rows, or statements. Selecting a fragment's rule uses the same process without first generating an enclosing statement."
    tests:
      -
        runner: unit
        target: 'Tests\Unit\Generation\SqlGeneratorTest::testGenerateUsesExplicitRulesAndSuppliedParserSemantics'
      -
        runner: unit
        target: 'Tests\Unit\Generation\SqlGeneratorTest::testGenerateUsesTheGrammarEntryPointWithoutDialectKnowledge'
    category: derivation
  -
    id: ALG-COMPLETE-001
    statement: 'When an alternative is selected, the generator shall exclude every alternative whose minimum expansions, together with the minimum expansions of the rest of the sentential form, exceed the remaining expansion budget.'
    evidence:
      -
        selector: 'p:nth-of-type(6)'
        quote: 'Recursive alternatives need a finite route to terminal symbols. Before selecting an alternative, generation considers the minimum expansions needed to finish both that alternative and the rest of the statement. Alternatives that cannot finish within the remaining expansion allowance are excluded.'
    tests:
      -
        runner: unit
        target: 'Tests\Unit\Generation\Derivation\CompletionCostsTest::testAffordableRetainsExactlyTheAlternativesThatCanFinishWithinBudget'
      -
        runner: unit
        target: 'Tests\Unit\Generation\Derivation\DerivationTest::testAffordableRejectsAnAlternativeThatCannotFitAfterTheRemainder'
      -
        runner: unit
        target: 'Tests\Unit\Generation\Derivation\DerivationTest::testAffordableAcceptsAnAlternativeThatExactlyUsesTheBudget'
    category: completion
  -
    id: ALG-COMPLETE-002
    statement: 'Where a generation plan restricts production choices, the generator shall include the restrictions on descendant rules and repeated occurrences in the minimum expansions of an alternative.'
    evidence:
      -
        selector: 'p:nth-of-type(7)'
        quote: 'When additional conditions restrict production choices, completion also considers those conditions in descendant rules and repeated occurrences. If output must contain text, completion must include a terminal that contributes text rather than only empty productions or parser markers.'
    tests:
      -
        runner: unit
        target: 'Tests\Unit\Generation\Derivation\ConstrainedCompletionTest::testMinimumIncludesDescendantsSiblingsAndRecursiveOccurrenceConstraints'
      -
        runner: unit
        target: 'Tests\Unit\Generation\Derivation\TokenGeneratorTest::testMinimumExpansionsIncludesEveryPlannedListItem'
    category: completion
  -
    id: ALG-COMPLETE-003
    statement: 'Where non-empty output is required, the generator shall exclude every alternative whose completion contains no terminal that contributes text.'
    evidence:
      -
        selector: 'p:nth-of-type(7)'
        quote: 'When additional conditions restrict production choices, completion also considers those conditions in descendant rules and repeated occurrences. If output must contain text, completion must include a terminal that contributes text rather than only empty productions or parser markers.'
    tests:
      -
        runner: unit
        target: 'Tests\Unit\Generation\Derivation\CompletionCostsTest::testHasTerminalOutputDistinguishesEmittedTerminalsFromMarkersAndPendingRules'
      -
        runner: unit
        target: 'Tests\Unit\Generation\Derivation\ConstrainedCompletionTest::testWithinRejectsARequiredOutputThatIndependentEmptySubtreesCannotSupply'
      -
        runner: unit
        target: 'Tests\Unit\Generation\Derivation\TokenGeneratorTest::testGenerateReservesVisibleOutputWithoutConsultingLexicalHandlerAvailability'
    category: completion
  -
    id: ALG-SELECT-001
    statement: 'While the expansion count is below the complexity threshold, the generator shall choose uniformly at random among the eligible alternatives.'
    evidence:
      -
        selector: 'p:nth-of-type(5)'
        quote: "Alternative selection introduces variation. Expanding an expression to another expression can produce nested operations, and expanding a list recursively can produce additional columns, rows, or statements. Selecting a fragment's rule uses the same process without first generating an enclosing statement."
      -
        selector: 'p:nth-of-type(8)'
        quote: 'Until the expansion count reaches its complexity threshold, each choice is made uniformly at random among the eligible alternatives. From the threshold on, the choice is no longer random: the eligible alternative with the shortest completion is selected, measured as the fewest terminal symbols, or as the fewest rule expansions followed by the fewest terminal symbols. This allows recursive SQL structures to terminate without cutting off an unfinished statement.'
    tests:
      -
        runner: unit
        target: 'Tests\Unit\Generation\Derivation\DerivationTest::testSelectProductionDrawsUniformlyAmongTheEligibleAlternativesBeforeTheThreshold'
    category: selection
  -
    id: ALG-SELECT-002
    statement: 'When the expansion count reaches the complexity threshold, the generator shall select the eligible alternative whose completion has the fewest terminal symbols.'
    evidence:
      -
        selector: 'p:nth-of-type(8)'
        quote: 'Until the expansion count reaches its complexity threshold, each choice is made uniformly at random among the eligible alternatives. From the threshold on, the choice is no longer random: the eligible alternative with the shortest completion is selected, measured as the fewest terminal symbols, or as the fewest rule expansions followed by the fewest terminal symbols. This allows recursive SQL structures to terminate without cutting off an unfinished statement.'
    tests:
      -
        runner: unit
        target: 'Tests\Unit\Generation\Derivation\DerivationTest::testSelectProductionTakesTheShortestAlternativeOncePastThePlanDepth'
    category: selection
  -
    id: ALG-SELECT-003
    statement: 'Where the step budget is enabled, when the expansion count reaches the complexity threshold, the generator shall select the eligible alternative whose completion has the fewest rule expansions, breaking ties by the fewest terminal symbols.'
    evidence:
      -
        selector: 'p:nth-of-type(8)'
        quote: 'Until the expansion count reaches its complexity threshold, each choice is made uniformly at random among the eligible alternatives. From the threshold on, the choice is no longer random: the eligible alternative with the shortest completion is selected, measured as the fewest terminal symbols, or as the fewest rule expansions followed by the fewest terminal symbols. This allows recursive SQL structures to terminate without cutting off an unfinished statement.'
    tests:
      -
        runner: unit
        target: 'Tests\Unit\Generation\Derivation\DerivationTest::testOfSelectsTerminationPolicyFromThePlan'
    category: selection
  -
    id: ALG-SELECT-004
    statement: 'If no eligible alternative can complete within the expansion budget, then the generator shall report a generation error instead of returning an unfinished statement.'
    evidence:
      -
        selector: 'p:nth-of-type(8)'
        quote: 'Until the expansion count reaches its complexity threshold, each choice is made uniformly at random among the eligible alternatives. From the threshold on, the choice is no longer random: the eligible alternative with the shortest completion is selected, measured as the fewest terminal symbols, or as the fewest rule expansions followed by the fewest terminal symbols. This allows recursive SQL structures to terminate without cutting off an unfinished statement.'
    tests:
      -
        runner: unit
        target: 'Tests\Unit\Generation\Derivation\DerivationTest::testAffordableRejectsARemainderThatExceedsTheWholeBudget'
      -
        runner: unit
        target: 'Tests\Unit\Generation\Derivation\DerivationTest::testOfReportsAPlanNoAlternativeCanSatisfy'
    category: selection
  -
    id: ALG-REWRITE-001
    statement: "When derivation completes, the generator shall apply the dialect's structural transformations to the terminal sequence, each once and in order, before choosing any token text."
    evidence:
      -
        selector: 'p:nth-of-type(9)'
        quote: 'A context-free grammar describes the shapes of SQL, but database parsers also apply rules to relationships between parts of a statement. After derivation, dialect-specific transformations account for these structural requirements, such as expression grouping and clause combinations, before choosing the final text.'
    tests:
      -
        runner: unit
        target: 'Tests\Unit\Generation\SqlGeneratorTest::testGenerateUsesExplicitRulesAndSuppliedParserSemantics'
      -
        runner: unit
        target: 'Tests\Unit\Generation\Token\TokenRewriterTest::testRewriteAppliesEachRuleOnceInOrderAndPreservesTheOriginal'
    category: rewrite
  -
    id: ALG-REWRITE-002
    statement: 'The structural transformations shall make every generated statement satisfy the relationships that the parser of the selected database version enforces beyond the context-free grammar.'
    evidence:
      -
        selector: 'p:nth-of-type(9)'
        quote: 'A context-free grammar describes the shapes of SQL, but database parsers also apply rules to relationships between parts of a statement. After derivation, dialect-specific transformations account for these structural requirements, such as expression grouping and clause combinations, before choosing the final text.'
    design:
      -
        url: 'https://github.com/k-kinzal/ztd-query-php/tree/main/packages/sql-faker/fuzz'
        text: 'Verified by fuzzing, not by linked tests. The sql-faker fuzz targets generate statements from fuzzer input and prepare each one on the matching MySQL, PostgreSQL or SQLite release; a rejection other than the listed schema-dependent errors is a finding.'
    labels:
      - fuzz
    category: rewrite
  -
    id: ALG-LEXEME-001
    statement: 'When a terminal has no spelling from the generation plan, the generator shall choose its text among the candidates that the lexical definitions of the dialect and version declare for it, using the representative values for identifiers and literals.'
    evidence:
      -
        selector: 'p:nth-of-type(10)'
        quote: "The terminal sequence still contains token classes such as IDENT and NUM. Lexical generation replaces each of them with concrete text chosen from the token's candidates, which are defined for the target dialect and version. Keywords and operators have their possible spellings as candidates. Identifiers and literals have a few representative values of their lexical domain, such as _sqlfaker_identifier for a MySQL identifier or 0, 1 and 2 for a MySQL integer; any other value of the domain is used only when a generation plan supplies it."
      -
        selector: 'p:nth-of-type(11)'
        quote: 'For the SELECT example, one realization is:'
    tests:
      -
        runner: unit
        target: 'Tests\Unit\Generation\Candidate\ValueLexemeGeneratorTest::testGenerateOffersOnlyTheDefaultRepresentativesWhenNoValueIsRequested'
      -
        runner: unit
        target: 'Tests\Unit\Generation\SqlGeneratorTest::testRealizeOffersTheWholeZeroBasedCandidateRange'
      -
        runner: unit
        target: 'Tests\Unit\Provider\SqlGeneratorFactoryTest::testForMySqlRealizesTheDocumentedSelectExample'
    category: lexeme
  -
    id: ALG-LEXEME-002
    statement: "When a generation plan supplies a value for an identifier or literal, the generator shall use that value only if it belongs to the token's lexical domain."
    evidence:
      -
        selector: 'p:nth-of-type(10)'
        quote: "The terminal sequence still contains token classes such as IDENT and NUM. Lexical generation replaces each of them with concrete text chosen from the token's candidates, which are defined for the target dialect and version. Keywords and operators have their possible spellings as candidates. Identifiers and literals have a few representative values of their lexical domain, such as _sqlfaker_identifier for a MySQL identifier or 0, 1 and 2 for a MySQL integer; any other value of the domain is used only when a generation plan supplies it."
    tests:
      -
        runner: unit
        target: 'Tests\Unit\Generation\Candidate\ValueLexemeGeneratorTest::testGenerateAcceptsExplicitValuesBeyondDefaultRepresentatives'
      -
        runner: unit
        target: 'Tests\Unit\Generation\Candidate\ValueLexemeGeneratorTest::testGenerateRejectsAnInvalidValueWithoutFallingBackToADefault'
    category: lexeme
  -
    id: ALG-LEXEME-003
    statement: 'When token text is chosen, the generator shall choose from the last terminal to the first and accept only a candidate that is compatible with the text already chosen to its right and leaves the terminals to its left completable.'
    evidence:
      -
        selector: 'p:nth-of-type(12)'
        quote: "Lexical forms are selected from right to left. A candidate must be compatible with the already selected text to its right and allow the remaining text to its left to be completed. This matters because a token's spelling and its neighbors can determine whether whitespace is required or forbidden."
    tests:
      -
        runner: unit
        target: 'Tests\Unit\Generation\Output\ReverseLexemeGeneratorTest::testConflictingCandidateIsNotSelectedOrAllowedToAlterAnotherCandidate'
      -
        runner: unit
        target: 'Tests\Unit\Generation\Output\BoundaryCompletionTest::testAcceptsOnlyCandidatesWhosePendingLeftBoundaryHasACompletion'
      -
        runner: unit
        target: 'Tests\Unit\Generation\Output\CandidateResolverTest::testResolveRejectsAnOwedNeighborAtEitherEndOfTheInput'
    category: lexeme
  -
    id: ALG-JOIN-001
    statement: 'When two neighboring forms are joined, the generator shall place a single space where a space is allowed and nothing where the forms must be adjacent.'
    evidence:
      -
        selector: 'p:nth-of-type(13)'
        quote: 'Once lexical forms have been selected, the boundary between each pair of neighboring forms is either allowed to hold a space or required to have none. A single space is placed wherever one is allowed, and nothing where the forms must be adjacent. For example, SELECT and _sqlfaker_identifier are separated so they are not read as the single identifier SELECT_sqlfaker_identifier, while a prefix and its quoted literal are joined. As a result, the tokens of a generated statement are separated by single spaces except where adjacency is required, so it reads like SELECT ( 1 , 2 ) rather than SELECT (1, 2).'
    tests:
      -
        runner: unit
        target: 'Tests\Unit\Generation\Lexeme\SpacingConstraintTest::testSeparatorPrefersASpaceWheneverItIsAllowed'
      -
        runner: unit
        target: 'Tests\Unit\Generation\Output\CandidateResolverTest::testResolveIntersectsInternalAndExternalConstraintsWithoutChangingTheRightState'
    category: joining
  -
    id: ALG-JOIN-002
    statement: 'When the text is produced, the generator shall concatenate the chosen token text and separators without changing them.'
    evidence:
      -
        selector: 'p:nth-of-type(14)'
        quote: 'The resolved token text and separators are then concatenated to produce the SQL string. Selecting the spellings and boundaries before concatenation preserves the intended token structure.'
    tests:
      -
        runner: unit
        target: 'Tests\Unit\Generation\Output\SqlSerializerTest::testSerializeConcatenatesExactlyWithoutTrimmingOrNormalizing'
    category: joining
  -
    id: ALG-JOIN-003
    statement: 'The generator shall produce text that the parser of the same grammar version reads as the token sequence the derivation chose.'
    evidence:
      -
        selector: 'p:nth-of-type(14)'
        quote: 'The resolved token text and separators are then concatenated to produce the SQL string. Selecting the spellings and boundaries before concatenation preserves the intended token structure.'
    design:
      -
        url: 'https://github.com/k-kinzal/ztd-query-php/tree/main/packages/sql-parser/fuzz'
        text: 'Verified by fuzzing, not by linked tests. The sql-parser fuzz targets parse every generated statement with the parser built from the same grammar and require the tree to write back the identical text.'
    labels:
      - fuzz
    category: joining
  -
    id: ALG-SYNTAX-001
    statement: 'The generator shall produce SQL that the selected database version accepts as syntactically valid.'
    evidence:
      -
        selector: 'p:nth-of-type(16)'
        quote: 'Generated names and values are not coordinated with an existing schema. A query can refer to a missing table or column, apply a function to an incompatible type, or violate a database constraint. For example, generating SELECT price FROM products does not establish that products.price exists. Syntactic validity therefore does not guarantee successful execution.'
    design:
      -
        url: 'https://github.com/k-kinzal/ztd-query-php/tree/main/packages/sql-faker/fuzz'
        text: 'Verified by fuzzing, not by linked tests. The sql-faker fuzz targets generate statements from fuzzer input and prepare each one on the matching MySQL, PostgreSQL or SQLite release; a rejection other than the listed schema-dependent errors is a finding.'
      -
        url: 'https://github.com/k-kinzal/ztd-query-php/tree/main/packages/sql-parser/fuzz'
        text: 'Verified by fuzzing, not by linked tests. The sql-parser fuzz targets parse every generated statement with the parser built from the same grammar and require the tree to write back the identical text.'
    labels:
      - fuzz
    category: limitations
  -
    id: ALG-LIMIT-001
    statement: 'The generator shall generate a database state in which every generated statement is executable.'
    evidence:
      -
        selector: 'p:nth-of-type(15)'
        quote: "SQL Faker's scope is generating SQL syntax. It does not generate a database state in which every resulting statement is executable."
    status: unsupported
    reason: "SQL Faker generates SQL syntax only; preparing a database for the statements is the caller's responsibility."
    category: limitations
  -
    id: ALG-LIMIT-002
    statement: 'The generator shall coordinate generated names and values with an existing schema.'
    evidence:
      -
        selector: 'p:nth-of-type(16)'
        quote: 'Generated names and values are not coordinated with an existing schema. A query can refer to a missing table or column, apply a function to an incompatible type, or violate a database constraint. For example, generating SELECT price FROM products does not establish that products.price exists. Syntactic validity therefore does not guarantee successful execution.'
    status: unsupported
    reason: 'Names and values are not related to any schema. A generation plan can fix names and values, but SQL Faker does not read a schema.'
    category: limitations
  -
    id: ALG-LIMIT-003
    statement: 'The generator shall coordinate separately generated statements into one database scenario.'
    evidence:
      -
        selector: 'p:nth-of-type(17)'
        quote: "Separate generated statements do not form a coordinated database scenario. Generating CREATE TABLE followed by INSERT does not make the INSERT use that table's columns. Likewise, generation does not establish the session state, prepared statements, permissions, or transaction history that another statement may require."
    status: unsupported
    reason: 'Each generation is independent of earlier ones, including the session state, prepared statements, permissions and transactions they would require.'
    category: limitations
  -
    id: ALG-LIMIT-004
    statement: 'The generator shall target a particular result set or database effect.'
    evidence:
      -
        selector: 'p:nth-of-type(18)'
        quote: "Generation does not target a particular result set or database effect. A valid SELECT may return no rows, and an UPDATE or DELETE may affect none. SQL Faker does not ensure that a query expresses an application's intended logic or produces specified values."
    status: unsupported
    reason: 'Generation does not execute statements and has no model of their results.'
    category: limitations
