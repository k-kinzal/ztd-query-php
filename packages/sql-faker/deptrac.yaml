# NOTE: You do not have permission to overwrite this file. Please ask a human operator to perform the changes for you.
deptrac:
  paths:
    - ./src
  analyser:
    types:
      - class
      - use
  layers:
    - name: Provider
      collectors:
        - type: directory
          value: src/[^/]+Provider\.php$
    - name: Generation
      collectors:
        - type: directory
          value: src/Generation/.*
    - name: Grammar
      collectors:
        - type: directory
          value: src/Grammar/.*
    - name: Compiler
      collectors:
        - type: directory
          value: src/Compiler/.*
    - name: Tooling
      collectors:
        - type: directory
          value: src/Tooling/.*
    - name: Compatibility
      collectors:
        - type: directory
          value: src/(MySql|PostgreSql|Sqlite)/SqlGenerator\.php$
        - type: directory
          value: src/MySql/Grammar/Grammar(Compiler)?\.php$
    - name: MySql
      collectors:
        - type: bool
          must:
            - type: directory
              value: src/MySql/.*
          must_not:
            - type: layer
              value: Compatibility
    - name: PostgreSql
      collectors:
        - type: bool
          must:
            - type: directory
              value: src/PostgreSql/.*
          must_not:
            - type: layer
              value: Compatibility
    - name: Sqlite
      collectors:
        - type: bool
          must:
            - type: directory
              value: src/Sqlite/.*
          must_not:
            - type: layer
              value: Compatibility
    - name: Faker
      collectors:
        - type: classLike
          value: ^Faker\\.*
  ruleset:
    Provider: [Generation, Grammar, MySql, PostgreSql, Sqlite, Faker]
    Generation: [Grammar, Faker]
    Grammar: [Faker]
    Compiler: [Grammar]
    MySql: [Grammar, Faker]
    PostgreSql: [Grammar, Faker]
    Sqlite: [Grammar, Faker]
    Tooling: [Grammar, MySql, PostgreSql, Sqlite]
    Compatibility: [Generation, Grammar, Compiler, MySql, PostgreSql, Sqlite, Faker]
    Faker: []
