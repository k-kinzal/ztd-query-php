# Core concepts and independent database implementations. Compatibility only points inward.
deptrac:
  paths: [./src]
  analyser:
    types: [class, use]
  layers:
    - name: Grammar
      collectors:
        - type: classLike
          value: '^SqlFaker\\Grammar\\.*'
    - name: Generation
      collectors:
        - type: classLike
          value: '^SqlFaker\\Generation\\.*'
    - name: Compiler
      collectors:
        - type: classLike
          value: '^SqlFaker\\Compiler\\.*'
    - name: MySql
      collectors:
        - type: classLike
          value: '^SqlFaker\\MySql\\.*'
    - name: PostgreSql
      collectors:
        - type: classLike
          value: '^SqlFaker\\PostgreSql\\.*'
    - name: Sqlite
      collectors:
        - type: classLike
          value: '^SqlFaker\\Sqlite\\.*'
    - name: Compatibility
      collectors:
        - type: classLike
          value: '^SqlFaker\\Compatibility\\.*'
    - name: Faker
      collectors:
        - type: classLike
          value: '^Faker\\.*'
    - name: BisonParser
      collectors:
        - type: classLike
          value: '^BisonParser\\.*'
    - name: LemonParser
      collectors:
        - type: classLike
          value: '^LemonParser\\.*'
  ruleset:
    Grammar: []
    Generation: [Grammar, Faker]
    Compiler: [Grammar, BisonParser, LemonParser]
    MySql: [Grammar, Generation, Faker]
    PostgreSql: [Grammar, Generation, Faker]
    Sqlite: [Grammar, Generation, Faker]
    Compatibility: [MySql, PostgreSql, Sqlite, Grammar, Generation, Faker]
    Faker: []
    BisonParser: []
    LemonParser: []
