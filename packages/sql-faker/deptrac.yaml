# NOTE: You do not have permission to overwrite this file. Please ask a human operator to perform the changes for you.
#
# Every layer is one directory under src/, so the layer of a class is its namespace.
# The only exceptions are PHPDoc type aliases, which Deptrac reads as class-like tokens
# and which are assigned to the layer of the file that declares them.
deptrac:
  paths:
    - ./src
  analyser:
    types:
      - class
      - use
  layers:
    # Productions and symbols of a compiled grammar.
    - name: GrammarModel
      collectors:
        - type: directory
          value: 'src/Grammar/Model/'
    # Supported releases and the grammar artifacts committed for them.
    - name: GrammarResource
      collectors:
        - type: directory
          value: 'src/Grammar/Resource/'
    # Reads upstream Bison and Lemon sources into grammar models.
    - name: Compiler
      collectors:
        - type: directory
          value: 'src/Compiler/'
    # Failures raised while generating SQL.
    - name: GenerationException
      collectors:
        - type: directory
          value: 'src/Generation/Exception/'
    # Immutable requested productions, lexical values and budgets.
    - name: GenerationPlan
      collectors:
        - type: directory
          value: 'src/Generation/Plan/'
        - type: classLike
          value: '^SqlFaker\\Generation\\Plan\\TRequiresNonEmpty$'
    # Terminal occurrences, their derivation provenance and structural rewriting.
    - name: Token
      collectors:
        - type: directory
          value: 'src/Generation/Token/'
    # Database-independent value domains and choices.
    - name: Value
      collectors:
        - type: directory
          value: 'src/Generation/Value/'
    # Lexemes, candidates, resolved output, boundaries and the dialect lexical contract.
    - name: Lexeme
      collectors:
        - type: directory
          value: 'src/Generation/Lexeme/'
    # Generators that offer lexeme candidates for a terminal.
    - name: Candidate
      collectors:
        - type: directory
          value: 'src/Generation/Candidate/'
    # Resolves candidates against boundaries and serializes the chosen output.
    - name: Output
      collectors:
        - type: directory
          value: 'src/Generation/Output/'
    # Walks productions under a plan and computes bounded completion.
    - name: Derivation
      collectors:
        - type: directory
          value: 'src/Generation/Derivation/'
    # Compiles decision bytes into plans.
    - name: Choice
      collectors:
        - type: directory
          value: 'src/Generation/Choice/'
    # Records what generation reached and emitted.
    - name: Coverage
      collectors:
        - type: directory
          value: 'src/Coverage/'
        - type: classLike
          value: '^SqlFaker\\Coverage\\(Measurement|Trace|Checkpoint|Snapshot|History|Entry|Rewrite)$'
        - type: classLike
          value: '^SqlFaker\\Coverage\\Verification\\Trace$'
    # Coordinates derivation, rewriting and lexical realization.
    - name: Generation
      collectors:
        - type: directory
          value: 'src/Generation/[^/]+\.php$'
    # Public Faker entry points and composition of the selected database.
    - name: Provider
      collectors:
        - type: directory
          value: 'src/[^/]+Provider\.php$'
        - type: directory
          value: 'src/Provider/'
    - name: MySqlGrammar
      collectors:
        - type: directory
          value: 'src/MySql/Grammar/'
    - name: MySqlTokenization
      collectors:
        - type: directory
          value: 'src/MySql/Tokenization/'
    - name: MySqlValue
      collectors:
        - type: directory
          value: 'src/MySql/Generation/Value/'
    - name: MySqlSpacing
      collectors:
        - type: directory
          value: 'src/MySql/Generation/Spacing/'
    - name: MySqlLexeme
      collectors:
        - type: directory
          value: 'src/MySql/Generation/Lexeme/'
    - name: MySqlRewrite
      collectors:
        - type: directory
          value: 'src/MySql/Generation/Rewrite/'
    # Runtime composition and plan presets; StatementType is a class_alias declared there.
    - name: MySql
      collectors:
        - type: directory
          value: 'src/MySql/[^/]+\.php$'
        - type: classLike
          value: '^SqlFaker\\MySql\\StatementType$'
    - name: PostgreSqlGrammar
      collectors:
        - type: directory
          value: 'src/PostgreSql/Grammar/'
    - name: PostgreSqlLookahead
      collectors:
        - type: directory
          value: 'src/PostgreSql/Lookahead/'
        - type: classLike
          value: '^SqlFaker\\PostgreSql\\Lookahead\\LookaheadRule$'
    - name: PostgreSqlTokenization
      collectors:
        - type: directory
          value: 'src/PostgreSql/Tokenization/'
    - name: PostgreSqlValue
      collectors:
        - type: directory
          value: 'src/PostgreSql/Generation/Value/'
    - name: PostgreSqlLexeme
      collectors:
        - type: directory
          value: 'src/PostgreSql/Generation/Lexeme/'
    - name: PostgreSqlRewrite
      collectors:
        - type: directory
          value: 'src/PostgreSql/Generation/Rewrite/'
    - name: PostgreSql
      collectors:
        - type: directory
          value: 'src/PostgreSql/[^/]+\.php$'
        - type: classLike
          value: '^SqlFaker\\PostgreSql\\StatementType$'
    - name: SqliteGrammar
      collectors:
        - type: directory
          value: 'src/Sqlite/Grammar/'
    - name: SqliteTokenization
      collectors:
        - type: directory
          value: 'src/Sqlite/Tokenization/'
    - name: SqliteValue
      collectors:
        - type: directory
          value: 'src/Sqlite/Generation/Value/'
    - name: SqliteLexeme
      collectors:
        - type: directory
          value: 'src/Sqlite/Generation/Lexeme/'
    - name: SqliteRewrite
      collectors:
        - type: directory
          value: 'src/Sqlite/Generation/Rewrite/'
    - name: Sqlite
      collectors:
        - type: directory
          value: 'src/Sqlite/[^/]+\.php$'
        - type: classLike
          value: '^SqlFaker\\Sqlite\\StatementType$'
    - name: Faker
      collectors:
        - type: classLike
          value: ^Faker\\.*
    - name: PhpRuntime
      collectors:
        - type: php_internal
          value: '.*'
  ruleset:
    GrammarModel: [PhpRuntime]
    GrammarResource: [GrammarModel, PhpRuntime]
    Compiler: [GrammarModel, GrammarResource, PhpRuntime]
    GenerationException: [GrammarModel, PhpRuntime]
    GenerationPlan: [PhpRuntime]
    Token: [PhpRuntime]
    Value: [Faker, PhpRuntime]
    Lexeme: [GenerationPlan, Token, Value, GenerationException, PhpRuntime]
    Candidate: [GenerationPlan, Token, Value, Lexeme, GenerationException, PhpRuntime]
    Output: [GenerationPlan, Token, Value, Lexeme, GenerationException, PhpRuntime]
    Derivation: [GrammarModel, GenerationPlan, Token, GenerationException, Faker, PhpRuntime]
    Choice: [GrammarModel, GenerationPlan, Token, Lexeme, Derivation, GenerationException, Faker, PhpRuntime]
    Coverage: [GrammarModel, Token, Lexeme, PhpRuntime]
    Generation: [GrammarModel, GenerationPlan, Token, Lexeme, Output, Derivation, Choice, Coverage, GenerationException, Faker, PhpRuntime]
    Provider: [GrammarModel, GrammarResource, GenerationPlan, Lexeme, Choice, Generation, Coverage, GenerationException, MySqlGrammar, MySql, PostgreSqlGrammar, PostgreSql, SqliteGrammar, Sqlite, Faker, PhpRuntime]
    MySqlGrammar: [GrammarModel, GrammarResource, PhpRuntime]
    MySqlTokenization: [GenerationException, PhpRuntime]
    MySqlValue: [Value, Faker, PhpRuntime]
    MySqlSpacing: [Lexeme, PhpRuntime]
    MySqlLexeme: [GrammarResource, Token, Value, Lexeme, Candidate, Output, GenerationException, MySqlValue, MySqlSpacing, Faker, PhpRuntime]
    MySqlRewrite: [Token, PhpRuntime]
    MySql: [GrammarModel, GrammarResource, GenerationPlan, Token, Lexeme, Output, Choice, GenerationException, MySqlGrammar, MySqlTokenization, MySqlValue, MySqlLexeme, MySqlRewrite, Faker, PhpRuntime]
    PostgreSqlGrammar: [GrammarModel, GrammarResource, PhpRuntime]
    PostgreSqlLookahead: [PhpRuntime]
    PostgreSqlTokenization: [GenerationException, PostgreSqlLookahead, PhpRuntime]
    PostgreSqlValue: [Value, Faker, PhpRuntime]
    PostgreSqlLexeme: [GrammarResource, Token, Value, Lexeme, Candidate, Output, GenerationException, PostgreSqlLookahead, PostgreSqlValue, Faker, PhpRuntime]
    PostgreSqlRewrite: [Token, PostgreSqlLookahead, PhpRuntime]
    PostgreSql: [GrammarModel, GrammarResource, GenerationPlan, Token, Lexeme, Output, Choice, GenerationException, PostgreSqlGrammar, PostgreSqlLookahead, PostgreSqlTokenization, PostgreSqlValue, PostgreSqlLexeme, PostgreSqlRewrite, Faker, PhpRuntime]
    SqliteGrammar: [GrammarModel, GrammarResource, PhpRuntime]
    SqliteTokenization: [GenerationException, PhpRuntime]
    SqliteValue: [Value, Faker, PhpRuntime]
    SqliteLexeme: [GrammarResource, Token, Value, Lexeme, Candidate, Output, GenerationException, SqliteValue, Faker, PhpRuntime]
    SqliteRewrite: [Token, PhpRuntime]
    Sqlite: [GrammarModel, GrammarResource, GenerationPlan, Token, Lexeme, Output, Choice, GenerationException, SqliteGrammar, SqliteTokenization, SqliteValue, SqliteLexeme, SqliteRewrite, Faker, PhpRuntime]
    Faker: [PhpRuntime]
    PhpRuntime: []
