# NOTE: You do not have permission to overwrite this file. Please ask a human operator to perform the changes for you.
deptrac:
  paths:
    - ./src
  analyser:
    types:
      - class
      - use
  layers:
    # Grammar productions and symbols, independent of generation and database definitions.
    - name: GrammarModel
      collectors:
        - type: directory
          value: 'src/Grammar/(Grammar|NonTerminal|Production|ProductionRule|Symbol|Terminal|TerminalInventory)\.php$'
    # Pinned release lookup and grammar artifact persistence.
    - name: GrammarResources
      collectors:
        - type: directory
          value: 'src/Grammar/(Resource/|SqlVersion\.php$)'
    # Failure contracts shared by grammar, generation and dialect implementations.
    - name: GenerationErrors
      collectors:
        - type: directory
          value: 'src/Grammar/[^/]*Exception\.php$'
    # Immutable requested productions, lexical values and budgets; no compilation or execution.
    - name: GenerationPlan
      collectors:
        # PHPDoc type parameter or local type alias used by this layer.
        - type: classLike
          value: '^SqlFaker\\Grammar\\Derivation\\TRequiresNonEmpty$'
        - type: directory
          value: 'src/Grammar/Derivation/(GenerationPlan|ProductionPattern)\.php$'
    # Terminal occurrences, derivation provenance and the structural rewrite contract.
    - name: TerminalModel
      collectors:
        - type: directory
          value: 'src/Grammar/Generation/Token/(TerminalOccurrence|ProductionOccurrence|TerminalSequence|RewriteRule)\.php$'
    # Database-independent value choices and sequence/character/integer combinators.
    - name: ValueDomain
      collectors:
        - type: directory
          value: 'src/Grammar/Generation/Value/'
    # Lexical candidates, resolved output and boundary constraints; no database syntax or orchestration.
    - name: LexemeModel
      collectors:
        - type: directory
          value: 'src/Grammar/Generation/(Lexeme/(Lexeme|LexemeCandidates|LexemeGenerator|LexemeInput|LexemeSequence)\.php$|Output/(OutputPart|ResolvedOutput)\.php$|Spacing/(LexemeBoundary|SpacingConstraint|SpacingRule)\.php$)'
    # Applies explicitly supplied structural mappings and rewrite order.
    - name: TokenRewrite
      collectors:
        - type: directory
          value: 'src/Grammar/Generation/Token/(TokenRewriter|TerminalMappingRule)\.php$'
    # Walks productions and computes bounded completion without database-specific rules.
    - name: Derivation
      collectors:
        - type: directory
          value: 'src/Grammar/Derivation/(?!GenerationPlan\.php$|ProductionPattern\.php$|PlanBuilder\.php$)'
    # Derivation entry point returning terminal occurrences.
    - name: TokenGeneration
      collectors:
        - type: directory
          value: 'src/Grammar/Generation/Token/TokenGenerator\.php$'
    # Composes candidates, resolves boundaries and serializes the selected output.
    - name: LexemeGeneration
      collectors:
        - type: directory
          value: 'src/Grammar/Generation/(Lexeme/(?!Lexeme\.php$|LexemeCandidates\.php$|LexemeGenerator\.php$|LexemeInput\.php$|LexemeSequence\.php$)|Output/(?!OutputPart\.php$|ResolvedOutput\.php$)|Spacing/CombinedSpacingRule\.php$|Version/)'
    # Dialect lexical generation API consumed by the SQL generator and plan compiler.
    - name: LexicalContract
      collectors:
        - type: directory
          value: 'src/Grammar/LexicalGrammar\.php$'
    # Compiles decision bytes into an immutable plan using the public generation contracts.
    - name: PlanCompilation
      collectors:
        - type: directory
          value: 'src/Grammar/(Choice/|Derivation/PlanBuilder\.php$)'
    # Coordinates derivation, structural rewriting and lexical realization.
    - name: SqlGeneration
      collectors:
        - type: directory
          value: 'src/Generation/'
    # Reads upstream Bison/Lemon source into grammar models; independent of runtime generation.
    - name: Compiler
      collectors:
        - type: directory
          value: 'src/Compiler/'
    # Public Faker entry points and composition of the selected database implementation.
    - name: Provider
      collectors:
        - type: directory
          value: 'src/([^/]+Provider\.php$|Provider/)'
    # MySql release declarations, scanner values and spacing policies.
    - name: MySqlLexemes
      collectors:
        - type: directory
          value: 'src/MySql/Generation/(Lexeme|Value|Spacing)/'
    # MySql grammar-action and structural validity rules.
    - name: MySqlRewrite
      collectors:
        - type: directory
          value: 'src/MySql/Generation/Rewrite/'
    # MySql diagnostic SQL tokenization and keyword indexing.
    - name: MySqlTokenization
      collectors:
        - type: directory
          value: 'src/MySql/(Tokenization/|(MySqlTokenizer|MySqlQuoting)\.php$)'
    # MySql runtime composition and public plan presets.
    - name: MySql
      collectors:
        # Public compatibility alias resolved by class_alias.
        - type: classLike
          value: '^SqlFaker\\MySql\\StatementType$'
        - type: directory
          value: 'src/MySql/(?!Generation/|Tokenization/|(MySqlTokenizer|MySqlQuoting)\.php$)'
    # PostgreSql release declarations, scanner values and spacing policies.
    - name: PostgreSqlLexemes
      collectors:
        - type: directory
          value: 'src/PostgreSql/Generation/(Lexeme|Value|Spacing)/'
    # PostgreSql grammar-action and structural validity rules.
    - name: PostgreSqlRewrite
      collectors:
        - type: directory
          value: 'src/PostgreSql/Generation/Rewrite/'
    # PostgreSql diagnostic SQL tokenization and keyword indexing.
    - name: PostgreSqlTokenization
      collectors:
        - type: directory
          value: 'src/PostgreSql/(Tokenization/|(PgTokenizer)\.php$)'
    # PostgreSql runtime composition and public plan presets.
    - name: PostgreSql
      collectors:
        # Public compatibility alias resolved by class_alias.
        - type: classLike
          value: '^SqlFaker\\PostgreSql\\StatementType$'
        - type: directory
          value: 'src/PostgreSql/(?!Generation/|Tokenization/|(PgTokenizer)\.php$|PgLookahead\.php$)'
    # Sqlite release declarations, scanner values and spacing policies.
    - name: SqliteLexemes
      collectors:
        - type: directory
          value: 'src/Sqlite/Generation/(Lexeme|Value|Spacing)/'
    # Sqlite grammar-action and structural validity rules.
    - name: SqliteRewrite
      collectors:
        - type: directory
          value: 'src/Sqlite/Generation/Rewrite/'
    # Sqlite diagnostic SQL tokenization and keyword indexing.
    - name: SqliteTokenization
      collectors:
        - type: directory
          value: 'src/Sqlite/(Tokenization/|(SqliteTokenizer)\.php$)'
    # Sqlite runtime composition and public plan presets.
    - name: Sqlite
      collectors:
        # Public compatibility alias resolved by class_alias.
        - type: classLike
          value: '^SqlFaker\\Sqlite\\StatementType$'
        - type: directory
          value: 'src/Sqlite/(?!Generation/|Tokenization/|(SqliteTokenizer)\.php$)'
    # PostgreSQL parser lookahead rules shared by its generation and diagnostic tokenizer.
    - name: PostgreSqlLookahead
      collectors:
        # PHPDoc type parameter or local type alias used by this layer.
        - type: classLike
          value: '^SqlFaker\\PostgreSql\\LookaheadRule$'
        - type: directory
          value: 'src/PostgreSql/PgLookahead\.php$'
    - name: Faker
      collectors:
        - type: classLike
          value: ^Faker\\.*
    - name: PhpRuntime
      collectors:
        - type: php_internal
          value: '.*'
  ruleset:
    GrammarModel: [PhpRuntime]
    GrammarResources: [GrammarModel, PhpRuntime]
    GenerationErrors: [PhpRuntime]
    GenerationPlan: [PhpRuntime]
    TerminalModel: [PhpRuntime]
    ValueDomain: [Faker, PhpRuntime]
    LexemeModel: [TerminalModel, ValueDomain, PhpRuntime]
    TokenRewrite: [TerminalModel, PhpRuntime]
    Derivation: [GrammarModel, GenerationPlan, TerminalModel, GenerationErrors, Faker, PhpRuntime]
    TokenGeneration: [GrammarModel, GenerationPlan, TerminalModel, Derivation, GenerationErrors, Faker, PhpRuntime]
    LexemeGeneration: [GenerationPlan, TerminalModel, ValueDomain, LexemeModel, GenerationErrors, PhpRuntime]
    LexicalContract: [GenerationPlan, TerminalModel, LexemeModel, GenerationErrors, PhpRuntime]
    PlanCompilation: [GrammarModel, GenerationPlan, TerminalModel, LexemeModel, Derivation, TokenGeneration, TokenRewrite, LexicalContract, GenerationErrors, Faker, PhpRuntime]
    SqlGeneration: [GrammarModel, GenerationPlan, TerminalModel, LexemeModel, TokenGeneration, TokenRewrite, LexemeGeneration, LexicalContract, GenerationErrors, Faker, PhpRuntime]
    Compiler: [GrammarModel, GrammarResources, GenerationErrors, PhpRuntime]
    Provider: [GrammarModel, GrammarResources, GenerationPlan, PlanCompilation, SqlGeneration, LexicalContract, GenerationErrors, MySql, PostgreSql, Sqlite, Faker, PhpRuntime]
    MySqlLexemes: [GrammarResources, TerminalModel, ValueDomain, LexemeModel, LexemeGeneration, GenerationErrors, Faker, PhpRuntime]
    MySqlRewrite: [TerminalModel, TokenRewrite, PhpRuntime]
    MySqlTokenization: [GenerationErrors, PhpRuntime]
    MySql: [GrammarModel, GrammarResources, GenerationPlan, PlanCompilation, TerminalModel, LexemeModel, LexemeGeneration, TokenRewrite, LexicalContract, GenerationErrors, MySqlLexemes, MySqlRewrite, MySqlTokenization, Faker, PhpRuntime]
    PostgreSqlLexemes: [GrammarResources, TerminalModel, ValueDomain, LexemeModel, LexemeGeneration, GenerationErrors, Faker, PostgreSqlLookahead, PhpRuntime]
    PostgreSqlRewrite: [TerminalModel, TokenRewrite, PostgreSqlLookahead, PhpRuntime]
    PostgreSqlTokenization: [GenerationErrors, PostgreSqlLookahead, PhpRuntime]
    PostgreSql: [GrammarModel, GrammarResources, GenerationPlan, PlanCompilation, TerminalModel, LexemeModel, LexemeGeneration, TokenRewrite, LexicalContract, GenerationErrors, PostgreSqlLexemes, PostgreSqlRewrite, PostgreSqlTokenization, Faker, PostgreSqlLookahead, PhpRuntime]
    SqliteLexemes: [GrammarResources, TerminalModel, ValueDomain, LexemeModel, LexemeGeneration, GenerationErrors, Faker, PhpRuntime]
    SqliteRewrite: [TerminalModel, TokenRewrite, PhpRuntime]
    SqliteTokenization: [GenerationErrors, PhpRuntime]
    Sqlite: [GrammarModel, GrammarResources, GenerationPlan, PlanCompilation, TerminalModel, LexemeModel, LexemeGeneration, TokenRewrite, LexicalContract, GenerationErrors, SqliteLexemes, SqliteRewrite, SqliteTokenization, Faker, PhpRuntime]
    PostgreSqlLookahead: [PhpRuntime]
    Faker: [PhpRuntime]
    PhpRuntime: []
