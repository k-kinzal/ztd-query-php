deptrac:
  paths: [./src]
  analyser:
    types: [class, use]
  layers:
    - name: Core
      collectors:
        - type: classLike
          value: '^SqlSemantics\\(AnalysisContext|AnalysisException|Analyzer|SemanticsIR|Contract\\(Dialect|Mode))$'
    - name: DatabaseModel
      collectors:
        - type: classLike
          value: '^SqlSemantics\\Platform\\PostgreSql\\Model\\(?!Statement\\Declaration\\IndexHeading$).*'
    - name: IndexConstructionInput
      collectors:
        - type: classLike
          value: '^SqlSemantics\\Platform\\PostgreSql\\Model\\Statement\\Declaration\\IndexHeading$'
    - name: Ir
      collectors:
        - type: classLike
          value: '^SqlSemantics\\Platform\\PostgreSql\\Ir\\.*'
    - name: Parser
      collectors:
        - type: classLike
          value: '^SqlParser\\.*'
    - name: Model
      collectors:
        - type: classLike
          value: '^SqlSemantics\\Platform\\PostgreSql\\Statement\\.*'
    - name: Rules
      collectors:
        - type: classLike
          value: '^SqlSemantics\\Platform\\PostgreSql\\(Rules|Rendering|Profile)\\.*'
    - name: PlatformLowering
      collectors:
        - type: classLike
          value: '^SqlSemantics\\Platform\\PostgreSql\\Lowering\\.*'
    - name: Wiring
      collectors:
        - type: classLike
          value: '^SqlSemantics\\Platform\\PostgreSql\\[A-Za-z]+$'
  ruleset:
    Core: []
    DatabaseModel: [Core, Parser, Wiring]
    Ir: [Core, DatabaseModel, Model, Wiring, IndexConstructionInput]
    IndexConstructionInput: [DatabaseModel, Ir]
    Parser: []
    Model: [Core, DatabaseModel, Rules]
    Rules: [Core, DatabaseModel, Model, Parser]
    PlatformLowering: [Core, DatabaseModel, Model, Rules, Parser]
    Wiring: [Core, DatabaseModel, Model, Rules, PlatformLowering, Parser, Ir]
