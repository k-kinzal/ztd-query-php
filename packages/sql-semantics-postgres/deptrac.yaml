deptrac:
  paths: [./src]
  analyser:
    types: [class, use]
  layers:
    - name: Semantics
      collectors:
        - type: classLike
          value: '^SqlSemantics\\Semantic\\.*'
    - name: Core
      collectors:
        - type: classLike
          value: '^SqlSemantics\\Core\\.*'
    - name: Facade
      collectors:
        - type: classLike
          value: '^SqlSemantics\\Facade\\.*'
    - name: ParserCore
      collectors:
        - type: classLike
          value: '^SqlParser\\(Parser|Lexer)\\.*'
    - name: Platform
      collectors:
        - type: classLike
          value: '^SqlSemantics\\Platform\\PostgreSql\\.*'
    - name: ParserPlatform
      collectors:
        - type: classLike
          value: '^SqlParser\\PostgreSql\\.*'
  ruleset:
    Semantics: [Core]
    Core: [ParserCore, Semantics]
    Facade: [Core, Semantics]
    ParserCore: []
    Platform: [Core, Semantics, ParserCore, ParserPlatform]
    ParserPlatform: []
