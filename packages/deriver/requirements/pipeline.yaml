$schema: 'https://raw.githubusercontent.com/k-kinzal/ztd-query-php/main/packages/requirements/schemas/definition.schema.json'
version: 1
source:
  id: deriver-pipeline
  uri: docs/pipeline.md
  format: markdown
  selector: p
items:
  -
    id: PIPE-ORDER-001
    statement: 'When a session is opened, the analyzer shall run provider expansion, parsing, declaration scanning, model registration, snapshot identity and definition indexing once and keep their artifacts for every query of the session.'
    evidence:
      -
        selector: 'p:nth-of-type(1)'
        quote: 'Deriver answers a query in two groups of stages. The project stages run once when a session is opened: they expand the input through providers, parse every file, index the declarations, register the models, fix the snapshot identity and index the definitions. The query stages run once per query: they select the target, place its demand on the engine, expand the selected definition backwards and collect the alternatives into a candidate collection. No stage executes application code, and the artifact of every stage is immutable once produced.'
    tests:
      -
        runner: unit
        target: 'Tests\Unit\Session\SessionAssemblyTest::testAssemblyRunsTheProjectStagesWithoutLoweringAnyBody'
      -
        runner: unit
        target: 'Tests\Unit\Session\SessionAssemblyTest::testAssemblyIsDeterministicAcrossSessions'
    category: order
  -
    id: PIPE-ORDER-002
    statement: 'When a query is derived, the analyzer shall select the target, place its demand, expand the selected definition and collect the alternatives into one candidate collection.'
    evidence:
      -
        selector: 'p:nth-of-type(1)'
        quote: 'Deriver answers a query in two groups of stages. The project stages run once when a session is opened: they expand the input through providers, parse every file, index the declarations, register the models, fix the snapshot identity and index the definitions. The query stages run once per query: they select the target, place its demand on the engine, expand the selected definition backwards and collect the alternatives into a candidate collection. No stage executes application code, and the artifact of every stage is immutable once produced.'
    tests:
      -
        runner: unit
        target: 'Tests\Unit\Analysis\Candidates\QueryExecutionTest::testDeriveUsesTheCandidateContractByDefault'
      -
        runner: unit
        target: 'Tests\Unit\Analysis\Candidates\QueryExecutionTest::testDeriveBuildsTheCandidatesFromOneContextPerQuery'
    category: order
  -
    id: PIPE-PROVIDE-001
    statement: 'When a session is opened, the provider expansion shall run every configured provider once before any file is parsed and record the contributions in the snapshot manifest.'
    evidence:
      -
        selector: 'p:nth-of-type(2)'
        quote: 'Provider expansion runs the configured providers once before anything is parsed. Entry point, declaration and environment providers add to the captured input and configuration, the contributions are recorded in the snapshot manifest, and the expanded input and configuration do not change for the rest of the session. A provider that contradicts an explicit environment value is rejected.'
    tests:
      -
        runner: unit
        target: 'Tests\Unit\Model\Registration\ProviderExpansionTest::testCapturesContributionsBeforeSnapshotConstruction'
      -
        runner: unit
        target: 'Tests\Unit\Session\SessionTest::testEntrypointsRequireExplicitProviders'
    category: providers
  -
    id: PIPE-PROVIDE-002
    statement: 'If a provider contradicts an explicit environment value, then the provider expansion shall reject the session.'
    evidence:
      -
        selector: 'p:nth-of-type(2)'
        quote: 'Provider expansion runs the configured providers once before anything is parsed. Entry point, declaration and environment providers add to the captured input and configuration, the contributions are recorded in the snapshot manifest, and the expanded input and configuration do not change for the rest of the session. A provider that contradicts an explicit environment value is rejected.'
    tests:
      -
        runner: unit
        target: 'Tests\Unit\Model\Registration\ProviderExpansionTest::testRejectsEnvironmentConflicts'
    category: providers
  -
    id: PIPE-PARSE-001
    statement: 'When a file is parsed, the parser shall admit it against the source limits and produce a syntax tree with resolved names.'
    evidence:
      -
        selector: 'p:nth-of-type(3)'
        quote: 'Parsing turns the bytes of one file and the target profile into a syntax tree with resolved names. The parser admits the file against the source limits, rejects grammar that the target version does not have, and records a malformed file as an INCOMPLETE_SOURCE diagnostic instead of a partial tree. Parsing the same bytes for the same profile always produces the same tree, so parsed files are reused by content hash.'
    tests:
      -
        runner: unit
        target: 'Tests\Unit\Source\Parsing\SourceParserTest::testParseRejectsOversizedBytesBeforeTokenization'
      -
        runner: unit
        target: 'Tests\Unit\Source\Parsing\SourceParserTest::testParseRejectsDeepChainsWithoutRecursiveVisitorFailure'
    category: parsing
  -
    id: PIPE-PARSE-002
    statement: 'If a file uses grammar the target version does not have or cannot be parsed, then the parser shall record an INCOMPLETE_SOURCE diagnostic instead of a partial tree.'
    evidence:
      -
        selector: 'p:nth-of-type(3)'
        quote: 'Parsing turns the bytes of one file and the target profile into a syntax tree with resolved names. The parser admits the file against the source limits, rejects grammar that the target version does not have, and records a malformed file as an INCOMPLETE_SOURCE diagnostic instead of a partial tree. Parsing the same bytes for the same profile always produces the same tree, so parsed files are reused by content hash.'
    tests:
      -
        runner: unit
        target: 'Tests\Unit\Source\Parsing\SourceParserTest::testParseCapturesMalformedSourceWithoutExecutingIt'
      -
        runner: unit
        target: 'Tests\Unit\Source\Parsing\SourceParserTest::testParseDoesNotExportNewerSyntaxIntoTheTargetWorld'
      -
        runner: unit
        target: 'Tests\Unit\Session\SessionAssemblyTest::testValidateSourceRejectsMalformedPhpOnlyWhenRequested'
    category: parsing
  -
    id: PIPE-PARSE-003
    statement: 'When the same bytes are parsed for the same target profile, the parser shall produce the same tree.'
    evidence:
      -
        selector: 'p:nth-of-type(3)'
        quote: 'Parsing turns the bytes of one file and the target profile into a syntax tree with resolved names. The parser admits the file against the source limits, rejects grammar that the target version does not have, and records a malformed file as an INCOMPLETE_SOURCE diagnostic instead of a partial tree. Parsing the same bytes for the same profile always produces the same tree, so parsed files are reused by content hash.'
    tests:
      -
        runner: unit
        target: 'Tests\Unit\Source\Parsing\SourceParserTest::testParseIsDeterministicForTheSameBytesAndProfile'
    category: parsing
  -
    id: PIPE-PARSE-004
    statement: 'When a file with already parsed bytes is read for the same target profile, the parse cache shall reuse the tree by content hash.'
    evidence:
      -
        selector: 'p:nth-of-type(3)'
        quote: 'Parsing turns the bytes of one file and the target profile into a syntax tree with resolved names. The parser admits the file against the source limits, rejects grammar that the target version does not have, and records a malformed file as an INCOMPLETE_SOURCE diagnostic instead of a partial tree. Parsing the same bytes for the same profile always produces the same tree, so parsed files are reused by content hash.'
    tests:
      -
        runner: unit
        target: 'Tests\Unit\Source\Parsing\ParseCacheTest::testReadReusesIdenticalBytesAcrossPathsButInvalidatesChangedSource'
      -
        runner: unit
        target: 'Tests\Unit\Source\Parsing\ParseCacheTest::testReadEnforcesStricterLimitsOnWarmTrees'
    category: parsing
  -
    id: PIPE-DECLARE-001
    statement: 'When a parsed file is scanned, the declaration scanner shall index its declarations and call sites without lowering any function body.'
    evidence:
      -
        selector: 'p:nth-of-type(4)'
        quote: 'Declaration scanning indexes the classes, functions, constants, properties and call sites of every parsed file without reading any function body. The declarations are available before a single body has been lowered, duplicate declarations are reported rather than silently chosen, and a call site is found by its syntax rather than by lowering the functions around it.'
    tests:
      -
        runner: unit
        target: 'Tests\Unit\Source\Declaration\ProjectIndexTest::testClassesIncludesDeclarationsBeforeAnyGraphIsDemanded'
      -
        runner: unit
        target: 'Tests\Unit\Source\Declaration\ProjectIndexTest::testCallOwnersDoesNotCompileUnrelatedBodies'
      -
        runner: unit
        target: 'Tests\Unit\Session\SessionAssemblyTest::testAssemblyRunsTheProjectStagesWithoutLoweringAnyBody'
    category: declaration
  -
    id: PIPE-DECLARE-002
    statement: 'If two declarations share a symbol, then the declaration scanner shall report the duplicate as a diagnostic instead of choosing one.'
    evidence:
      -
        selector: 'p:nth-of-type(4)'
        quote: 'Declaration scanning indexes the classes, functions, constants, properties and call sites of every parsed file without reading any function body. The declarations are available before a single body has been lowered, duplicate declarations are reported rather than silently chosen, and a call site is found by its syntax rather than by lowering the functions around it.'
    tests:
      -
        runner: unit
        target: 'Tests\Unit\Source\Declaration\ProjectIndexTest::testRegisterReportsDuplicateCaseInsensitiveSymbols'
    category: declaration
  -
    id: PIPE-LOWER-001
    statement: 'When a query or an index demands a callable, the lowering shall produce its control flow graph once per snapshot.'
    evidence:
      -
        selector: 'p:nth-of-type(5)'
        quote: 'Lowering turns the syntax of one callable into a control flow graph of basic blocks and instructions. A body is lowered only when a query or an index demands it, each body is lowered once per snapshot, and a lowered body may be reused across snapshots when its file, declaration, target and lowering version are unchanged.'
    tests:
      -
        runner: unit
        target: 'Tests\Unit\Source\Declaration\ProjectIndexTest::testGraphCountCountsOnlyDemandedBodiesAndReusesTheGraph'
      -
        runner: unit
        target: 'Tests\Unit\Source\Declaration\ProjectIndexTest::testConstantCompilesARequestedInitializerOnce'
    category: lowering
  -
    id: PIPE-LOWER-002
    statement: 'While the file, declaration, target and lowering version of a callable are unchanged, the lowering cache shall reuse the lowered body across snapshots.'
    evidence:
      -
        selector: 'p:nth-of-type(5)'
        quote: 'Lowering turns the syntax of one callable into a control flow graph of basic blocks and instructions. A body is lowered only when a query or an index demands it, each body is lowered once per snapshot, and a lowered body may be reused across snapshots when its file, declaration, target and lowering version are unchanged.'
    tests:
      -
        runner: unit
        target: 'Tests\Unit\Source\Lowering\LoweringCacheTest::testReadRebasesSourceOwnershipAndRegistersCachedClosures'
      -
        runner: unit
        target: 'Tests\Unit\Source\Lowering\LoweringCacheTest::testReadInvalidatesTraitVisibilityWhenOnlyTheConsumerChanges'
    category: lowering
  -
    id: PIPE-MODEL-001
    statement: 'If a configured model replaces a standard model without declaring the replacement, or repeats an identifier, or ties on priority, then the model registration shall reject the configuration.'
    evidence:
      -
        selector: 'p:nth-of-type(6)'
        quote: 'Model registration validates the configured models, domains, intrinsics and state slots and resolves their precedence. Replacing a standard model requires an explicit declaration, repeated identifiers and ambiguous priorities are rejected, and the resulting registry is the only place a query consults for a model decision.'
    tests:
      -
        runner: unit
        target: 'Tests\Unit\Model\Registration\RegistryTest::testRegisterRequiresExplicitStandardReplacementIntent'
      -
        runner: unit
        target: 'Tests\Unit\Model\Registration\RegistryTest::testPreferredPreservesTheSemanticContract'
    category: models
  -
    id: PIPE-MODEL-002
    statement: 'When a query asks for a model decision, the registry shall return the decision of the selected model.'
    evidence:
      -
        selector: 'p:nth-of-type(6)'
        quote: 'Model registration validates the configured models, domains, intrinsics and state slots and resolves their precedence. Replacing a standard model requires an explicit declaration, repeated identifiers and ambiguous priorities are rejected, and the resulting registry is the only place a query consults for a model decision.'
    tests:
      -
        runner: unit
        target: 'Tests\Unit\Model\Registration\RegistryTest::testDescribeReturnsTheSelectedPlan'
    category: models
  -
    id: PIPE-SNAPSHOT-001
    statement: 'The snapshot identity shall depend only on normalized sources, model manifest, environment, dependency versions and target profile.'
    evidence:
      -
        selector: 'p:nth-of-type(7)'
        quote: 'The snapshot identity is computed from the normalized sources, the registered model manifest, the environment, the dependency versions and the target profile. Two sessions with equal identities answer every query identically, and a change to any of those inputs changes the identity. File order does not.'
    tests:
      -
        runner: unit
        target: 'Tests\Unit\Session\SnapshotIdentityTest::testIdDependsOnlyOnSourcesModelsEnvironmentAndTarget'
      -
        runner: unit
        target: 'Tests\Unit\Session\SnapshotIdentityTest::testSnapshotPublishesTheIdentityWithTheDeclarationDiagnostics'
      -
        runner: unit
        target: 'Tests\Unit\Session\SessionTest::testSnapshotCapturesFileHash'
    category: snapshot
  -
    id: PIPE-INDEX-001
    statement: 'When the definition index is built, the index shall record definitions, predecessors, positions, callers and property writes without deriving the value of any instruction.'
    evidence:
      -
        selector: 'p:nth-of-type(8)'
        quote: 'Definition indexing records, for every lowered body, its definitions, predecessor edges, positions and return origins, together with the callers and declared property writes across the program. Building an index never derives the value of an instruction.'
    tests:
      -
        runner: unit
        target: 'Tests\Unit\Candidate\Index\DefinitionIndexTest::testGraphDoesNotDeriveACompiledBody'
      -
        runner: unit
        target: 'Tests\Unit\Candidate\Index\DefinitionIndexTest::testCallersKeepsAllMatchingSites'
      -
        runner: unit
        target: 'Tests\Unit\Candidate\Index\DefinitionIndexTest::testWritesCollectsOnlyTheRequestedDeclaration'
      -
        runner: unit
        target: 'Tests\Unit\Candidate\Index\BodyIndexTest::testReturnsIndexesAllReturnOriginsWithoutEvaluatingThem'
    category: index
  -
    id: PIPE-SELECT-001
    statement: 'When a query is resolved, the target selection shall bind it to its owning callable and selected definition.'
    evidence:
      -
        selector: 'p:nth-of-type(9)'
        quote: 'Target selection binds a query to one point of the program. Every reference the query carries must belong to the current snapshot and identify a lowered instruction, and the result names the owning callable, the kind of definition selected and the registers or storage point it selects. Later stages read the target and never inspect the query again.'
    tests:
      -
        runner: unit
        target: 'Tests\Unit\Analysis\Selection\TargetResolutionTest::testResolveBindsEverySupportedQueryFormToItsOwnerAndSelection'
      -
        runner: unit
        target: 'Tests\Unit\Analysis\Selection\QueryValidationTest::testOwnerResolvesEachSupportedObservationForm'
    category: selection
  -
    id: PIPE-SELECT-002
    statement: 'If a query carries a reference from another snapshot or one that identifies no lowered instruction, then the target selection shall reject the query.'
    evidence:
      -
        selector: 'p:nth-of-type(9)'
        quote: 'Target selection binds a query to one point of the program. Every reference the query carries must belong to the current snapshot and identify a lowered instruction, and the result names the owning callable, the kind of definition selected and the registers or storage point it selects. Later stages read the target and never inspect the query again.'
    tests:
      -
        runner: unit
        target: 'Tests\Unit\Analysis\Selection\TargetResolutionTest::testResolveRejectsAReferenceFromAnotherSnapshot'
      -
        runner: unit
        target: 'Tests\Unit\Analysis\Selection\QueryValidationTest::testReferenceRejectsForeignSnapshots'
      -
        runner: unit
        target: 'Tests\Unit\Analysis\Selection\QueryValidationTest::testReferenceRejectsEveryMismatchedIdentityComponent'
    category: selection
  -
    id: PIPE-DEMAND-001
    statement: 'When a demand is placed, the engine shall create one frame per entry of the query scope, or one source frame for a symbolic scope, and answer with one candidate graph.'
    evidence:
      -
        selector: 'p:nth-of-type(10)'
        quote: 'Placing the demand creates one frame per entry declared by the query scope, or one source frame when the scope is symbolic, and asks the engine for the selected definition in each frame. The owner is a single candidate graph of alternatives; a symbol without captured source stays an unexpanded reference.'
    tests:
      -
        runner: unit
        target: 'Tests\Unit\Candidate\DemandTest::testFramesKeepExplicitBindingsOutOfOtherQueries'
      -
        runner: unit
        target: 'Tests\Unit\Candidate\DemandTest::testTupleKeepsTheSelectedNames'
      -
        runner: unit
        target: 'Tests\Unit\Candidate\DemandTest::testReturnsRetainsConditionalImplementations'
    category: demand
  -
    id: PIPE-DEMAND-002
    statement: 'If the owner of a target has no captured source, then the engine shall keep it as an unexpanded reference.'
    evidence:
      -
        selector: 'p:nth-of-type(10)'
        quote: 'Placing the demand creates one frame per entry declared by the query scope, or one source frame when the scope is symbolic, and asks the engine for the selected definition in each frame. The owner is a single candidate graph of alternatives; a symbol without captured source stays an unexpanded reference.'
    tests:
      -
        runner: unit
        target: 'Tests\Unit\Candidate\DemandTest::testSelectKeepsAMissingSymbolAsAnUnexpandedReference'
    category: demand
  -
    id: PIPE-EXPAND-001
    statement: 'When a definition is expanded, the engine shall select replacement rules and models before demanding any source body or input.'
    evidence:
      -
        selector: 'p:nth-of-type(11)'
        quote: 'Backward expansion opens the selected definition into the definitions and inputs it depends on, under the query budget. Replacement rules and models are selected before any source body or input is demanded, unrelated calls and branches are not opened, equal dependencies share one node, and whatever cannot be opened remains in the graph as a residual with its reason.'
    tests:
      -
        runner: unit
        target: 'Tests\Unit\Candidate\ModelsTest::testGraphReplacesSourceWithoutDemandingUnusedInputs'
      -
        runner: unit
        target: 'Tests\Unit\Candidate\Invocation\RulesTest::testApplySkipsUndemandedInputs'
    category: expansion
  -
    id: PIPE-EXPAND-002
    statement: 'When a definition is expanded, the engine shall not open unrelated calls or branches and share one node for equal dependencies.'
    evidence:
      -
        selector: 'p:nth-of-type(11)'
        quote: 'Backward expansion opens the selected definition into the definitions and inputs it depends on, under the query budget. Replacement rules and models are selected before any source body or input is demanded, unrelated calls and branches are not opened, equal dependencies share one node, and whatever cannot be opened remains in the graph as a residual with its reason.'
    tests:
      -
        runner: unit
        target: 'Tests\Unit\Candidate\DerivationTest::testReturnsIgnoresUnrelatedCalls'
      -
        runner: unit
        target: 'Tests\Unit\Candidate\DerivationTest::testValueSharesImmutableDependencyNodes'
      -
        runner: unit
        target: 'Tests\Unit\Candidate\DerivationTest::testPhiPrunesAKnownCondition'
    category: expansion
  -
    id: PIPE-EXPAND-003
    statement: 'If a dependency cannot be opened, then the engine shall keep it in the graph as a residual with its reason.'
    evidence:
      -
        selector: 'p:nth-of-type(11)'
        quote: 'Backward expansion opens the selected definition into the definitions and inputs it depends on, under the query budget. Replacement rules and models are selected before any source body or input is demanded, unrelated calls and branches are not opened, equal dependencies share one node, and whatever cannot be opened remains in the graph as a residual with its reason.'
    tests:
      -
        runner: unit
        target: 'Tests\Unit\Candidate\DerivationTest::testInstructionKeepsTheOperatorWithAnUnknownOperand'
      -
        runner: unit
        target: 'Tests\Unit\Analysis\Candidates\CandidateCollectorTest::testFrontiersCarryTheUnresolvedInputIdentity'
    category: expansion
  -
    id: PIPE-COLLECT-001
    statement: 'When a candidate graph is collected, the collector shall fold equal values into one candidate and keep every derivation as its own evidence alternative under an observation root naming the target.'
    evidence:
      -
        selector: 'p:nth-of-type(12)'
        quote: 'Collection enumerates the alternatives of the candidate graph, folds equal values into one candidate, and keeps every derivation as its own evidence alternative under an observation root that names the target. The candidate limit, the residual dependencies and a stopped expansion are reported separately, and the collection is the only object the session returns for a query.'
    tests:
      -
        runner: unit
        target: 'Tests\Unit\Analysis\Candidates\CandidateCollectorTest::testCollectKeepsOneSymbolicCandidateSeparateFromEnumeration'
      -
        runner: unit
        target: 'Tests\Unit\Analysis\Candidates\CandidateCollectorTest::testCollectRetainsTheRequestedSourceRangeAtTheEvidenceRoot'
      -
        runner: unit
        target: 'Tests\Unit\Analysis\Candidates\ObservationRootTest::testOfIdentifiesTheTargetAboveTheValueForest'
    category: collection
  -
    id: PIPE-COLLECT-002
    statement: 'When the candidate limit is reached, the collector shall report the remaining alternatives as one unexpanded choice.'
    evidence:
      -
        selector: 'p:nth-of-type(12)'
        quote: 'Collection enumerates the alternatives of the candidate graph, folds equal values into one candidate, and keeps every derivation as its own evidence alternative under an observation root that names the target. The candidate limit, the residual dependencies and a stopped expansion are reported separately, and the collection is the only object the session returns for a query.'
    tests:
      -
        runner: unit
        target: 'Tests\Unit\Candidate\Enumeration\EnumeratorTest::testRemainderRetainsTheCurrentAndUnvisitedValues'
      -
        runner: unit
        target: 'Tests\Unit\Candidate\Enumeration\EnumeratorTest::testHasRemainingDoesNotConsumeTheFrontier'
    category: collection
  -
    id: PIPE-EXPORT-001
    statement: 'When a candidate collection is exported, the export shall contain the four candidate fields and redact secret values.'
    evidence:
      -
        selector: 'p:nth-of-type(13)'
        quote: 'Export writes a candidate collection as JSON with four fields per candidate, and replay rederives the same query from the same captured source and configuration and compares the complete export. A changed value, derivation or manifest is reported as a mismatch.'
    tests:
      -
        runner: unit
        target: 'Tests\Unit\Result\Candidates\CandidateCollectionTest::testJsonSerializeUsesOnlyCandidateFields'
      -
        runner: unit
        target: 'Tests\Unit\Result\Candidates\CandidateCollectionTest::testToJsonRedactsSecretValues'
    category: export
  -
    id: PIPE-EXPORT-002
    statement: 'If a replayed export differs from the rederived export in any value, derivation or manifest, then the replay shall report a mismatch.'
    evidence:
      -
        selector: 'p:nth-of-type(13)'
        quote: 'Export writes a candidate collection as JSON with four fields per candidate, and replay rederives the same query from the same captured source and configuration and compares the complete export. A changed value, derivation or manifest is reported as a mismatch.'
    tests:
      -
        runner: unit
        target: 'Tests\Unit\ReplayTest::testVerifyDetectsChangedValues'
      -
        runner: unit
        target: 'Tests\Unit\Analysis\Candidates\ReplayTest::testVerifyStillRevalidatesThroughTheFormerName'
    category: export
