security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: auto
    providers:
        users:
            entity: { class: App\Entity\User, property: email }
    firewalls:
        main:
            lazy: true
            provider: users
            user_checker: App\Security\ActiveUserChecker
            form_login:
                login_path: login
                check_path: login
                enable_csrf: true
                default_target_path: home
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
            login_throttling: { max_attempts: 5, interval: '1 minute' }
            logout: { path: logout, target: home, enable_csrf: true }
    access_control:
        - { path: '^/api/(session|register|login|verify)', roles: PUBLIC_ACCESS }
        - { path: '^/api', roles: ROLE_USER }
        - { path: '^/(login|register|verify)', roles: PUBLIC_ACCESS }
        - { path: '^/manage', roles: ROLE_USER }
when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
