# Keep parser nodes inside the frontend and extension contracts outside the evaluator.
deptrac:
  paths: [./src]
  analyser:
    types: [class, use]
  layers:
    - name: Facade
      collectors:
        - type: classLike
          value: '^Deriver\\(Analyzer$|Internal\\Api\\)'
    - name: Contracts
      collectors:
        - type: classLike
          value: '^Deriver\\(Api|Model|Value)\\'
    - name: Reporting
      collectors:
        - type: classLike
          value: '^Deriver\\Report\\'
    - name: Frontend
      collectors:
        - type: classLike
          value: '^Deriver\\Internal\\Frontend\\'
    - name: IR
      collectors:
        - type: classLike
          value: '^Deriver\\Internal\\IR\\'
    - name: Solver
      collectors:
        - type: classLike
          value: '^Deriver\\Internal\\Solver\\'
    - name: Memory
      collectors:
        - type: classLike
          value: '^Deriver\\Internal\\Memory\\'
    - name: Constraints
      collectors:
        - type: classLike
          value: '^Deriver\\Internal\\Constraint\\'
    - name: ValueSemantics
      collectors:
        - type: classLike
          value: '^Deriver\\Internal\\Value\\'
    - name: ModelRuntime
      collectors:
        - type: classLike
          value: '^Deriver\\Internal\\Model\\'
    - name: Standard
      collectors:
        - type: classLike
          value: '^Deriver\\Standard\\'
    - name: PhpParser
      collectors:
        - type: classLike
          value: '^PhpParser\\'
  ruleset:
    Facade: [Contracts, Reporting, Frontend, IR, Solver, ModelRuntime, ValueSemantics]
    Contracts: [Reporting]
    Reporting: [Contracts, ValueSemantics]
    Frontend: [Contracts, IR, PhpParser]
    IR: [Contracts]
    Solver: [Contracts, IR, Memory, Constraints, ValueSemantics, ModelRuntime, Standard]
    Memory: [Contracts, ValueSemantics]
    Constraints: [Contracts, Solver, ValueSemantics, ModelRuntime]
    ValueSemantics: [Contracts, ModelRuntime]
    ModelRuntime: [Contracts, IR, ValueSemantics, Standard]
    Standard: [Contracts, ValueSemantics]
    PhpParser: []
