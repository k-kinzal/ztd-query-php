deptrac:
  paths: [./src]
  analyser:
    types: [class, use]
  layers:
    - name: Command
      collectors:
        - type: classLike
          value: '^Deriver\\Command\\.*'
    - name: Configuration
      collectors:
        - type: classLike
          value: '^Deriver\\Configuration\\.*'
    - name: Reporter
      collectors:
        - type: classLike
          value: '^Deriver\\Reporter\\.*'
    - name: Finder
      collectors:
        - type: classLike
          value: '^Deriver\\Finder(\\|$)'
    - name: Deriver
      collectors:
        - type: bool
          must:
            - type: classLike
              value: '^Deriver\\Deriver(\\|$)'
          must_not:
            - type: classLike
              value: '^Deriver\\Deriver\\(Sources|Parser|Resolver|Lowerer|Evaluator|Query|Candidate)(\\|$)'
    - name: Exception
      collectors:
        - type: classLike
          value: '^Deriver\\Exception\\.*'
    - name: Deriver.Sources
      collectors:
        - type: classLike
          value: '^Deriver\\Deriver\\Sources\\.*'
    - name: Deriver.Parser
      collectors:
        - type: classLike
          value: '^Deriver\\Deriver\\Parser\\.*'
    - name: Deriver.Resolver
      collectors:
        - type: classLike
          value: '^Deriver\\Deriver\\Resolver\\.*'
    - name: Deriver.Lowerer
      collectors:
        - type: classLike
          value: '^Deriver\\Deriver\\Lowerer\\.*'
    - name: Deriver.Evaluator
      collectors:
        - type: classLike
          value: '^Deriver\\Deriver\\Evaluator\\.*'
    - name: Deriver.Query
      collectors:
        - type: classLike
          value: '^Deriver\\Deriver\\Query(\\|$)'
    - name: Deriver.Candidate
      collectors:
        - type: classLike
          value: '^Deriver\\Deriver\\Candidate(\\|$)'
    - name: PhpParser
      collectors:
        - type: classLike
          value: '^PhpParser\\.*'
    - name: SymfonyConsole
      collectors:
        - type: classLike
          value: '^Symfony\\Component\\Console\\.*'
    - name: SymfonyYaml
      collectors:
        - type: classLike
          value: '^Symfony\\Component\\Yaml\\.*'
  ruleset:
    Command: [Configuration, Finder, Deriver, Deriver.Candidate, Reporter, Exception, SymfonyConsole]
    Configuration: [Exception, SymfonyYaml]
    Reporter: [Deriver.Candidate, Deriver.Evaluator, Deriver.Sources, Exception]
    Finder: [Exception]
    Deriver: [Deriver.Sources, Deriver.Parser, Deriver.Resolver, Deriver.Lowerer, Deriver.Evaluator, Deriver.Query, Deriver.Candidate, Exception, PhpParser]
    Exception: []
    Deriver.Sources: [Exception]
    Deriver.Parser: [Deriver.Sources, Exception, PhpParser]
    Deriver.Resolver: [Deriver.Parser, Exception, PhpParser]
    Deriver.Evaluator: [Deriver.Lowerer, Deriver.Sources, Exception]
    Deriver.Candidate: [Deriver.Evaluator, Deriver.Sources]
    Deriver.Lowerer: [Deriver.Parser, Deriver.Sources, Exception, PhpParser, Deriver.Resolver]
    Deriver.Query: [Exception]
    PhpParser: []
    SymfonyConsole: []
    SymfonyYaml: []
