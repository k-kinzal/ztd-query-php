deptrac:
  paths: [./src]
  analyser:
    types: [class, use]
  layers:
    - name: Diagnostic
      collectors:
        - type: classLike
          value: '^SqlSemantics\\Diagnostic\\.*'
    - name: Lowering
      collectors:
        - type: classLike
          value: '^SqlSemantics\\Lowering\\.*'
    - name: Model
      collectors:
        - type: classLike
          value: '^SqlSemantics\\(Statement|Contract|Construction|Resolution|Rendering)\\.*'
    - name: Validation
      collectors:
        - type: classLike
          value: '^SqlSemantics\\Validation\\.*'
    - name: Facade
      collectors:
        - type: classLike
          value: '^SqlSemantics\\Facade\\.*'
    - name: Parser
      collectors:
        - type: classLike
          value: '^SqlParser\\(Parser|Lexer|Resource)\\.*'
  ruleset:
    Diagnostic: [Lowering]
    Lowering: [Diagnostic, Parser]
    Model: [Diagnostic, Lowering, Parser, Validation]
    Validation: [Diagnostic, Lowering, Model, Parser]
    Facade: [Diagnostic, Lowering, Model, Validation, Parser]
    Parser: []
