deptrac:
  paths: [./src]
  analyser:
    types: [class, use]
  layers:
    - name: API
      collectors:
        - type: classNameRegex
          value: '/^SqlSemantics\\(Binder|SchemaBuilder|StatementFactory)$/'
    - name: Foundation
      collectors:
        - type: classNameRegex
          value: '/^SqlSemantics\\(Dialect|SemanticException)$/'
    - name: Syntax
      collectors:
        - type: classNameRegex
          value: '/^SqlSemantics\\Ast\\(DialectParser|Identifiers|StatementList|TokenGroups|Tree)$/'
    - name: Binding
      collectors:
        - type: directory
          value: 'src/Binding/'
        - type: classNameRegex
          value: '/^SqlSemantics\\Ast\\(?!(DialectParser|Identifiers|StatementList|TokenGroups|Tree)$)/'
    - name: Structure
      collectors:
        - type: directory
          value: 'src/Model/'
        - type: directory
          value: 'src/Schema/'
        - type: directory
          value: 'src/Type/'
        - type: directory
          value: 'src/Serialization/'
        - type: classNameRegex
          value: '/^SqlSemantics\\(Schema|Serializer|SimpleSerializer|InvalidSql)$/'
    - name: Parser
      collectors:
        - type: classNameRegex
          value: '/^SqlParser\\/'
  ruleset:
    API: [Foundation, Syntax, Binding, Structure, Parser]
    Foundation: [Parser]
    Syntax: [Foundation, Parser]
    Binding: [Foundation, Syntax, Structure, Parser]
    Structure: [Foundation, Syntax, Parser]
    Parser: []
