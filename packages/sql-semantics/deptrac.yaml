deptrac:
  paths: [./src]
  analyser:
    types: [class, use]
  layers:
    - name: Statements
      collectors:
        - type: classLike
          value: '^SqlSemantics\\Statement\\.*'
    - name: Core
      collectors:
        - type: classLike
          value: '^SqlSemantics\\Core\\.*'
    - name: Facade
      collectors:
        - type: classLike
          value: '^SqlSemantics\\Facade\\.*'
    - name: ParserCore
      collectors:
        - type: classLike
          value: '^SqlParser\\(Parser|Lexer)\\.*'
  ruleset:
    Statements: []
    Core: [ParserCore, Statements]
    Facade: [Core, Statements]
    ParserCore: []
