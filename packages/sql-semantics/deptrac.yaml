deptrac:
  paths: [./src, ./resources/models]
  analyser:
    types: [class, use]
  layers:
    - name: Statements
      collectors:
        - type: classLike
          value: '^SqlSemantics\\Statement\\.*'
    - name: Core
      collectors:
        - type: classLike
          value: '^SqlSemantics\\Core\\.*'
    - name: MySql
      collectors:
        - type: classLike
          value: '^SqlSemantics\\Platform\\MySql\\.*'
    - name: PostgreSql
      collectors:
        - type: classLike
          value: '^SqlSemantics\\Platform\\PostgreSql\\.*'
    - name: Sqlite
      collectors:
        - type: classLike
          value: '^SqlSemantics\\Platform\\Sqlite\\.*'
    - name: Facade
      collectors:
        - type: classLike
          value: '^SqlSemantics\\Facade\\.*'
    - name: ParserCore
      collectors:
        - type: classLike
          value: '^SqlParser\\(Parser|Lexer)\\.*'
    - name: ParserMySql
      collectors:
        - type: classLike
          value: '^SqlParser\\MySql\\.*'
    - name: ParserPostgreSql
      collectors:
        - type: classLike
          value: '^SqlParser\\PostgreSql\\.*'
    - name: ParserSqlite
      collectors:
        - type: classLike
          value: '^SqlParser\\Sqlite\\.*'
  ruleset:
    Statements: []
    Core: [ParserCore, Statements]
    MySql: [Core, ParserCore, ParserMySql]
    PostgreSql: [Core, ParserCore, ParserPostgreSql]
    Sqlite: [Core, ParserCore, ParserSqlite]
    Facade: [Core, Statements, MySql, PostgreSql, Sqlite]
    ParserCore: []
    ParserMySql: []
    ParserPostgreSql: []
    ParserSqlite: []
