# NOTE: You do not have permission to overwrite this file. Please ask a human operator to perform the changes for you.
scan:
  roots:
    - src
  exclude: []

policies:
  standard:
    limits:
      file:
        lines: 500
        ncloc: 350
      class:
        lines: 400
      trait:
        lines: 300
      interface:
        lines: 200
      enum:
        lines: 200
      function:
        lines: 50
        cyclomatic_complexity: 20
      method:
        lines: 50
        cyclomatic_complexity: 20

  # These two mirror PDO and PDOStatement, so their length is the surface they
  # have to carry, not work that could be moved somewhere else. Only the file and
  # class limits move; a method that forwards one call stays short, so method
  # length and complexity keep the standard limits.
  native-api-adapter:
    extends: standard
    limits:
      file:
        lines: 650
      class:
        lines: 600


apply:
  default: standard
  rules:
    - name: native-api-adapters
      match:
        paths:
          - 'src/ZtdPdo.php'
          - 'src/ZtdPdoStatement.php'
      policy: native-api-adapter

report:
  reporter: ai
  order_by:
    - path
    - line
    - rule
