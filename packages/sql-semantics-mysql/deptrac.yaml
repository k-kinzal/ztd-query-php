deptrac:
  paths: [./src]
  analyser:
    types: [class, use]
  layers:
    - name: Core
      collectors:
        - type: classLike
          value: '^SqlSemantics\\(Diagnostic|Contract|Statement|Construction|Resolution|Rendering|Lowering|Validation|Facade)\\.*'
    - name: Parser
      collectors:
        - type: classLike
          value: '^SqlParser\\.*'
    - name: Model
      collectors:
        - type: classLike
          value: '^SqlSemantics\\Platform\\MySql\\Statement\\.*'
    - name: Rules
      collectors:
        - type: classLike
          value: '^SqlSemantics\\Platform\\MySql\\(Rules|Rendering|Profile)\\.*'
    - name: PlatformLowering
      collectors:
        - type: classLike
          value: '^SqlSemantics\\Platform\\MySql\\Lowering\\.*'
    - name: Wiring
      collectors:
        - type: classLike
          value: '^SqlSemantics\\Platform\\MySql\\[A-Za-z]+$'
  ruleset:
    Core: [Parser]
    Parser: []
    Model: [Core, Rules]
    Rules: [Core, Model, Parser]
    PlatformLowering: [Core, Model, Rules, Parser]
    Wiring: [Core, Model, Rules, PlatformLowering, Parser]
