deptrac:
  paths: [./src]
  analyser:
    types: [class, use]
  layers:
    - name: Core
      collectors:
        - type: classLike
          value: '^SqlSemantics\\(AnalysisContext|AnalysisException|Analyzer|IrAnalyzer|Query|SemanticsIR|Contract\\(Dialect|Mode))$'
    - name: DatabaseModel
      collectors:
        - type: classLike
          value: '^SqlSemantics\\Platform\\MySql\\Model\\.*'
    - name: Ir
      collectors:
        - type: classLike
          value: '^SqlSemantics\\Platform\\MySql\\Ir\\.*'
    - name: Parser
      collectors:
        - type: classLike
          value: '^SqlParser\\.*'
    - name: Model
      collectors:
        - type: classLike
          value: '^SqlSemantics\\Platform\\MySql\\Statement\\.*'
    - name: Rules
      collectors:
        - type: classLike
          value: '^SqlSemantics\\Platform\\MySql\\(Rules|Rendering|Profile)\\.*'
    - name: PlatformLowering
      collectors:
        - type: classLike
          value: '^SqlSemantics\\Platform\\MySql\\Lowering\\.*'
    - name: Wiring
      collectors:
        - type: classLike
          value: '^SqlSemantics\\Platform\\MySql\\[A-Za-z]+$'
  ruleset:
    Core: []
    DatabaseModel: [Core, Parser, Wiring]
    Ir: [Core, DatabaseModel, Model, Rules, Wiring]
    Parser: []
    Model: [Core, DatabaseModel, Rules]
    Rules: [Core, DatabaseModel, Model, Parser]
    PlatformLowering: [Core, DatabaseModel, Model, Rules, Parser]
    Wiring: [Core, DatabaseModel, Model, Rules, PlatformLowering, Parser, Ir]
