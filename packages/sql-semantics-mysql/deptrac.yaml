deptrac:
  paths: [./src]
  analyser:
    types: [class, use]
  layers:
    - name: Core
      collectors:
        - type: classLike
          value: '^SqlSemantics\\(AnalysisContext|AnalysisException|Analyzer|SemanticsIR|Contract\\(Dialect|Mode))$'
    - name: DatabaseModel
      collectors:
        - type: classLike
          value: '^SqlSemantics\\Platform\\MySql\\Model\\(?!Statement\\Declaration\\(?:ForeignKeyIndexSide|IndexRemovalTarget)$).*'
    - name: IndexConstructionInputs
      collectors:
        - type: classLike
          value: '^SqlSemantics\\Platform\\MySql\\Model\\Statement\\Declaration\\(?:ForeignKeyIndexSide|IndexRemovalTarget)$'
    - name: IrIndexCoordinates
      collectors:
        - type: classLike
          value: '^SqlSemantics\\Platform\\MySql\\Ir\\(?:Identifier|From\\ExternalRelationKind|Schema\\(?:TableName|Identity\\TableIdentity|Index\\(?:IndexIdentity|IndexRole|IndexAutoIncrement)|ForeignKey\\Add\\Catalog\\ForeignKeyConstraintIdentity))$'
    - name: Ir
      collectors:
        - type: classLike
          value: '^SqlSemantics\\Platform\\MySql\\Ir\\(?!(?:Identifier|From\\ExternalRelationKind|Schema\\(?:TableName|Identity\\TableIdentity|Index\\(?:IndexIdentity|IndexRole|IndexAutoIncrement)|ForeignKey\\Add\\Catalog\\ForeignKeyConstraintIdentity))$).*'
    - name: Parser
      collectors:
        - type: classLike
          value: '^SqlParser\\.*'
    - name: Model
      collectors:
        - type: classLike
          value: '^SqlSemantics\\Platform\\MySql\\Statement\\.*'
    - name: Rules
      collectors:
        - type: classLike
          value: '^SqlSemantics\\Platform\\MySql\\(Rules|Rendering|Profile)\\.*'
    - name: PlatformLowering
      collectors:
        - type: classLike
          value: '^SqlSemantics\\Platform\\MySql\\Lowering\\.*'
    - name: Wiring
      collectors:
        - type: classLike
          value: '^SqlSemantics\\Platform\\MySql\\[A-Za-z]+$'
  ruleset:
    Core: []
    DatabaseModel: [Core, Parser, Wiring]
    IndexConstructionInputs: [DatabaseModel, IrIndexCoordinates]
    IrIndexCoordinates: [DatabaseModel]
    Ir: [Core, DatabaseModel, IndexConstructionInputs, IrIndexCoordinates, Model, Rules, Wiring]
    Parser: []
    Model: [Core, DatabaseModel, Rules]
    Rules: [Core, DatabaseModel, Model, Parser]
    PlatformLowering: [Core, DatabaseModel, Model, Rules, Parser]
    Wiring: [Core, DatabaseModel, IrIndexCoordinates, Model, Rules, PlatformLowering, Parser, Ir]
