name: Build package documentation
description: Build the shared documentation site from the package manifests, tests, and architecture definitions.
inputs:
  diff-base:
    description: Base revision for a pull request preview
    required: false
    default: ''
  preview-number:
    description: Pull request number used in the preview URL
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
      with:
        php-version: '8.3'
        extensions: mbstring, pcntl, gd, mysqli, pdo_mysql, dom, xml, xmlwriter
        coverage: pcov
    - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
      with:
        working-directory: packages/sql-faker
        dependency-versions: locked
        composer-options: --prefer-dist
        require-lock-file: true
    - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
      with:
        working-directory: packages/ztd-query-mysqli-adapter
        dependency-versions: locked
        composer-options: --prefer-dist
        require-lock-file: true
    - name: Validate the locked dependencies
      shell: bash
      run: |
        for package in sql-faker ztd-query-mysqli-adapter; do
          composer --working-dir="packages/$package" validate --strict --no-check-publish
          composer --working-dir="packages/$package" check-platform-reqs
        done
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: build/docgen-cache
        key: docgen-${{ runner.os }}-${{ hashFiles('packages/sql-faker/composer.lock', 'packages/ztd-query-mysqli-adapter/composer.lock') }}-${{ github.sha }}
        restore-keys: |
          docgen-${{ runner.os }}-${{ hashFiles('packages/sql-faker/composer.lock', 'packages/ztd-query-mysqli-adapter/composer.lock') }}-
          docgen-${{ runner.os }}-
    - name: Generate coverage for both packages
      shell: bash
      run: |
        composer --working-dir=packages/sql-faker test -- --coverage-xml build/coverage-xml
        composer --working-dir=packages/ztd-query-mysqli-adapter test:coverage
    - name: Combine the package metadata
      shell: bash
      run: php "$GITHUB_ACTION_PATH/prepare-metadata.php" packages/sql-faker packages/ztd-query-mysqli-adapter
    - name: Generate the shared site
      shell: bash
      env:
        DOCS_DIFF_BASE: ${{ inputs.diff-base }}
        DOCS_PREVIEW_NUMBER: ${{ inputs.preview-number }}
      run: |
        set -euo pipefail
        repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
        base_url="https://${repository%%/*}.github.io/${repository#*/}"
        arguments=()
        if [ -n "$DOCS_PREVIEW_NUMBER" ]; then
          base_url="$base_url/pr/$DOCS_PREVIEW_NUMBER"
        fi
        if [ -n "$DOCS_DIFF_BASE" ]; then
          arguments+=(--diff="$DOCS_DIFF_BASE")
        fi
        packages/ztd-query-mysqli-adapter/vendor/bin/docgen \
          --packages=packages/sql-faker,packages/ztd-query-mysqli-adapter \
          --title=ztd-query-php --output=build/docs --cache-dir=build/docgen-cache \
          --deptrac=build/docgen-inputs/deptrac.yaml --coverage=build/docgen-inputs/coverage \
          --base-url="$base_url" "${arguments[@]}"
