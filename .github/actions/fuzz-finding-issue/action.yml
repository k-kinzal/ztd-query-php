name: Open an issue for fuzz findings
description: >-
  Reads a PHP-Fuzzer log and opens one issue for the inputs it reported as crashes that no open
  issue tracks yet. A finding never fails the calling job; only a failure to report it does.

inputs:
  package:
    description: Package directory under packages/, used for paths, labels and issue markers
    required: true
  target:
    description: Fuzz target name; together with the input hash it identifies a finding
    required: true
  script:
    description: PHP-Fuzzer entry script, relative to the package directory
    required: true
  log:
    description: PHP-Fuzzer output, relative to the package directory
    required: true
  artifact:
    description: Name of the workflow artifact that holds the log and the saved inputs
    required: true
  replay-env:
    description: Environment assignments the replay command needs, such as MYSQL_VERSION=8.4.7
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Open an issue for new findings
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      env:
        FUZZ_PACKAGE: ${{ inputs.package }}
        FUZZ_TARGET: ${{ inputs.target }}
        FUZZ_SCRIPT: ${{ inputs.script }}
        FUZZ_LOG: ${{ inputs.log }}
        FUZZ_ARTIFACT: ${{ inputs.artifact }}
        FUZZ_REPLAY_ENV: ${{ inputs.replay-env }}
      with:
        script: |
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const { FUZZ_PACKAGE: pkg, FUZZ_TARGET: target, FUZZ_SCRIPT: script, FUZZ_LOG: logFile, FUZZ_ARTIFACT: artifact, FUZZ_REPLAY_ENV: replayEnv } = process.env;
          const root = fs.realpathSync(path.resolve('packages', pkg));
          const logPath = path.join(root, logFile);
          if (!fs.existsSync(logPath)) {
            core.info(`No PHP-Fuzzer log at ${logPath}; nothing to report.`);
            return;
          }
          const log = fs.readFileSync(logPath, 'utf8');
          const findings = new Map();
          for (const match of log.matchAll(/^((?:CORPUS )?CRASH) in (.+)!$/gm)) {
            const reported = path.resolve(root, match[2]);
            if (!fs.existsSync(reported)) {
              continue;
            }
            const file = fs.realpathSync(reported);
            const input = fs.readFileSync(file);
            const hash = crypto.createHash('sha256').update(input).digest('hex');
            if (!findings.has(hash)) {
              findings.set(hash, { kind: match[1], file: path.relative(root, file), input, hash });
            }
          }
          if (findings.size === 0) {
            core.info('PHP-Fuzzer reported no findings.');
            return;
          }
          const marker = hash => `<!-- ${pkg}-fuzz:${target}:${hash} -->`;
          const open = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'open', per_page: 100 });
          const tracked = open.filter(issue => !issue.pull_request).map(issue => issue.body ?? '');
          const fresh = [...findings.values()].filter(finding => !tracked.some(body => body.includes(marker(finding.hash))));
          if (fresh.length === 0) {
            core.info(`All ${findings.size} findings are already tracked by open issues.`);
            return;
          }
          const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const replay = replayEnv === '' ? '' : `${replayEnv} `;
          const listed = fresh.slice(0, 20);
          const sections = listed.map(finding => [
            `### ${finding.kind === 'CRASH' ? 'Crash' : 'Corpus crash'} \`${finding.hash.slice(0, 12)}\``,
            ['```sh', `${replay}vendor/bin/php-fuzzer run-single ${script} '${finding.file}'`, '```'].join('\n'),
            finding.input.length <= 4096
              ? `Input (hex, restore with \`xxd -r -p\`): \`${finding.input.toString('hex') || '(empty)'}\``
              : `Input: ${finding.input.length} bytes, see the artifact.`,
          ].join('\n\n'));
          const body = [
            `PHP-Fuzzer reported ${fresh.length} new finding(s) for the \`${target}\` target of \`${pkg}\`.`,
            `Commit: ${context.sha}`,
            `Workflow run: ${run} (artifact \`${artifact}\`). Replay from \`packages/${pkg}\` after extracting the artifact there.`,
            fresh.map(finding => marker(finding.hash)).join('\n'),
            ...sections,
            fresh.length > listed.length ? `${fresh.length - listed.length} more finding(s) are in the artifact.` : '',
            '<details><summary>PHP-Fuzzer output</summary>',
            '', '```text', log.slice(-30000), '```', '</details>',
          ].join('\n\n');
          const created = await github.rest.issues.create({
            ...context.repo,
            title: `[${pkg} fuzz] ${target}: ${fresh[0].hash.slice(0, 12)}${fresh.length > 1 ? ` (+${fresh.length - 1})` : ''}`,
            body,
            labels: ['fuzz', 'type:bug', `package:${pkg}`],
          });
          core.notice(`Opened ${created.data.html_url} for ${fresh.length} fuzz finding(s).`);
