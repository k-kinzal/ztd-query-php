name: Merge Gatekeeper

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - stacked
  check_suite:
    types:
      - completed
  status: {}

jobs:
  merge-gatekeeper:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      checks: read
      statuses: read
    steps:
      - uses: upsidr/merge-gatekeeper@09af7a82c1666d0e64d2bd8c01797a0bcfd3bb5d # v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Mutation jobs may run for 60 minutes; allow their startup and queue time as well.
          timeout: 4200
