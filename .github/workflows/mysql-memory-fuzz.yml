name: Fuzz (mysql-memory)

on:
  pull_request:
    paths:
      - '.github/workflows/mysql-memory-fuzz.yml'
      - 'packages/mysql-memory/**'
      - 'packages/sql-parser/**'
      - 'packages/sql-semantics/**'
      - 'packages/sql-semantics-mysql/**'
      - 'packages/sql-faker/**'
      - 'packages/container/**'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      mysql_version:
        description: MySQL release whose supplied seeds and execution property are checked
        required: true
        default: '8.4.7'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  COMPOSER_NO_INTERACTION: '1'
  MYSQL_VERSION: ${{ inputs.mysql_version || '8.4.7' }}

jobs:
  fuzz:
    name: SQL execution / MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: packages/mysql-memory
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: bcmath, intl, mbstring, pdo, pdo_mysql, mysqli, dom, filter, hash, iconv, json, libxml, pcntl, pcre, phar, reflection, simplexml, spl, tokenizer, xml, xmlwriter
          coverage: none

      - name: Validate the Composer manifest and lock file
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          working-directory: packages/mysql-memory
          dependency-versions: locked
          composer-options: --prefer-dist
          require-lock-file: true

      - name: Check runtime platform requirements
        run: composer check-platform-reqs --no-dev

      - name: Replay the supplied SQL Faker seeds with PHP-Fuzzer
        run: |
          set -euo pipefail
          mkdir -p build/fuzz
          seeds="../sql-faker/seeds/mysql/mysql-$MYSQL_VERSION"
          test -d "$seeds"
          for profile in default HIGH_NOT_PRECEDENCE PIPES_AS_CONCAT diagnostics; do
            mode=''
            diagnostics=0
            case "$profile" in
              default) source="$seeds" ;;
              diagnostics) source="$seeds/diagnostics"; diagnostics=1 ;;
              *) source="$seeds/modes/$profile"; mode="$profile" ;;
            esac
            if [ ! -d "$source" ]; then continue; fi
            corpus="build/fuzz/seeds-$profile"
            mkdir -p "$corpus"
            cp "$source/"*.txt "$corpus/"
            SQLFAKER_SQL_MODE="$mode" SQLFAKER_DIAGNOSTICS="$diagnostics" \
              php -d memory_limit=-1 vendor/bin/php-fuzzer fuzz \
              fuzz/fuzz_mysql.php "$corpus/" --max-runs=0 --timeout=60 \
              2>&1 | tee "build/fuzz/seeds-$profile.log"
            if grep -Eq '(^|CORPUS )(CRASH|TIMEOUT) in |^PARSE ERROR|^INSTRUMENTATION BROKEN' "build/fuzz/seeds-$profile.log"; then
              exit 1
            fi
          done

      - name: Search for counterexamples for fifteen minutes without seeds
        env:
          MYSQL_MEMORY_FUZZ_SECONDS: '900'
        run: |
          set -euo pipefail
          corpus=$(mktemp -d)
          php -d memory_limit=-1 vendor/bin/php-fuzzer fuzz \
            fuzz/fuzz_mysql.php "$corpus/" --len-control-factor=1 --timeout=60 \
            2>&1 | tee build/fuzz/mysql.log
          grep -Eq '^Completed [1-9][0-9]* matching inputs in ' build/fuzz/mysql.log
          if grep -Eq '(^|CORPUS )(CRASH|TIMEOUT) in |^PARSE ERROR|^INSTRUMENTATION BROKEN' build/fuzz/mysql.log; then
            exit 1
          fi

      - name: Open an issue for a finding
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          FUZZ_TARGET: mysql
          FUZZ_SCRIPT: fuzz/fuzz_mysql.php
          MYSQL_VERSION: ${{ env.MYSQL_VERSION }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const target = process.env.FUZZ_TARGET;
            const script = process.env.FUZZ_SCRIPT;
            const root = path.resolve('packages/mysql-memory');
            const logPath = path.join(root, `build/fuzz/${target}.log`);
            if (!fs.existsSync(logPath)) return;
            const log = fs.readFileSync(logPath, 'utf8');
            const finding = log.match(/^(?:CORPUS )?CRASH in (.+)!$/m);
            if (!finding) return;
            const input = fs.readFileSync(path.resolve(root, finding[1]));
            const hash = crypto.createHash('sha256').update(input).digest('hex');
            const marker = `<!-- mysql-memory-fuzz:${target}:${hash} -->`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', per_page: 100
            });
            if (issues.some(issue => !issue.pull_request && issue.body?.includes(marker))) return;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              `PHP-Fuzzer found a statement on which mysql-memory and MySQL ${process.env.MYSQL_VERSION} differ, in the ${target} target.`,
              `Commit: ${context.sha}`,
              `Workflow and input artifact: ${run} (mysql-memory-fuzz-${target})`,
              'Run from packages/mysql-memory after extracting the artifact:',
              '```sh',
              `MYSQL_VERSION=${process.env.MYSQL_VERSION} php -d memory_limit=-1 vendor/bin/php-fuzzer run-single ${script} '${path.relative(root, path.resolve(root, finding[1]))}' --timeout=60`,
              '```',
              `Input SHA-256: ${hash}`,
              '<details><summary>PHP-Fuzzer output</summary>',
              '', '```text', log.slice(-45000), '```', '</details>'
            ].join('\n\n');
            await github.rest.issues.create({
              ...context.repo,
              title: `[mysql-memory fuzz] ${target}: ${hash.slice(0, 12)}`,
              body
            });

      - name: Upload PHP-Fuzzer counterexamples and output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mysql-memory-fuzz-mysql
          path: |
            packages/mysql-memory/crash-*
            packages/mysql-memory/timeout-*
            packages/mysql-memory/build/fuzz/
          if-no-files-found: ignore
          retention-days: 14
