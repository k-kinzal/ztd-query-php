name: Fuzz (mysql-memory)

on:
  pull_request:
    paths:
      - '.github/workflows/mysql-memory-fuzz.yml'
      - 'packages/mysql-memory/**'
      - 'packages/sql-parser/**'
      - 'packages/sql-semantics/**'
      - 'packages/sql-semantics-mysql/**'
      - 'packages/sql-faker/**'
      - 'packages/container/**'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      canonical_seeds:
        description: Replay the complete canonical SQL Faker corpus and require 100 percent matching grammar coverage
        required: false
        default: false
        type: boolean
      max_runs:
        description: Maximum inputs evaluated by each fuzz target after the seed corpus is replayed
        required: true
        default: '1000'
        type: string
      mysql_version:
        description: MySQL release to fuzz against
        required: false
        default: '8.4.7'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  COMPOSER_NO_INTERACTION: '1'
  MYSQL_VERSION: ${{ inputs.mysql_version || '8.4.7' }}

jobs:
  fuzz:
    if: inputs.canonical_seeds != true && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    name: Fuzz ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: expression
            script: fuzz/fuzz_expression.php
            corpus: fuzz/corpus/expression
          - name: query
            script: fuzz/fuzz_query.php
            corpus: fuzz/corpus/query
          - name: write
            script: fuzz/fuzz_write.php
            corpus: fuzz/corpus/write
          - name: statement
            script: fuzz/fuzz_statement.php
            corpus: fuzz/corpus/statement
    defaults:
      run:
        working-directory: packages/mysql-memory
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: bcmath, intl, mbstring, pdo, pdo_mysql, mysqli, dom, filter, hash, iconv, json, libxml, pcntl, pcre, phar, reflection, simplexml, spl, tokenizer, xml, xmlwriter
          coverage: none

      - name: Validate the Composer manifest and lock file
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          working-directory: packages/mysql-memory
          dependency-versions: locked
          composer-options: --prefer-dist
          require-lock-file: true

      - name: Check runtime platform requirements
        run: composer check-platform-reqs --no-dev

      - name: Validate the manual run budget
        env:
          FUZZ_MAX_RUNS: ${{ inputs.max_runs || '1000' }}
        run: |
          case "$FUZZ_MAX_RUNS" in
            ''|*[!0-9]*) echo 'max_runs must be a positive integer.' >&2; exit 2 ;;
          esac
          if [ "${#FUZZ_MAX_RUNS}" -gt 8 ] || [ "$FUZZ_MAX_RUNS" -lt 1 ]; then
            echo 'max_runs must be between 1 and 99999999.' >&2
            exit 2
          fi

      - name: Restore the evolving corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/mysql-memory/${{ matrix.target.corpus }}
          key: mysql-memory-corpus-v3-${{ matrix.target.name }}-${{ env.MYSQL_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mysql-memory-corpus-v3-${{ matrix.target.name }}-${{ env.MYSQL_VERSION }}-

      - name: Run PHP-Fuzzer
        env:
          FUZZ_MAX_RUNS: ${{ inputs.max_runs || '1000' }}
          FUZZ_SCRIPT: ${{ matrix.target.script }}
          FUZZ_CORPUS: ${{ matrix.target.corpus }}
          FUZZ_TARGET: ${{ matrix.target.name }}
        run: |
          set -euo pipefail
          mkdir -p build/fuzz "$FUZZ_CORPUS"
          php -d memory_limit=-1 vendor/bin/php-fuzzer fuzz \
            "$FUZZ_SCRIPT" \
            "$FUZZ_CORPUS/" \
            "--max-runs=$FUZZ_MAX_RUNS" --timeout=60 2>&1 | tee "build/fuzz/$FUZZ_TARGET.log"

      - name: Open an issue for a finding
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          FUZZ_TARGET: ${{ matrix.target.name }}
          FUZZ_SCRIPT: ${{ matrix.target.script }}
          MYSQL_VERSION: ${{ env.MYSQL_VERSION }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const target = process.env.FUZZ_TARGET;
            const script = process.env.FUZZ_SCRIPT;
            const root = path.resolve('packages/mysql-memory');
            const log = fs.readFileSync(path.join(root, `build/fuzz/${target}.log`), 'utf8');
            const finding = log.match(/^(?:CORPUS )?CRASH in (.+)!$/m);
            if (!finding) return;
            const input = fs.readFileSync(path.resolve(root, finding[1]));
            const hash = crypto.createHash('sha256').update(input).digest('hex');
            const marker = `<!-- mysql-memory-fuzz:${target}:${hash} -->`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', per_page: 100
            });
            if (issues.some(issue => !issue.pull_request && issue.body?.includes(marker))) return;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              `PHP-Fuzzer found a statement on which mysql-memory and MySQL ${process.env.MYSQL_VERSION} differ, in the ${target} target.`,
              `Commit: ${context.sha}`,
              `Workflow and input artifact: ${run} (mysql-memory-fuzz-${target})`,
              'Run from packages/mysql-memory after extracting the artifact:',
              '```sh',
              `MYSQL_VERSION=${process.env.MYSQL_VERSION} php -d memory_limit=-1 vendor/bin/php-fuzzer run-single ${script} '${path.relative(root, path.resolve(root, finding[1]))}' --timeout=60`,
              '```',
              `Input SHA-256: ${hash}`,
              '<details><summary>PHP-Fuzzer output</summary>',
              '', '```text', log.slice(-45000), '```', '</details>'
            ].join('\n\n');
            await github.rest.issues.create({
              ...context.repo,
              title: `[mysql-memory fuzz] ${target}: ${hash.slice(0, 12)}`,
              body
            });

      - name: Save the evolving corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/mysql-memory/${{ matrix.target.corpus }}
          key: mysql-memory-corpus-v3-${{ matrix.target.name }}-${{ env.MYSQL_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload PHP-Fuzzer inputs and output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mysql-memory-fuzz-${{ matrix.target.name }}
          path: |
            packages/mysql-memory/crash-*
            packages/mysql-memory/build/fuzz/${{ matrix.target.name }}.log
            packages/mysql-memory/${{ matrix.target.corpus }}/
          if-no-files-found: ignore
          retention-days: 14

  canonical-seeds:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.canonical_seeds == true)
    name: Canonical seed coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: packages/mysql-memory
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, mbstring, pdo, pdo_mysql, mysqli, dom, filter, hash, iconv, json, libxml, pcntl, pcre, phar, reflection, simplexml, spl, tokenizer, xml, xmlwriter
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          working-directory: packages/mysql-memory
          dependency-versions: locked
          composer-options: --prefer-dist
          require-lock-file: true

      - name: Replay every canonical seed with Testcontainers
        run: |
          set -euo pipefail
          mkdir -p build/fuzz
          composer fuzz:seeds 2>&1 | tee build/fuzz/canonical-seeds.log

      - name: Upload complete observations and coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mysql-memory-canonical-seeds-${{ env.MYSQL_VERSION }}
          path: packages/mysql-memory/build/fuzz/
          if-no-files-found: error
          retention-days: 14
