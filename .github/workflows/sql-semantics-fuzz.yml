name: Fuzz (sql-semantics)

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      max_runs:
        description: Maximum mutation iterations after the initial corpus is replayed
        required: true
        default: '10000'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  COMPOSER_NO_INTERACTION: '1'
  FUZZ_MAX_RUNS: ${{ inputs.max_runs || '10000' }}

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    name: Plan every target for every release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - name: Validate the manual run budget
        run: |
          case "$FUZZ_MAX_RUNS" in
            ''|*[!0-9]*) echo 'max_runs must be a positive integer.' >&2; exit 2 ;;
          esac
          if [ "${#FUZZ_MAX_RUNS}" -gt 8 ] || [ "$FUZZ_MAX_RUNS" -lt 1 ]; then
            echo 'max_runs must be between 1 and 99999999.' >&2
            exit 2
          fi
      - name: List the targets and releases
        id: plan
        run: |
          set -euo pipefail
          targets='[]'
          add() {
            targets=$(jq -c --arg d "$1" --arg p "$2" --arg s "$3" --arg r "$4" --arg seeds "$5" --arg image "${6:-}" --arg port "${7:-}" --arg dsn "${8:-}" --arg user "${9:-}" \
              '. + [{database: $d, package: $p, script: $s, release: $r, seeds: $seeds, image: $image, port: $port, dsn: $dsn, user: $user}]' <<< "$targets")
          }
          for release in 5.6.51 5.7.44 8.0.44 8.1.0 8.2.0 8.3.0 8.4.7 9.0.1 9.1.0; do
            case "$release" in
              8.4.* | 9.*) image="container-registry.oracle.com/mysql/community-server:$release" ;;
              *) image="mysql:$release" ;;
            esac
            add mysql sql-semantics-mysql fuzz_mysql_roundtrip.php "mysql-$release" mysql
            add mysql-splice sql-semantics-mysql fuzz_mysql_splice.php "mysql-$release" mysql
            add mysql-schema sql-semantics-mysql fuzz_mysql_schema.php "mysql-$release" ''
            add mysql-catalog sql-semantics-mysql fuzz_mysql_catalog.php "mysql-$release" '' "$image" 3306 'mysql:host=127.0.0.1;port=3306' root
          done
          for release in 16.6 17.2; do
            add pg sql-semantics-postgres fuzz_pg_roundtrip.php "pg-$release" pg
            add pg-splice sql-semantics-postgres fuzz_pg_splice.php "pg-$release" pg
            add pg-schema sql-semantics-postgres fuzz_pg_schema.php "pg-$release" ''
            add pg-catalog sql-semantics-postgres fuzz_pg_catalog.php "pg-$release" '' "postgres:$release" 5432 'pgsql:host=127.0.0.1;port=5432;dbname=postgres' postgres
          done
          add sqlite sql-semantics-sqlite fuzz_sqlite_roundtrip.php sqlite-3.47.2 sqlite
          add sqlite-splice sql-semantics-sqlite fuzz_sqlite_splice.php sqlite-3.47.2 sqlite
          add sqlite-schema sql-semantics-sqlite fuzz_sqlite_schema.php sqlite-3.47.2 ''
          add sqlite-catalog sql-semantics-sqlite fuzz_sqlite_catalog.php sqlite-3.47.2 ''
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: plan
    name: ${{ matrix.target.database }} / ${{ matrix.target.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    defaults:
      run:
        working-directory: packages/${{ matrix.target.package }}
    env:
      NAME: ${{ matrix.target.database }}-${{ matrix.target.release }}
      RELEASE: ${{ matrix.target.release }}
      SEMANTICS_DSN: ${{ matrix.target.dsn }}
      SEMANTICS_USERNAME: ${{ matrix.target.user }}
      SEMANTICS_PASSWORD: secret
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: mbstring, pcntl, zlib, pdo_mysql, pdo_pgsql, pdo_sqlite
          coverage: none
      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          working-directory: packages/${{ matrix.target.package }}
          dependency-versions: locked
          composer-options: --prefer-dist
          require-lock-file: true
      - name: Check runtime platform requirements
        run: composer check-platform-reqs --no-dev
      - name: Start the database server a catalog target compares with
        if: ${{ matrix.target.image != '' }}
        env:
          IMAGE: ${{ matrix.target.image }}
          PORT: ${{ matrix.target.port }}
        run: |
          docker run --detach --publish "127.0.0.1:$PORT:$PORT" --env MYSQL_ROOT_PASSWORD=secret --env MYSQL_ROOT_HOST=% --env POSTGRES_PASSWORD=secret "$IMAGE"
          for attempt in $(seq 1 90); do
            if php -r 'new PDO(getenv("SEMANTICS_DSN"), getenv("SEMANTICS_USERNAME"), getenv("SEMANTICS_PASSWORD"));' 2>/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo 'The database server did not accept connections.' >&2
          exit 1
      - name: Restore the evolving raw-input corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/${{ matrix.target.package }}/fuzz/corpus/${{ env.NAME }}
          key: sql-semantics-corpus-v2-${{ env.NAME }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sql-semantics-corpus-v2-${{ env.NAME }}-
      - name: Restore grammar coverage snapshots independently of the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/${{ matrix.target.package }}/fuzz/coverage/${{ matrix.target.database }}
          key: sql-semantics-coverage-v2-${{ env.NAME }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sql-semantics-coverage-v2-${{ env.NAME }}-
      - name: Copy sql-faker seed plans into the corpus
        if: ${{ matrix.target.seeds != '' }}
        env:
          SEEDS: ${{ matrix.target.seeds }}
        run: |
          mkdir -p "fuzz/corpus/$NAME"
          cp "../sql-faker/seeds/$SEEDS/$RELEASE/"* "fuzz/corpus/$NAME/"
      - name: Run PHP-Fuzzer
        env:
          SCRIPT: ${{ matrix.target.script }}
        run: |
          set -euo pipefail
          case "$RELEASE" in
            mysql-*) export MYSQL_VERSION="${RELEASE#mysql-}" ;;
            pg-*) export PG_VERSION="${RELEASE#pg-}" ;;
          esac
          mkdir -p build/fuzz "fuzz/corpus/$NAME"
          php -d memory_limit=-1 vendor/bin/php-fuzzer fuzz "fuzz/$SCRIPT" "fuzz/corpus/$NAME/" --timeout=60 \
            "--max-runs=$FUZZ_MAX_RUNS" 2>&1 | tee "build/fuzz/$NAME.log"
          if grep -Eq '(^|CORPUS )(CRASH|TIMEOUT) in ' "build/fuzz/$NAME.log"; then
            exit 1
          fi
      - name: Report grammar coverage
        if: always()
        env:
          DATABASE: ${{ matrix.target.database }}
        run: php fuzz/report_coverage.php "fuzz/coverage/$DATABASE" "$RELEASE" >> "$GITHUB_STEP_SUMMARY"
      - name: Open an issue for a finding
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          FUZZ_PACKAGE: ${{ matrix.target.package }}
          FUZZ_SCRIPT: ${{ matrix.target.script }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const name = process.env.NAME;
            const script = process.env.FUZZ_SCRIPT;
            const root = path.resolve('packages', process.env.FUZZ_PACKAGE);
            const logPath = path.join(root, `build/fuzz/${name}.log`);
            if (!fs.existsSync(logPath)) return;
            const log = fs.readFileSync(logPath, 'utf8');
            const finding = log.match(/^(?:CORPUS )?CRASH in (.+)!$/m);
            if (!finding) return;
            const input = fs.readFileSync(path.resolve(root, finding[1]));
            const hash = crypto.createHash('sha256').update(input).digest('hex');
            const marker = `<!-- sql-semantics-fuzz:${name}:${hash} -->`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', per_page: 100
            });
            if (issues.some(issue => !issue.pull_request && issue.body?.includes(marker))) return;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const release = process.env.RELEASE;
            const environment = release.startsWith('mysql-') ? `MYSQL_VERSION=${release.slice(6)} ` : release.startsWith('pg-') ? `PG_VERSION=${release.slice(3)} ` : '';
            const body = [
              marker,
              `PHP-Fuzzer found an input the ${name} target reports: a statement the semantic analysis of ${release} cannot round-trip, a rewrite it neither refuses nor reads back, or a declaration that differs from the server's catalog.`,
              `Commit: ${context.sha}`,
              `Workflow and input artifact: ${run} (sql-semantics-fuzz-${name})`,
              `Run from packages/${process.env.FUZZ_PACKAGE} after extracting the artifact${process.env.SEMANTICS_DSN ? ', with SEMANTICS_DSN, SEMANTICS_USERNAME and SEMANTICS_PASSWORD naming a disposable server of the release' : ''}:`,
              '```sh',
              `${environment}vendor/bin/php-fuzzer run-single fuzz/${script} '${finding[1]}'`,
              '```',
              `Input SHA-256: ${hash}`,
              '<details><summary>PHP-Fuzzer output</summary>',
              '', '```text', log.slice(-45000), '```', '</details>'
            ].join('\n\n');
            await github.rest.issues.create({
              ...context.repo,
              title: `[sql-semantics fuzz] ${name}: ${hash.slice(0, 12)}`,
              body
            });
      - name: Save the evolving corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/${{ matrix.target.package }}/fuzz/corpus/${{ env.NAME }}
          key: sql-semantics-corpus-v2-${{ env.NAME }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save grammar coverage history
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/${{ matrix.target.package }}/fuzz/coverage/${{ matrix.target.database }}
          key: sql-semantics-coverage-v2-${{ env.NAME }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload PHP-Fuzzer inputs, output and grammar coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sql-semantics-fuzz-${{ env.NAME }}
          path: |
            packages/${{ matrix.target.package }}/crash-*
            packages/${{ matrix.target.package }}/timeout-*
            packages/${{ matrix.target.package }}/build/fuzz/${{ env.NAME }}.log
            packages/${{ matrix.target.package }}/fuzz/corpus/${{ env.NAME }}/
            packages/${{ matrix.target.package }}/fuzz/coverage/${{ matrix.target.database }}/
          if-no-files-found: ignore
          retention-days: 14
