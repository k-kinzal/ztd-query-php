name: Fuzz (ztd-query-core)

on:
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:
    inputs:
      max_runs:
        description: Maximum inputs evaluated by each fuzz target after the seed corpus is replayed
        required: true
        default: '10000'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  COMPOSER_NO_INTERACTION: '1'

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: token-stream
            script: fuzz/fuzz_token_stream.php
            corpus: fuzz/corpus/token-stream
            extensions: dom, filter, hash, iconv, json, libxml, mbstring, pcntl, pcre, phar, reflection, simplexml, spl, tokenizer, xml, xmlwriter
    defaults:
      run:
        working-directory: packages/ztd-query-core
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: packages/ztd-query-core

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: ${{ matrix.target.extensions }}
          coverage: none

      - name: Validate the Composer manifest and lock file
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
        with:
          working-directory: packages/ztd-query-core
          dependency-versions: locked
          composer-options: --prefer-dist
          require-lock-file: true

      - name: Check runtime platform requirements
        run: composer check-platform-reqs --no-dev

      - name: Validate the manual run budget
        env:
          FUZZ_MAX_RUNS: ${{ inputs.max_runs || '10000' }}
        run: |
          case "$FUZZ_MAX_RUNS" in
            ''|*[!0-9]*) echo 'max_runs must be a positive integer.' >&2; exit 2 ;;
          esac
          if [ "${#FUZZ_MAX_RUNS}" -gt 8 ] || [ "$FUZZ_MAX_RUNS" -lt 1 ]; then
            echo 'max_runs must be between 1 and 99999999.' >&2
            exit 2
          fi

      - name: Restore the evolving corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: packages/ztd-query-core/${{ matrix.target.corpus }}
          key: ztd-query-core-corpus-v1-${{ matrix.target.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ztd-query-core-corpus-v1-${{ matrix.target.name }}-

      - name: Run PHP-Fuzzer
        env:
          FUZZ_MAX_RUNS: ${{ inputs.max_runs || '10000' }}
          FUZZ_SCRIPT: ${{ matrix.target.script }}
          FUZZ_CORPUS: ${{ matrix.target.corpus }}
          FUZZ_TARGET: ${{ matrix.target.name }}
        run: |
          set -euo pipefail
          mkdir -p build/fuzz "$FUZZ_CORPUS"
          vendor/bin/php-fuzzer fuzz \
            "$FUZZ_SCRIPT" \
            "$FUZZ_CORPUS/" \
            "--max-runs=$FUZZ_MAX_RUNS" 2>&1 | tee "build/fuzz/$FUZZ_TARGET.log"

      - name: Open an issue for a finding
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          FUZZ_TARGET: ${{ matrix.target.name }}
          FUZZ_SCRIPT: ${{ matrix.target.script }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const target = process.env.FUZZ_TARGET;
            const script = process.env.FUZZ_SCRIPT;
            const root = path.resolve('packages/ztd-query-core');
            const log = fs.readFileSync(path.join(root, `build/fuzz/${target}.log`), 'utf8');
            const finding = log.match(/^(?:CORPUS )?CRASH in (.+)!$/m);
            if (!finding) return;
            const input = fs.readFileSync(path.resolve(root, finding[1]));
            const hash = crypto.createHash('sha256').update(input).digest('hex');
            const marker = `<!-- ztd-query-core-fuzz:${target}:${hash} -->`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', per_page: 100
            });
            if (issues.some(issue => !issue.pull_request && issue.body?.includes(marker))) return;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              `PHP-Fuzzer found a contract violation in the ${target} target.`,
              `Commit: ${context.sha}`,
              `Workflow and input artifact: ${run} (ztd-query-core-fuzz-${target})`,
              'Run from packages/ztd-query-core after extracting the artifact:',
              '```sh',
              `vendor/bin/php-fuzzer run-single ${script} '${finding[1]}'`,
              '```',
              `Input SHA-256: ${hash}`,
              '<details><summary>PHP-Fuzzer output</summary>',
              '', '```text', log.slice(-45000), '```', '</details>'
            ].join('\n\n');
            await github.rest.issues.create({
              ...context.repo,
              title: `[ztd-query-core fuzz] ${target}: ${hash.slice(0, 12)}`,
              body
            });

      - name: Save the evolving corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: packages/ztd-query-core/${{ matrix.target.corpus }}
          key: ztd-query-core-corpus-v1-${{ matrix.target.name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload PHP-Fuzzer inputs and output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ztd-query-core-fuzz-${{ matrix.target.name }}
          path: |
            packages/ztd-query-core/crash-*
            packages/ztd-query-core/build/fuzz/${{ matrix.target.name }}.log
            packages/ztd-query-core/${{ matrix.target.corpus }}/
          if-no-files-found: ignore
          retention-days: 14
