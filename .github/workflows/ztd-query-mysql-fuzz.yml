name: Fuzz (ztd-query-mysql)

on:
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:
    inputs:
      max_runs:
        description: Maximum inputs evaluated by each fuzz target
        required: true
        default: '10000'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  COMPOSER_NO_INTERACTION: '1'

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: mysql-full
            script: fuzz/fuzz_robustness.php
            corpus: fuzz/corpus/robustness
          - name: mysql-classify
            script: fuzz/fuzz_robustness_classify.php
            corpus: fuzz/corpus/robustness-classify
          - name: mysql-rewrite
            script: fuzz/fuzz_robustness_rewrite.php
            corpus: fuzz/corpus/robustness-rewrite
    defaults:
      run:
        working-directory: packages/ztd-query-mysql
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate the Composer manifest and lock file
        run: composer validate --strict --no-check-publish --no-check-all

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
        with:
          working-directory: packages/ztd-query-mysql
          dependency-versions: locked
          composer-options: --prefer-dist
          require-lock-file: true

      - name: Check installed platform requirements
        run: composer check-platform-reqs

      - name: Restore the evolved corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: packages/ztd-query-mysql/${{ matrix.target.corpus }}
          key: fuzz-${{ matrix.target.name }}-${{ runner.os }}-${{ hashFiles('packages/ztd-query-mysql/composer.lock') }}-${{ hashFiles('packages/ztd-query-mysql/fuzz/**/*.php') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fuzz-${{ matrix.target.name }}-${{ runner.os }}-${{ hashFiles('packages/ztd-query-mysql/composer.lock') }}-${{ hashFiles('packages/ztd-query-mysql/fuzz/**/*.php') }}-
            fuzz-${{ matrix.target.name }}-${{ runner.os }}-${{ hashFiles('packages/ztd-query-mysql/composer.lock') }}-
            fuzz-${{ matrix.target.name }}-${{ runner.os }}-

      - name: Run the fuzz target
        env:
          FUZZ_MAX_RUNS: ${{ inputs.max_runs || '10000' }}
        run: |
          set -euo pipefail

          case "$FUZZ_MAX_RUNS" in
            ''|*[!0-9]*)
              echo 'max_runs must be a positive integer.' >&2
              exit 2
              ;;
          esac
          if [ "$FUZZ_MAX_RUNS" -lt 1 ]; then
            echo 'max_runs must be a positive integer.' >&2
            exit 2
          fi

          mkdir -p build/fuzz "${{ matrix.target.corpus }}"
          vendor/bin/php-fuzzer fuzz \
            "${{ matrix.target.script }}" \
            "${{ matrix.target.corpus }}/" \
            "--max-runs=$FUZZ_MAX_RUNS" 2>&1 | tee "build/fuzz/${{ matrix.target.name }}.log"

      - name: Open an issue for a finding
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          FUZZ_TARGET: ${{ matrix.target.name }}
          FUZZ_SCRIPT: ${{ matrix.target.script }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const target = process.env.FUZZ_TARGET;
            const script = process.env.FUZZ_SCRIPT;
            const root = path.resolve('packages/ztd-query-mysql');
            const log = fs.readFileSync(path.join(root, `build/fuzz/${target}.log`), 'utf8');
            const finding = log.match(/^(?:CORPUS )?CRASH in (.+)!$/m);
            if (!finding) return;
            const input = fs.readFileSync(path.resolve(root, finding[1]));
            const hash = crypto.createHash('sha256').update(input).digest('hex');
            const marker = `<!-- ztd-query-mysql-fuzz:${target}:${hash} -->`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', per_page: 100
            });
            if (issues.some(issue => !issue.pull_request && issue.body?.includes(marker))) return;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              `PHP-Fuzzer found a crash in the ${target} target.`,
              `Commit: ${context.sha}`,
              `Workflow and input artifact: ${run} (fuzz-crashes-${target})`,
              'Run from packages/ztd-query-mysql after extracting the artifact:',
              '```sh',
              `vendor/bin/php-fuzzer run-single ${script} '${path.relative(root, path.resolve(root, finding[1]))}'`,
              '```',
              `Input SHA-256: ${hash}`,
              '<details><summary>PHP-Fuzzer output</summary>',
              '', '```text', log.slice(-45000), '```', '</details>'
            ].join('\n\n');
            await github.rest.issues.create({
              ...context.repo,
              title: `[ztd-query-mysql fuzz] ${target}: ${hash.slice(0, 12)}`,
              body
            });

      - name: Save the evolved corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: packages/ztd-query-mysql/${{ matrix.target.corpus }}
          key: fuzz-${{ matrix.target.name }}-${{ runner.os }}-${{ hashFiles('packages/ztd-query-mysql/composer.lock') }}-${{ hashFiles('packages/ztd-query-mysql/fuzz/**/*.php') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload crash inputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fuzz-crashes-${{ matrix.target.name }}
          path: |
            packages/ztd-query-mysql/crash-*
            packages/ztd-query-mysql/build/fuzz/${{ matrix.target.name }}.log
          if-no-files-found: ignore
          retention-days: 14
