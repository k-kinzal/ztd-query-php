name: CI (sql-fixture)

on:
  workflow_dispatch:
    inputs:
      mysql_version:
        description: MySQL release the server job rounds trips through
        required: false
        default: '9.1.0'
        type: string
      pg_version:
        description: PostgreSQL release the server job rounds trips through
        required: false
        default: '17.2'
        type: string
  push:
    branches: [main]
  pull_request:
    paths:
      - 'packages/sql-fixture/**'
      - 'packages/container/**'
      - 'packages/sql-faker/**'
      - '.github/workflows/sql-fixture.yml'
      - '.github/workflows/sql-fixture-fuzz.yml'
      - '!packages/**/README.md'
      - '!packages/**/docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_NO_INTERACTION: '1'

defaults:
  run:
    shell: bash
    working-directory: packages/sql-fixture

jobs:
  test:
    name: Test (PHP ${{ matrix.php }})
    services:
      mysql:
        image: container-registry.oracle.com/mysql/community-server:9.1.0
        env:
          MYSQL_ROOT_PASSWORD: toolkit
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: sql_fixture
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptoolkit"
          --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:17.2
        env:
          POSTGRES_PASSWORD: toolkit
          POSTGRES_DB: sql_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d sql_fixture"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      SQL_FIXTURE_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=sql_fixture
      SQL_FIXTURE_PGSQL_DSN: pgsql:host=127.0.0.1;port=5432;dbname=sql_fixture
      SQL_FIXTURE_MYSQL_VERSION: '9.1.0'
      SQL_FIXTURE_PGSQL_VERSION: '17.2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, filter, hash, iconv, json, libxml, mbstring, pcntl, pcre, pdo, pdo_mysql, pdo_pgsql, pdo_sqlite, phar, reflection, simplexml, spl, tokenizer, xml, xmlwriter
          coverage: none
      - name: Validate the Composer manifest and lock file
        run: composer validate --strict --no-check-publish
      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          working-directory: packages/sql-fixture
          dependency-versions: locked
          composer-options: --prefer-dist
          require-lock-file: true
      - name: Check installed platform requirements
        if: matrix.php == '8.1' || matrix.php == '8.2' || matrix.php == '8.3'
        run: composer check-platform-reqs
      - name: Check library requirements outside the locked ParaTest PHP range
        if: matrix.php == '8.4' || matrix.php == '8.5'
        run: composer check-platform-reqs --no-dev
      - name: Run the tests in parallel
        run: composer test

  server:
    name: Server (${{ matrix.target.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: MySQL ${{ inputs.mysql_version || '9.1.0' }}
            dialect: mysql
            version: ${{ inputs.mysql_version || '9.1.0' }}
            filter: MySqlReleaseRoundTripTest
          - name: PostgreSQL ${{ inputs.pg_version || '17.2' }}
            dialect: pgsql
            version: ${{ inputs.pg_version || '17.2' }}
            filter: PostgreSqlReleaseRoundTripTest
    env:
      SQL_FIXTURE_MYSQL_VERSION: ${{ matrix.target.dialect == 'mysql' && matrix.target.version || '' }}
      SQL_FIXTURE_PGSQL_VERSION: ${{ matrix.target.dialect == 'pgsql' && matrix.target.version || '' }}
      MYSQL_VERSION: ${{ matrix.target.dialect == 'mysql' && matrix.target.version || '' }}
      PG_VERSION: ${{ matrix.target.dialect == 'pgsql' && matrix.target.version || '' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: dom, filter, hash, iconv, json, libxml, mbstring, pcntl, pcre, pdo, pdo_mysql, pdo_pgsql, pdo_sqlite, phar, reflection, simplexml, spl, tokenizer, xml, xmlwriter
          coverage: none
      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          working-directory: packages/sql-fixture
          dependency-versions: locked
          composer-options: --prefer-dist
          require-lock-file: true
      - name: Pull the server image before the timed tests
        env:
          DIALECT: ${{ matrix.target.dialect }}
        run: |
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $container = getenv('DIALECT') === 'mysql'
              ? Container\MySqlRelease::fromEnvironment()
              : Container\PostgreSqlRelease::fromEnvironment();
          passthru('docker pull ' . escapeshellarg((new $container())->image()), $status);
          exit($status);
          PHP
      - name: Round-trip the generated rows through the server
        run: vendor/bin/phpunit --testsuite integration --filter ${{ matrix.target.filter }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: dom, filter, hash, iconv, json, libxml, mbstring, pcntl, pcre, pdo, pdo_mysql, pdo_pgsql, pdo_sqlite, phar, reflection, simplexml, spl, tokenizer, xml, xmlwriter
          coverage: none
      - name: Validate the Composer manifest and lock file
        run: composer validate --strict --no-check-publish
      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          working-directory: packages/sql-fixture
          dependency-versions: locked
          composer-options: --prefer-dist
          require-lock-file: true
      - name: Check installed platform requirements
        run: composer check-platform-reqs
      - name: Check PSR-4 paths and ambiguous classes
        run: composer autoload:check
      - name: Check the formatting
        run: composer format:check
      - name: Analyse with PHPStan
        run: composer phpstan
      - name: Check PHP compatibility
        run: composer compat
      - name: Check the source metrics
        run: composer loc-guard
      - name: Check the directory structure
        run: composer tree-guard
      - name: Check the architecture layers
        run: composer deptrac

  bench:
    name: Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: dom, filter, hash, iconv, json, libxml, mbstring, pcntl, pcre, pdo, pdo_mysql, pdo_pgsql, pdo_sqlite, phar, reflection, simplexml, spl, tokenizer, xml, xmlwriter
          coverage: none
      - name: Validate the Composer manifest and lock file
        run: composer validate --strict --no-check-publish
      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          working-directory: packages/sql-fixture
          dependency-versions: locked
          composer-options: --prefer-dist
          require-lock-file: true
      - name: Check installed platform requirements
        run: composer check-platform-reqs
      - name: Run the benchmarks
        run: |
          mkdir -p build/phpbench
          composer run-script --timeout=1200 bench -- --dump-file=build/phpbench/results.xml | tee build/phpbench/report.txt
      - name: Upload benchmark measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sql-fixture-phpbench
          path: packages/sql-fixture/build/phpbench/
          if-no-files-found: ignore
