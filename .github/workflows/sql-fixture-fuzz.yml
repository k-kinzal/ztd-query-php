name: Fuzz (sql-fixture)

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      max_runs:
        description: 'Max fuzzing iterations'
        default: '10000'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_NO_INTERACTION: '1'

jobs:
  fuzz:
    name: ${{ matrix.target.name }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: create-table, script: fuzz_create_table.php, corpus: create-table, extensions: "mbstring, pcntl" }
          - { name: insert-select, script: fuzz_insert_select.php, corpus: insert-select, extensions: "mbstring, pcntl, pdo, pdo_mysql" }
    defaults:
      run:
        working-directory: packages/sql-fixture
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: ${{ matrix.target.extensions }}
          coverage: none

      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
        with:
          working-directory: packages/sql-fixture
          dependency-versions: locked
          composer-options: --prefer-dist
          require-lock-file: true

      - name: Check installed platform requirements
        run: composer check-platform-reqs

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: packages/sql-fixture/fuzz/corpus/${{ matrix.target.corpus }}
          key: fuzz-sql-fixture-v2-${{ matrix.target.corpus }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fuzz-sql-fixture-v2-${{ matrix.target.corpus }}-

      - name: Run the bounded fuzz campaign
        env:
          MAX_RUNS: ${{ inputs.max_runs || '10000' }}
        run: |
          set -euo pipefail
          case "$MAX_RUNS" in
            ''|*[!0-9]*) echo 'max_runs must be a positive integer.' >&2; exit 2 ;;
          esac
          if [ "${#MAX_RUNS}" -gt 8 ] || [ "$MAX_RUNS" -lt 1 ]; then
            echo 'max_runs must be between 1 and 99999999.' >&2
            exit 2
          fi
          mkdir -p build/fuzz fuzz/corpus/${{ matrix.target.corpus }}
          vendor/bin/php-fuzzer fuzz fuzz/${{ matrix.target.script }} \
            fuzz/corpus/${{ matrix.target.corpus }}/ \
            --max-runs="$MAX_RUNS" 2>&1 | tee "build/fuzz/${{ matrix.target.name }}.log"

      - name: Open an issue for new findings
        if: ${{ !cancelled() }}
        uses: ./.github/actions/fuzz-finding-issue
        with:
          package: sql-fixture
          target: ${{ matrix.target.name }}
          script: fuzz/${{ matrix.target.script }}
          log: build/fuzz/${{ matrix.target.name }}.log
          artifact: fuzz-crashes-sql-fixture-${{ matrix.target.name }}

      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: packages/sql-fixture/fuzz/corpus/${{ matrix.target.corpus }}
          key: fuzz-sql-fixture-v2-${{ matrix.target.corpus }}-${{ github.run_id }}-${{ github.run_attempt }}

      - if: ${{ always() && hashFiles('packages/sql-fixture/crash-*', 'packages/sql-fixture/timeout-*', 'packages/sql-fixture/oom-*') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fuzz-crashes-sql-fixture-${{ matrix.target.name }}
          path: |
            packages/sql-fixture/crash-*
            packages/sql-fixture/timeout-*
            packages/sql-fixture/oom-*
            packages/sql-fixture/build/fuzz/
