name: Docs Preview (pdo adapter)
permissions:
  contents: read
concurrency:
  group: sql-faker-docs-publish
  cancel-in-progress: false
  queue: max
env:
  COMPOSER_NO_INTERACTION: '1'
  DOCS_BRANCH: gh-pages
jobs:
  preview:
    name: Generate and publish the pull request preview
    if: github.event.action != 'closed' && !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
    steps:
    - name: Check out the pull request
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Set up PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
      with:
        php-version: '8.3'
        extensions: ctype, dom, filter, hash, iconv, json, libxml, mbstring, pcntl, pcre, pdo, pdo_mysql, pdo_pgsql, pdo_sqlite,
          phar, reflection, simplexml, spl, tokenizer, xml, xmlwriter, gd
        coverage: pcov
    - name: Install dependencies
      uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
      with:
        working-directory: packages/ztd-query-pdo-adapter
        dependency-versions: locked
        require-lock-file: true
        composer-options: --prefer-dist
    - name: Check installed platform requirements
      run: |
        composer --working-dir=packages/ztd-query-pdo-adapter validate --strict --no-check-publish
        composer --working-dir=packages/ztd-query-pdo-adapter check-platform-reqs
    - name: Restore the DocGen cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: packages/ztd-query-pdo-adapter/build/docgen-cache
        key: pdo-docgen-${{ runner.os }}-${{ hashFiles('packages/ztd-query-pdo-adapter/composer.lock') }}-${{ github.sha }}
        restore-keys: |
          pdo-docgen-${{ runner.os }}-${{ hashFiles('packages/ztd-query-pdo-adapter/composer.lock') }}-
          pdo-docgen-${{ runner.os }}-
    - name: Generate the coverage report the preview reads
      run: composer --working-dir=packages/ztd-query-pdo-adapter test:coverage
    - name: Generate the documentation in diff mode
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail

        repository="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
        composer --working-dir=packages/ztd-query-pdo-adapter docgen -- --coverage=packages/ztd-query-pdo-adapter/build/coverage-xml --diff="${BASE_SHA}" \
          --base-url="https://${repository%%/*}.github.io/${repository#*/}/pr/${PR_NUMBER}/pdo"
    - name: Check out the documentation branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ env.DOCS_BRANCH }}
        path: .docs-branch
    - name: Publish the preview
      working-directory: .docs-branch
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail

        mkdir -p "pr/${PR_NUMBER}/pdo"
        rsync -a --checksum --delete ../packages/ztd-query-pdo-adapter/build/docs/ "pr/${PR_NUMBER}/pdo/"
        touch .nojekyll

        git add --all
        if git diff --cached --quiet; then
          echo "The ${DOCS_BRANCH} branch already serves this preview."
          exit 0
        fi

        git -c user.name='github-actions[bot]' \
          -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
          commit --message "docs: preview pull request #${PR_NUMBER} at ${HEAD_SHA}"
        git push origin "HEAD:${DOCS_BRANCH}"
    - name: Build GitHub Pages and wait for publication
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail

        expected_sha="$(git -C .docs-branch rev-parse HEAD)"
        gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" > /dev/null
        for attempt in {1..60}; do
          build="$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest")"
          if [ "$(jq -r .commit <<< "$build")" = "$expected_sha" ]; then
            case "$(jq -r .status <<< "$build")" in
              built) exit 0 ;;
              errored) jq .error <<< "$build"; exit 1 ;;
            esac
          fi
          sleep 10
        done
        echo 'Timed out waiting for GitHub Pages publication.' >&2
        exit 1
  cleanup:
    name: Remove the pull request preview
    if: github.event.action == 'closed' && !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
    steps:
    - name: Check out the documentation branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ env.DOCS_BRANCH }}
    - name: Remove the preview
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail

        rm -rf "pr/${PR_NUMBER}/pdo"

        git add --all
        if git diff --cached --quiet; then
          echo "The ${DOCS_BRANCH} branch carries no preview of this pull request."
          exit 0
        fi

        git -c user.name='github-actions[bot]' \
          -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
          commit --message "docs: remove the preview of pull request #${PR_NUMBER}"
        git push origin "HEAD:${DOCS_BRANCH}"
    - name: Build GitHub Pages and wait for publication
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail

        expected_sha="$(git rev-parse HEAD)"
        gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" > /dev/null
        for attempt in {1..60}; do
          build="$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest")"
          if [ "$(jq -r .commit <<< "$build")" = "$expected_sha" ]; then
            case "$(jq -r .status <<< "$build")" in
              built) exit 0 ;;
              errored) jq .error <<< "$build"; exit 1 ;;
            esac
          fi
          sleep 10
        done
        echo 'Timed out waiting for GitHub Pages publication.' >&2
        exit 1
'on':
  pull_request:
    paths:
    - packages/ztd-query-pdo-adapter/**
    - packages/ztd-query-core/**
    - packages/ztd-query-mysql/**
    - packages/sql-fixture/**
    - packages/sql-faker/**
    - .github/workflows/ztd-query-pdo-adapter-docs.yml
    - .github/workflows/ztd-query-pdo-adapter-docs-preview.yml
    - packages/ztd-query-postgres/**
    - packages/ztd-query-sqlite/**
    types:
    - opened
    - synchronize
    - reopened
    - closed
