name: CI (ztd-query-mysqli-adapter)

on:
  push:
    branches: [main]
    paths:
      - 'packages/ztd-query-mysqli-adapter/**'
      - 'packages/ztd-query-mysql/**'
      - 'packages/ztd-query-core/**'
      - 'packages/sql-faker/**'
      - 'packages/sql-fixture/**'
      - '.github/workflows/ztd-query-mysqli-adapter*.yml'
  pull_request:
    paths:
      - 'packages/ztd-query-mysqli-adapter/**'
      - 'packages/ztd-query-mysql/**'
      - 'packages/ztd-query-core/**'
      - 'packages/sql-faker/**'
      - 'packages/sql-fixture/**'
      - '.github/workflows/ztd-query-mysqli-adapter*.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_NO_INTERACTION: '1'

defaults:
  run:
    working-directory: packages/ztd-query-mysqli-adapter

jobs:
  test:
    name: Tests (PHP ${{ matrix.php }}, MySQL ${{ matrix.mysql }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        mysql: ['8.0.44']
        include:
          - php: '8.5'
            mysql: '8.4.7'
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, mysqli, pdo_mysql, pcntl, dom, xml, xmlwriter, gd
          coverage: none
          ini-values: memory_limit=1G
      - name: Validate the Composer manifest
        run: composer validate --strict --no-check-publish
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
        with:
          working-directory: packages/ztd-query-mysqli-adapter
          dependency-versions: highest
          composer-options: --prefer-dist
      - name: Check dependency consistency and platform requirements
        run: |
          composer validate --strict --no-check-publish
          composer check-platform-reqs
      - name: Unit, integration and documentation examples
        run: composer test

  lint:
    name: Static quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: mbstring, mysqli, pdo_mysql, pcntl, dom, xml, xmlwriter, gd
          coverage: none
          ini-values: memory_limit=1G
      - name: Validate the Composer manifest
        run: composer validate --strict --no-check-publish
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
        with:
          working-directory: packages/ztd-query-mysqli-adapter
          dependency-versions: highest
          composer-options: --prefer-dist
      - name: Check dependency consistency and platform requirements
        run: |
          composer validate --strict --no-check-publish
          composer check-platform-reqs
      - name: Coding standards
        run: composer format:check
      - name: PHPStan (maximum level and toolkit rules)
        run: composer phpstan
      - name: PHP 8.1 compatibility
        run: composer compat
      - name: Size and complexity limits
        run: composer loc-guard
      - name: Source and test structure
        run: composer tree-guard
      - name: Dependency boundaries
        run: composer deptrac

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0.44
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: mbstring, mysqli, pdo_mysql, pcntl, dom, xml, xmlwriter, gd
          coverage: none
          ini-values: memory_limit=1G
      - name: Validate the Composer manifest
        run: composer validate --strict --no-check-publish
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
        with:
          working-directory: packages/ztd-query-mysqli-adapter
          dependency-versions: highest
          composer-options: --prefer-dist
      - name: Check dependency consistency and platform requirements
        run: |
          composer validate --strict --no-check-publish
          composer check-platform-reqs
      - run: composer bench
      - name: Upload benchmark measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mysqli-benchmarks
          path: packages/ztd-query-mysqli-adapter/build/phpbench/
          if-no-files-found: error

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.0.44
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: mbstring, mysqli, pdo_mysql, pcntl, dom, xml, xmlwriter, gd
          coverage: pcov
          ini-values: memory_limit=1G
          tools: infection:0.35.4
      - name: Validate the Composer manifest
        run: composer validate --strict --no-check-publish
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
        with:
          working-directory: packages/ztd-query-mysqli-adapter
          dependency-versions: highest
          composer-options: --prefer-dist
      - name: Check dependency consistency and platform requirements
        run: |
          composer validate --strict --no-check-publish
          composer check-platform-reqs
      - name: Mutation testing on changed lines
        if: github.event_name == 'pull_request'
        run: >-
          php -d memory_limit=4G "$(command -v infection)"
          --configuration=infection.json5 --threads=4 --only-covering-test-cases
          --git-diff-lines --git-diff-base="origin/${GITHUB_BASE_REF}"
          --min-msi=85 --min-covered-msi=85 --ignore-msi-with-no-mutations
          --no-progress --logger-github
      - name: Mutation testing on the whole source tree
        if: github.event_name != 'pull_request'
        run: >-
          php -d memory_limit=4G "$(command -v infection)"
          --configuration=infection.json5 --threads=4 --only-covering-test-cases
          --no-progress --logger-github
      - name: Reject skipped whole-tree mutants
        if: github.event_name != 'pull_request'
        run: |
          php -r '
            $report = json_decode(file_get_contents("build/infection/infection.json"), true, 512, JSON_THROW_ON_ERROR);
            if (($report["stats"]["skippedCount"] ?? null) !== 0) {
                fwrite(STDERR, "Infection must report zero skipped mutants.\n");
                exit(1);
            }
          '
      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mysqli-mutation-reports
          path: packages/ztd-query-mysqli-adapter/build/infection/
          if-no-files-found: ignore
