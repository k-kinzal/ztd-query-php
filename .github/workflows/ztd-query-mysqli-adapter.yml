name: CI (ztd-query-mysqli-adapter)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/container/**'
      - 'packages/ztd-query-mysqli-adapter/**'
      - 'packages/ztd-query-mysql/**'
      - 'packages/ztd-query-core/**'
      - 'packages/sql-faker/**'
      - 'packages/sql-fixture/**'
      - '.github/workflows/ztd-query-mysqli-adapter*.yml'
  pull_request:
    paths:
      - 'packages/container/**'
      - 'packages/ztd-query-mysqli-adapter/**'
      - 'packages/ztd-query-mysql/**'
      - 'packages/ztd-query-core/**'
      - 'packages/sql-faker/**'
      - 'packages/sql-fixture/**'
      - '.github/workflows/ztd-query-mysqli-adapter*.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_NO_INTERACTION: '1'

defaults:
  run:
    shell: bash
    working-directory: packages/ztd-query-mysqli-adapter

jobs:
  test:
    name: Tests (PHP ${{ matrix.php }}, MySQL ${{ matrix.mysql }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        mysql: ['8.0.44']
        include:
          - php: '8.5'
            mysql: '8.4.7'
    env:
      MYSQL_VERSION: ${{ matrix.mysql }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, mysqli, pdo_mysql, pcntl, dom, xml, xmlwriter, gd
          coverage: none
          ini-values: memory_limit=1G
      - name: Validate the Composer manifest
        run: composer validate --strict --no-check-publish
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
        with:
          working-directory: packages/ztd-query-mysqli-adapter
          dependency-versions: locked
          composer-options: --prefer-dist
          require-lock-file: true
      - name: Check installed platform requirements
        if: matrix.php == '8.1' || matrix.php == '8.2' || matrix.php == '8.3'
        run: composer check-platform-reqs
      - name: Check runtime platform requirements
        if: matrix.php == '8.4' || matrix.php == '8.5'
        run: composer check-platform-reqs --no-dev
      - name: Unit, integration and documentation examples
        run: composer run-script --timeout=1800 test

  lint:
    name: Static quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: mbstring, mysqli, pdo_mysql, pcntl, dom, xml, xmlwriter, gd
          coverage: none
          ini-values: memory_limit=1G
      - name: Validate the Composer manifest
        run: composer validate --strict --no-check-publish
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
        with:
          working-directory: packages/ztd-query-mysqli-adapter
          dependency-versions: locked
          composer-options: --prefer-dist
          require-lock-file: true
      - name: Check installed platform requirements
        run: composer check-platform-reqs
      - name: Check PSR-4 paths and ambiguous classes
        run: composer autoload:check
      - name: Coding standards
        run: composer format:check
      - name: PHPStan (maximum level and toolkit rules)
        run: composer phpstan
      - name: PHP 8.1 compatibility
        run: composer compat
      - name: Size and complexity limits
        run: composer loc-guard
      - name: Source and test structure
        run: composer tree-guard
      - name: Dependency boundaries
        run: composer deptrac

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: mbstring, mysqli, pdo_mysql, pcntl, dom, xml, xmlwriter, gd
          coverage: none
          ini-values: memory_limit=1G
      - name: Validate the Composer manifest
        run: composer validate --strict --no-check-publish
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
        with:
          working-directory: packages/ztd-query-mysqli-adapter
          dependency-versions: locked
          composer-options: --prefer-dist
          require-lock-file: true
      - name: Check installed platform requirements
        run: composer check-platform-reqs
      - name: Run the benchmarks
        run: |
          mkdir -p build/phpbench
          composer run-script --timeout=1200 bench -- --dump-file=build/phpbench/results.xml | tee build/phpbench/report.txt
      - name: Upload benchmark measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ztd-query-mysqli-adapter-phpbench
          path: packages/ztd-query-mysqli-adapter/build/phpbench/
          if-no-files-found: ignore
