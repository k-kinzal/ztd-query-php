name: CI (sql-faker)

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'packages/sql-faker/**'
      - '.github/workflows/sql-faker.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: packages/sql-faker

jobs:
  test:
    name: Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pcntl
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: packages/sql-faker
      - run: composer test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: packages/sql-faker
      - run: composer lint

  docgen:
    name: DocGen
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          # The locked ParaTest version supports PHP 8.1 through 8.3.
          php-version: '8.3'
          extensions: mbstring, pcntl, gd
          coverage: pcov
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
        with:
          working-directory: packages/sql-faker
          require-lock-file: true
      - run: composer check-platform-reqs
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: packages/sql-faker/build/docgen-cache
          key: sql-faker-docgen-${{ runner.os }}-${{ hashFiles('packages/sql-faker/composer.lock') }}-${{ github.sha }}
          restore-keys: |
            sql-faker-docgen-${{ runner.os }}-${{ hashFiles('packages/sql-faker/composer.lock') }}-
      - run: composer docgen:coverage

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: packages/sql-faker
      - run: composer bench

  mutation:
    name: Mutation Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring
          coverage: pcov
      - uses: ramsey/composer-install@v3
        with:
          working-directory: packages/sql-faker
      - name: infection
        env:
          # Infection resolves diff paths from the package working directory.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: diff.relative
          GIT_CONFIG_VALUE_0: 'true'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            php -d memory_limit=512M vendor/bin/infection \
              --threads=max \
              --git-diff-lines \
              --git-diff-base=origin/${GITHUB_BASE_REF} \
              --ignore-msi-with-no-mutations \
              --min-covered-msi=80 \
              --only-covering-test-cases \
              --no-progress \
              --logger-github
          else
            php -d memory_limit=512M vendor/bin/infection \
              --threads=max \
              --min-covered-msi=80 \
              --no-progress \
              --logger-github
          fi
