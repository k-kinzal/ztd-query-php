name: CI (ztd-query-pdo-adapter)
'on':
  push:
    branches:
    - main
  pull_request:
    paths:
    - packages/ztd-query-pdo-adapter/**
    - packages/ztd-query-core/**
    - .github/workflows/ztd-query-pdo-adapter.yml
    - packages/ztd-query-sqlite/**
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
    working-directory: packages/ztd-query-pdo-adapter
jobs:
  test:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php:
        - '8.1'
        - '8.2'
        - '8.3'
        - '8.4'
        - '8.5'
    steps:
    - name: Check out the repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Set up PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
      with:
        php-version: ${{ matrix.php }}
        extensions: ctype, dom, filter, hash, iconv, json, libxml, mbstring, pcntl, pcre, pdo, pdo_sqlite, phar, reflection,
          simplexml, spl, tokenizer, xml, xmlwriter
        coverage: none
        ini-values: memory_limit=512M
    - name: Validate Composer metadata
      run: composer validate --strict --no-check-publish
    - name: Install dependencies
      uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
      with:
        working-directory: packages/ztd-query-pdo-adapter
        dependency-versions: locked
        require-lock-file: true
        composer-options: --prefer-dist
    - name: Check installed platform requirements
      if: matrix.php == '8.1' || matrix.php == '8.2' || matrix.php == '8.3'
      run: composer check-platform-reqs
    - name: Check library requirements outside the locked ParaTest PHP range
      if: matrix.php == '8.4' || matrix.php == '8.5'
      run: composer check-platform-reqs --no-dev
    - name: Run PHPUnit and doctest with ParaTest
      run: composer test
  lint:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Check out the repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Set up PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
      with:
        php-version: '8.3'
        extensions: ctype, dom, filter, hash, iconv, json, libxml, mbstring, pcntl, pcre, pdo, pdo_sqlite, phar, reflection,
          simplexml, spl, tokenizer, xml, xmlwriter
        coverage: none
        ini-values: memory_limit=512M
    - name: Validate Composer metadata
      run: composer validate --strict --no-check-publish
    - name: Install dependencies
      uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
      with:
        working-directory: packages/ztd-query-pdo-adapter
        dependency-versions: locked
        require-lock-file: true
        composer-options: --prefer-dist
    - name: Check installed platform requirements
      run: composer check-platform-reqs
    - name: Check PSR-4 paths and ambiguous classes
      run: composer autoload:check
    - name: Check formatting
      run: composer format:check
    - name: Check source metrics
      run: composer loc-guard
    - name: Run PHPStan and toolkit rules
      run: composer phpstan
    - name: Check PHP compatibility
      run: composer compat
    - name: Check source tree
      run: composer tree-guard
    - name: Check architecture boundaries
      run: composer deptrac
  bench:
    name: Benchmark execution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Check out the repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Set up PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
      with:
        php-version: '8.3'
        extensions: ctype, dom, filter, hash, iconv, json, libxml, mbstring, pcntl, pcre, pdo, pdo_sqlite, phar, reflection,
          simplexml, spl, tokenizer, xml, xmlwriter
        coverage: none
        ini-values: memory_limit=512M
    - name: Validate Composer metadata
      run: composer validate --strict --no-check-publish
    - name: Install dependencies
      uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
      with:
        working-directory: packages/ztd-query-pdo-adapter
        dependency-versions: locked
        require-lock-file: true
        composer-options: --prefer-dist
    - name: Check installed platform requirements
      run: composer check-platform-reqs
    - name: Run the benchmarks
      run: 'mkdir -p build/phpbench

        composer run-script --timeout=1200 bench -- --dump-file=build/phpbench/results.xml | tee build/phpbench/report.txt

        '
    - name: Upload benchmark measurements
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ztd-query-pdo-adapter-phpbench
        path: packages/ztd-query-pdo-adapter/build/phpbench/
        if-no-files-found: ignore
  mutation:
    name: Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Check out the repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Set up PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
      with:
        php-version: '8.5'
        extensions: ctype, dom, filter, hash, iconv, json, libxml, mbstring, pcntl, pcre, pdo, pdo_sqlite, phar, reflection,
          simplexml, spl, tokenizer, xml, xmlwriter
        coverage: pcov
        ini-values: memory_limit=512M
        tools: infection:0.35.4
    - name: Validate Composer metadata
      run: composer validate --strict --no-check-publish
    - name: Install dependencies
      uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
      with:
        working-directory: packages/ztd-query-pdo-adapter
        dependency-versions: locked
        require-lock-file: true
        composer-options: --prefer-dist
    - name: Check installed platform requirements
      run: composer check-platform-reqs --no-dev
    - name: Mutation testing on changed lines
      if: github.event_name == 'pull_request'
      run: php -d memory_limit=4G "$(command -v infection)" --configuration=infection.json5 --threads=4 --only-covering-test-cases
        --with-uncovered --git-diff-lines --git-diff-base="origin/${GITHUB_BASE_REF}" --ignore-msi-with-no-mutations --min-msi=85
        --min-covered-msi=85 --no-progress --logger-github
    - name: Mutation testing on the whole source tree
      if: github.event_name != 'pull_request'
      run: php -d memory_limit=4G "$(command -v infection)" --configuration=infection.json5 --threads=4 --only-covering-test-cases
        --with-uncovered --no-progress --logger-github
    - name: Reject skipped whole-tree mutants
      if: github.event_name != 'pull_request'
      run: "php -d memory_limit=4G -r '\n  $report = json_decode(file_get_contents(\"build/infection/infection.json\"), true,\
        \ 512, JSON_THROW_ON_ERROR);\n  if ($report[\"stats\"][\"skippedCount\"] !== 0) {\n      fwrite(STDERR, \"Infection\
        \ skipped mutants before execution; review the timeout against test durations.\\n\");\n      exit(1);\n  }\n'\n"
    - name: Upload mutation reports
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ztd-query-pdo-adapter-infection
        path: packages/ztd-query-pdo-adapter/build/infection/
        if-no-files-found: ignore
  dependencies:
    name: Runtime dependency isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Check out the repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Set up PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
      with:
        php-version: '8.3'
        extensions: ctype, dom, filter, hash, iconv, json, libxml, mbstring, pcntl, pcre, pdo, pdo_sqlite, phar, reflection,
          simplexml, spl, tokenizer, xml, xmlwriter
        coverage: none
        ini-values: memory_limit=512M
    - name: Install only runtime dependencies
      run: composer install --no-dev --prefer-dist --no-interaction --no-progress
    - name: Verify unrelated platforms are absent
      run: "php -r '\n  require \"vendor/autoload.php\";\n  foreach ([\"k-kinzal/ztd-query-mysql\", \"k-kinzal/ztd-query-postgres\"\
        , \"k-kinzal/ztd-query-sqlite\"] as $package) {\n    if (Composer\\InstalledVersions::isInstalled($package)) {\n \
        \     throw new RuntimeException(\"Unexpected platform dependency: \" . $package);\n    }\n  }\n'\ncomposer check-platform-reqs\
        \ --no-dev"
