            --engine "$ENGINE" --release "$RELEASE" \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --out "$RUNNER_TEMP/semantics-ir-truth-evidence"
      - name: Compare MySQL signed quotient and remainder results
        if: ${{ !cancelled() && matrix.engine == 'mysql' }}
        env:
