            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --out "$RUNNER_TEMP/semantics-ir-recursive-unavailable-evidence"
      - name: Compare native recursive series results
        if: ${{ !cancelled() && matrix.release != '5.6.51' && matrix.release != '5.7.44' }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          ENGINE: ${{ matrix.engine }}
