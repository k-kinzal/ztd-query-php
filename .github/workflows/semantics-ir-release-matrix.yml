      - name: Compare native bound parameter positions
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          ENGINE: ${{ matrix.engine }}
          RELEASE: ${{ matrix.release }}
          ZTD_IR_MYSQL_DSN: mysql:host=127.0.0.1;port=${{ job.services.database.ports[matrix.port] }};dbname=ir_fixture;charset=utf8mb4
          ZTD_IR_MYSQL_USER: root
          ZTD_IR_MYSQL_PASSWORD: ir_fixture
          ZTD_IR_POSTGRES_DSN: pgsql:host=127.0.0.1;port=${{ job.services.database.ports[matrix.port] }};dbname=ir_fixture
          ZTD_IR_POSTGRES_USER: postgres
