  collect:
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    needs: comparison
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    timeout-minutes: 5
    steps:
      - name: Validate the requested candidate identity
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: test "${#CANDIDATE}" -eq 40 && [[ "$CANDIDATE" =~ ^[0-9a-f]+$ ]]
      - name: Check out the acceptance tools from the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - name: Check out the candidate for distribution verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate }}
          path: candidate
          persist-credentials: false
      - name: Download the protected release records
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download "$GITHUB_RUN_ID" --pattern 'semantics-ir-*' --dir "$RUNNER_TEMP/server-matrix"
          gh run download "$GITHUB_RUN_ID" --pattern 'native-delete-*' --dir "$RUNNER_TEMP/delete-matrix"
