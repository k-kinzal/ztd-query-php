          ZTD_IR_POSTGRES_DSN: pgsql:host=127.0.0.1;port=${{ job.services.database.ports[matrix.port] }};dbname=ir_fixture
          ZTD_IR_POSTGRES_USER: postgres
          ZTD_IR_POSTGRES_PASSWORD: ir_fixture
        run: |
          python3 trusted/packages/sql-semantics/assurance/run_server_join.py \
            --engine "$ENGINE" --release "$RELEASE" \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --out "$RUNNER_TEMP/semantics-ir-join-evidence"
      - name: Compare native row selection and ordering
        if: ${{ !cancelled() }}
