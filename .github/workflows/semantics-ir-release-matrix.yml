name: SemanticsIR native release matrix

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Full candidate commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  comparison:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: mysql
            release: '5.6.51'
            port: 3306
            image: mysql@sha256:20575ecebe6216036d25dab5903808211f1e9ba63dc7825ac20cb975e34cfcae
          - engine: mysql
            release: '5.7.44'
            port: 3306
            image: mysql@sha256:4bc6bc963e6d8443453676cae56536f4b8156d78bae03c0145cbe47c2aad73bb
          - engine: mysql
            release: '8.0.44'
            port: 3306
            image: mysql@sha256:9c3380eac945af0736031b200027f581925927c81e010056214a4bd6b6693714
          - engine: mysql
            release: '8.1.0'
            port: 3306
            image: mysql@sha256:f61944ff3f2961363a4d22913b2ac581523273679d7e14dd26e8db8c9f571a7e
          - engine: mysql
            release: '8.2.0'
            port: 3306
            image: mysql@sha256:212fe73edca5df6ff14826d5eb975c914bfb91f82a2e923f9050568f99525da1
          - engine: mysql
            release: '8.3.0'
            port: 3306
            image: mysql@sha256:9de9d54fecee6253130e65154b930978b1fcc336bcc86dfd06e89b72a2588ebe
          - engine: mysql
            release: '8.4.7'
            port: 3306
            image: mysql@sha256:0426ec38c7a10aa45ba383887df7878f74ee70e2fd589c7b69207f3577901903
          - engine: mysql
            release: '9.0.1'
            port: 3306
            image: mysql@sha256:92dc869678019f65d761155dacac660a904f6245bfe1b7997da0a73b2bfc68c9
          - engine: mysql
            release: '9.1.0'
            port: 3306
            image: container-registry.oracle.com/mysql/community-server@sha256:d41e2405f035982ef25911a3e21283cbbccd5e967bafffd3454031c050b37eac
          - engine: postgres
            release: '16.6'
            port: 5432
            image: postgres@sha256:557fea37a744d5f4c8faab304b0a90858b53ab119735a88c131fd19dab802f36
          - engine: postgres
            release: '17.2'
            port: 5432
            image: postgres@sha256:3267c505060a0052e5aa6e5175a7b41ab6b04da2f8c4540fc6e98a37210aa2d3
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: ir_fixture
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: ir_fixture
          POSTGRES_PASSWORD: ir_fixture
          POSTGRES_DB: ir_fixture
        ports:
          - ${{ matrix.port }}/tcp
        options: >-
          --health-cmd "${{ matrix.engine == 'mysql' && 'mysqladmin ping -h 127.0.0.1 --silent' || 'pg_isready -h 127.0.0.1 -U postgres -d ir_fixture' }}"
          --health-interval 10s
          --health-start-period 40s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Validate the requested candidate identity
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: test "${#CANDIDATE}" -eq 40 && [[ "$CANDIDATE" =~ ^[0-9a-f]+$ ]]
      - name: Check out the acceptance tools from the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - name: Check out the candidate as input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate }}
          path: candidate
          persist-credentials: false
      - name: Set up PHP for the observer
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_pgsql
          coverage: none
      - name: Install locked audit dependencies from the acceptance revision
        working-directory: trusted/packages/sql-semantics-sqlite
        env:
          COMPOSER_ROOT_VERSION: dev-main
        run: composer install --no-interaction --no-plugins --no-scripts --prefer-dist --no-progress
      - name: Load the isolated candidate runtime
        run: docker pull php@sha256:f1ef73e865793418aac8cf6d8dbb44b33b527cdac62dbcf2e47061ed8f40b81a
      - name: Run the observed release and verify the distribution
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          ENGINE: ${{ matrix.engine }}
          RELEASE: ${{ matrix.release }}
          ZTD_IR_MYSQL_DSN: mysql:host=127.0.0.1;port=${{ job.services.database.ports[matrix.port] }};dbname=ir_fixture;charset=utf8mb4
          ZTD_IR_MYSQL_USER: root
          ZTD_IR_MYSQL_PASSWORD: ir_fixture
          ZTD_IR_POSTGRES_DSN: pgsql:host=127.0.0.1;port=${{ job.services.database.ports[matrix.port] }};dbname=ir_fixture
          ZTD_IR_POSTGRES_USER: postgres
          ZTD_IR_POSTGRES_PASSWORD: ir_fixture
        run: |
          python3 trusted/packages/sql-semantics/assurance/run_server.py \
            --engine "$ENGINE" --release "$RELEASE" \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --out "$RUNNER_TEMP/semantics-ir-evidence"
      - name: Observe native DELETE effects and rollback
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          ENGINE: ${{ matrix.engine }}
          RELEASE: ${{ matrix.release }}
          ZTD_IR_MYSQL_DSN: mysql:host=127.0.0.1;port=${{ job.services.database.ports[matrix.port] }};dbname=ir_fixture;charset=utf8mb4
          ZTD_IR_MYSQL_USER: root
          ZTD_IR_MYSQL_PASSWORD: ir_fixture
          ZTD_IR_POSTGRES_DSN: pgsql:host=127.0.0.1;port=${{ job.services.database.ports[matrix.port] }};dbname=ir_fixture
          ZTD_IR_POSTGRES_USER: postgres
          ZTD_IR_POSTGRES_PASSWORD: ir_fixture
        run: |
          python3 trusted/packages/sql-semantics/assurance/run_server_delete.py \
            --engine "$ENGINE" --release "$RELEASE" \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --out "$RUNNER_TEMP/semantics-ir-delete-evidence"
      - name: Compare native joins and filters
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          ENGINE: ${{ matrix.engine }}
          RELEASE: ${{ matrix.release }}
          ZTD_IR_MYSQL_DSN: mysql:host=127.0.0.1;port=${{ job.services.database.ports[matrix.port] }};dbname=ir_fixture;charset=utf8mb4
          ZTD_IR_MYSQL_USER: root
          ZTD_IR_MYSQL_PASSWORD: ir_fixture
          ZTD_IR_POSTGRES_DSN: pgsql:host=127.0.0.1;port=${{ job.services.database.ports[matrix.port] }};dbname=ir_fixture
          ZTD_IR_POSTGRES_USER: postgres
          ZTD_IR_POSTGRES_PASSWORD: ir_fixture
        run: |
          python3 trusted/packages/sql-semantics/assurance/run_server_join.py \
            --engine "$ENGINE" --release "$RELEASE" \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --out "$RUNNER_TEMP/semantics-ir-join-evidence"
      - name: Compare native row selection and ordering
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          ENGINE: ${{ matrix.engine }}
          RELEASE: ${{ matrix.release }}
          ZTD_IR_MYSQL_DSN: mysql:host=127.0.0.1;port=${{ job.services.database.ports[matrix.port] }};dbname=ir_fixture;charset=utf8mb4
          ZTD_IR_MYSQL_USER: root
          ZTD_IR_MYSQL_PASSWORD: ir_fixture
          ZTD_IR_POSTGRES_DSN: pgsql:host=127.0.0.1;port=${{ job.services.database.ports[matrix.port] }};dbname=ir_fixture
          ZTD_IR_POSTGRES_USER: postgres
          ZTD_IR_POSTGRES_PASSWORD: ir_fixture
        run: |
          python3 trusted/packages/sql-semantics/assurance/run_server_result.py \
            --engine "$ENGINE" --release "$RELEASE" \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --out "$RUNNER_TEMP/semantics-ir-result-evidence"
      - name: Compare native literal INSERT effects
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          ENGINE: ${{ matrix.engine }}
          RELEASE: ${{ matrix.release }}
          ZTD_IR_MYSQL_DSN: mysql:host=127.0.0.1;port=${{ job.services.database.ports[matrix.port] }};dbname=ir_fixture;charset=utf8mb4
          ZTD_IR_MYSQL_USER: root
          ZTD_IR_MYSQL_PASSWORD: ir_fixture
          ZTD_IR_POSTGRES_DSN: pgsql:host=127.0.0.1;port=${{ job.services.database.ports[matrix.port] }};dbname=ir_fixture
          ZTD_IR_POSTGRES_USER: postgres
          ZTD_IR_POSTGRES_PASSWORD: ir_fixture
        run: |
          python3 trusted/packages/sql-semantics/assurance/run_server_insert.py \
            --engine "$ENGINE" --release "$RELEASE" \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --out "$RUNNER_TEMP/semantics-ir-insert-evidence"
      - name: Preserve observations and any failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: semantics-ir-${{ matrix.engine }}-${{ matrix.release }}
          path: ${{ runner.temp }}/semantics-ir-evidence/
      - name: Preserve native DELETE observations and any failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-delete-${{ matrix.engine }}-${{ matrix.release }}
          path: ${{ runner.temp }}/semantics-ir-delete-evidence/
      - name: Preserve native join observations and any failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-join-${{ matrix.engine }}-${{ matrix.release }}
          path: ${{ runner.temp }}/semantics-ir-join-evidence/
      - name: Preserve native result observations and any failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-result-${{ matrix.engine }}-${{ matrix.release }}
          path: ${{ runner.temp }}/semantics-ir-result-evidence/
      - name: Preserve native INSERT observations and any failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-insert-${{ matrix.engine }}-${{ matrix.release }}
          path: ${{ runner.temp }}/semantics-ir-insert-evidence/

  collect:
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    needs: comparison
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    timeout-minutes: 5
    steps:
      - name: Validate the requested candidate identity
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: test "${#CANDIDATE}" -eq 40 && [[ "$CANDIDATE" =~ ^[0-9a-f]+$ ]]
      - name: Check out the acceptance tools from the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - name: Check out the candidate for distribution verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate }}
          path: candidate
          persist-credentials: false
      - name: Download the protected release records
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download "$GITHUB_RUN_ID" --pattern 'semantics-ir-*' --dir "$RUNNER_TEMP/server-matrix"
          gh run download "$GITHUB_RUN_ID" --pattern 'native-delete-*' --dir "$RUNNER_TEMP/delete-matrix"
      - name: Download the protected join records
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" --pattern 'native-join-*' --dir "$RUNNER_TEMP/join-matrix"
      - name: Download the protected result records
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" --pattern 'native-result-*' --dir "$RUNNER_TEMP/result-matrix"
      - name: Download the protected INSERT records
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" --pattern 'native-insert-*' --dir "$RUNNER_TEMP/insert-matrix"
      - name: Require all native projection releases
        if: ${{ !cancelled() }}
        env:
          CANDIDATE: ${{ inputs.candidate }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          shopt -s nullglob
          indexes=("$RUNNER_TEMP"/server-matrix/index.json "$RUNNER_TEMP"/server-matrix/*/index.json)
          if [[ ! -f "${indexes[0]}" ]]; then
            indexes=("${indexes[@]:1}")
          fi
          python3 trusted/packages/sql-semantics/assurance/combine_server_evidence.py \
            --candidate "$CANDIDATE" --candidate-root candidate \
            --out "$RUNNER_TEMP/server-matrix.json" "${indexes[@]}"
      - name: Require all native DELETE releases
        if: ${{ !cancelled() }}
        env:
          CANDIDATE: ${{ inputs.candidate }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          shopt -s nullglob
          indexes=("$RUNNER_TEMP"/delete-matrix/*/index.json)
          python3 trusted/packages/sql-semantics/assurance/combine_server_delete_evidence.py \
            --candidate "$CANDIDATE" --candidate-root candidate \
            --out "$RUNNER_TEMP/delete-matrix.json" "${indexes[@]}"
      - name: Require all native join releases
        if: ${{ !cancelled() }}
        env:
          CANDIDATE: ${{ inputs.candidate }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          shopt -s nullglob
          indexes=("$RUNNER_TEMP"/join-matrix/*/index.json)
          python3 trusted/packages/sql-semantics/assurance/combine_server_join_evidence.py \
            --candidate "$CANDIDATE" --candidate-root candidate \
            --out "$RUNNER_TEMP/join-matrix.json" "${indexes[@]}"
      - name: Require all native result releases
        if: ${{ !cancelled() }}
        env:
          CANDIDATE: ${{ inputs.candidate }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          shopt -s nullglob
          indexes=("$RUNNER_TEMP"/result-matrix/*/index.json)
          python3 trusted/packages/sql-semantics/assurance/combine_server_result_evidence.py \
            --candidate "$CANDIDATE" --candidate-root candidate \
            --out "$RUNNER_TEMP/result-matrix.json" "${indexes[@]}"
      - name: Require all native INSERT releases
        if: ${{ !cancelled() }}
        env:
          CANDIDATE: ${{ inputs.candidate }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          shopt -s nullglob
          indexes=("$RUNNER_TEMP"/insert-matrix/*/index.json)
          python3 trusted/packages/sql-semantics/assurance/combine_server_insert_evidence.py \
            --candidate "$CANDIDATE" --candidate-root candidate \
            --out "$RUNNER_TEMP/insert-matrix.json" "${indexes[@]}"
      - name: Preserve the native projection matrix report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-projection-matrix
          path: ${{ runner.temp }}/server-matrix.json
      - name: Preserve the native DELETE matrix report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-delete-matrix
          path: ${{ runner.temp }}/delete-matrix.json
      - name: Preserve the native join matrix report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-join-matrix
          path: ${{ runner.temp }}/join-matrix.json
      - name: Preserve the native result matrix report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-result-matrix
          path: ${{ runner.temp }}/result-matrix.json
      - name: Preserve the native INSERT matrix report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-insert-matrix
          path: ${{ runner.temp }}/insert-matrix.json
