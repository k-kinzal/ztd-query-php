        if: ${{ always() && matrix.release != '5.6.51' && matrix.release != '5.7.44' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-recursive-series-${{ matrix.engine }}-${{ matrix.release }}
          path: ${{ runner.temp }}/semantics-ir-recursive-series-evidence/
      - name: Preserve native local projection observations and any failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-local-projection-${{ matrix.engine }}-${{ matrix.release }}
          path: ${{ runner.temp }}/semantics-ir-local-projection-evidence/
      - name: Preserve native compound observations and any failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-compound-${{ matrix.engine }}-${{ matrix.release }}
          path: ${{ runner.temp }}/semantics-ir-compound-evidence/

  collect:
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    needs: comparison
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    timeout-minutes: 5
    steps:
      - name: Validate the requested candidate identity
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: test "${#CANDIDATE}" -eq 40 && [[ "$CANDIDATE" =~ ^[0-9a-f]+$ ]]
      - name: Check out the acceptance tools from the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - name: Check out the candidate for distribution verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate }}
          path: candidate
          persist-credentials: false
      - name: Download the native release records from this run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/evidence/native"
          gh run download "$GITHUB_RUN_ID" --pattern 'semantics-ir-*' --pattern 'native-*' \
            --dir "$RUNNER_TEMP/evidence/native"
      - name: Replay every required domain and release
        if: ${{ !cancelled() }}
        env:
          CANDIDATE: ${{ inputs.candidate }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 trusted/packages/sql-semantics/assurance/collect_native_replays.py \
            --candidate "$CANDIDATE" --candidate-root candidate \
            --evidence-root "$RUNNER_TEMP/evidence" --layout workflow
      - name: Preserve the native replay receipts and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-release-replays
          path: ${{ runner.temp }}/evidence/native-replay/
