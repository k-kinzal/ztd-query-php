name: SQLite Docs

on:
  push:
    branches:
      - main
    paths:
      - 'packages/ztd-query-sqlite/**'
      - 'packages/ztd-query-core/**'
      - 'packages/sql-faker/**'
      - '.github/workflows/ztd-query-sqlite-docs.yml'
      - '.github/workflows/ztd-query-sqlite-docs-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sql-faker-docs-publish
  cancel-in-progress: false
  queue: max

env:
  COMPOSER_NO_INTERACTION: '1'
  DOCS_BRANCH: gh-pages

jobs:
  publish:
    name: Generate and publish the documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: ctype, date, dom, filter, hash, iconv, json, libxml, mbstring, pcntl, pcre, pdo, pdo_sqlite, phar, reflection, simplexml, spl, tokenizer, xml, xmlwriter, gd
          coverage: pcov

      - name: Select the locked PHP dependency graph
        run: |
          cp packages/ztd-query-sqlite/composer.lock.php-8.5 packages/ztd-query-sqlite/composer.lock
          composer --working-dir=packages/ztd-query-sqlite validate --strict --no-check-publish --no-check-all

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
        with:
          working-directory: packages/ztd-query-sqlite
          dependency-versions: locked
          composer-options: --prefer-dist
          require-lock-file: true

      - name: Check installed platform requirements
        run: composer --working-dir=packages/ztd-query-sqlite check-platform-reqs

      - name: Restore the DocGen cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: packages/ztd-query-sqlite/build/docgen-cache
          key: ztd-query-sqlite-docgen-${{ runner.os }}-${{ hashFiles('packages/ztd-query-sqlite/composer.lock') }}-${{ github.sha }}
          restore-keys: |
            ztd-query-sqlite-docgen-${{ runner.os }}-${{ hashFiles('packages/ztd-query-sqlite/composer.lock') }}-
            ztd-query-sqlite-docgen-${{ runner.os }}-

      - name: Generate the coverage report the site reads
        run: composer --working-dir=packages/ztd-query-sqlite test -- --coverage-xml build/coverage-xml

      - name: Generate the documentation
        run: |
          set -euo pipefail

          repository="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          composer --working-dir=packages/ztd-query-sqlite docgen -- --coverage=packages/ztd-query-sqlite/build/coverage-xml \
            --base-url="https://${repository%%/*}.github.io/${repository#*/}/sqlite"

      - name: Check out the documentation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.DOCS_BRANCH }}
          path: .docs-branch

      - name: Publish the site
        working-directory: .docs-branch
        run: |
          set -euo pipefail

          mkdir -p sqlite
          rsync -a --checksum --delete ../packages/ztd-query-sqlite/build/docs/ sqlite/
          touch .nojekyll

          git add --all
          if git diff --cached --quiet; then
            echo "The ${DOCS_BRANCH} branch already serves this documentation."
            exit 0
          fi

          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --message "docs: generate from ${GITHUB_SHA}"
          git push origin "HEAD:${DOCS_BRANCH}"

      - name: Build GitHub Pages and wait for publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          expected_sha="$(git -C .docs-branch rev-parse HEAD)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" > /dev/null
          for attempt in {1..60}; do
            build="$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest")"
            if [ "$(jq -r .commit <<< "$build")" = "$expected_sha" ]; then
              case "$(jq -r .status <<< "$build")" in
                built) exit 0 ;;
                errored) jq .error <<< "$build"; exit 1 ;;
              esac
            fi
            sleep 10
          done
          echo 'Timed out waiting for GitHub Pages publication.' >&2
          exit 1
