name: CI (requirements)

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'packages/requirements/**'
      - '.github/workflows/requirements.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: packages/requirements

jobs:
  test:
    name: Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, mbstring, xml, xmlwriter
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer check-platform-reqs
      - name: Install document-schema reference validator
        run: |
          curl --fail --location --silent --show-error https://github.com/iwe-org/schematter/releases/download/schematter-v0.2.0/schematter-v0.2.0-x86_64-unknown-linux-gnu.tar.gz -o /tmp/schematter.tar.gz
          echo '8e0c56ae67d670bffbcc9ec7c1b159ee108a86d2da2de420715c6cf78bba25d7  /tmp/schematter.tar.gz' | sha256sum --check
          mkdir -p /tmp/schematter-bin
          tar -xzf /tmp/schematter.tar.gz -C /tmp/schematter-bin
          echo /tmp/schematter-bin >> "$GITHUB_PATH"
      - run: composer test
      - run: composer lint
        if: matrix.php == '8.3'
      - name: Check the documented example
        run: |
          php bin/requirements lint --config examples/requirements.yaml
          php bin/requirements format --check --config examples/requirements.yaml
          php bin/requirements check --config examples/requirements.yaml
          php bin/requirements coverage --config examples/requirements.yaml
      - name: Check the experimental Markdown example
        run: |
          php bin/requirements lint --config examples/markdown/requirements.yaml
          php bin/requirements format --check --config examples/markdown/requirements.yaml
          php bin/requirements check --config examples/markdown/requirements.yaml
          php bin/requirements coverage --config examples/markdown/requirements.yaml
      - name: Verify EARS acceptance specifications
        run: |
          php bin/requirements lint
          php bin/requirements format --check
          php bin/requirements spec
      - name: Check the published EARS source
        if: matrix.php == '8.3'
        run: |
          php bin/requirements check
          php bin/requirements coverage
