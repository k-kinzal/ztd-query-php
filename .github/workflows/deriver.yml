name: CI (deriver)

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'packages/deriver/**'
      - 'packages/requirements/**'
      - '.github/workflows/deriver.yml'
      - '!packages/**/README.md'
      - '!packages/**/docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_NO_INTERACTION: '1'

defaults:
  run:
    shell: bash
    working-directory: packages/deriver

jobs:
  test:
    name: Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, filter, hash, iconv, json, libxml, mbstring, pcntl, pcre, pdo, pdo_sqlite, phar, reflection, simplexml, spl, tokenizer, xml, xmlwriter
          coverage: none
      - name: Validate the Composer manifest and lock file
        run: composer validate --strict --no-check-publish
      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
        with:
          working-directory: packages/deriver
          dependency-versions: locked
          composer-options: --prefer-dist
          require-lock-file: true
      - name: Check installed platform requirements
        if: matrix.php == '8.1' || matrix.php == '8.2' || matrix.php == '8.3'
        run: composer check-platform-reqs
      - name: Check library requirements outside the locked ParaTest PHP range
        if: matrix.php == '8.4' || matrix.php == '8.5'
        run: composer check-platform-reqs --no-dev
      - name: Run unit and integration tests in parallel
        run: composer test
      - name: Verify isolated PHP syntax and built-in function specifications
        run: composer spec
      - name: Check PHPDoc examples
        run: composer doctest

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: dom, filter, hash, iconv, json, libxml, mbstring, pcntl, pcre, pdo, pdo_sqlite, phar, reflection, simplexml, spl, tokenizer, xml, xmlwriter
          coverage: none
      - name: Validate the Composer manifest and lock file
        run: composer validate --strict --no-check-publish
      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
        with:
          working-directory: packages/deriver
          dependency-versions: locked
          composer-options: --prefer-dist
          require-lock-file: true
      - name: Check installed platform requirements
        run: composer check-platform-reqs
      - name: Check PSR-4 paths and ambiguous classes
        run: composer autoload:check
      - name: Check the formatting
        run: composer format:check
      - name: Analyse with PHPStan
        run: composer phpstan
      - name: Check PHP compatibility
        run: composer compat
      - name: Check the source metrics
        run: composer loc-guard
      - name: Check the directory structure
        run: composer tree-guard
      - name: Check the architecture layers
        run: composer deptrac

  requirements:
    name: Requirements
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: dom, mbstring, xml, xmlwriter
          coverage: none
      - name: Install the traceability tool
        run: composer install --working-dir=../requirements --no-interaction --prefer-dist
      - name: Validate the syntax and function catalog against the PHP manual
        run: |
          php ../requirements/bin/requirements lint
          php ../requirements/bin/requirements format --check
          php ../requirements/bin/requirements check
      - name: Enforce coverage and keep the checked-in coverage snapshot reproducible
        run: |
          php ../requirements/bin/requirements coverage --write-snapshot /tmp/current-snapshot.json
          cmp requirements-snapshot.json /tmp/current-snapshot.json
      - name: Review changes to the manual inventory
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          snapshot="origin/$BASE_REF:packages/deriver/requirements-snapshot.json"
          catalog="origin/$BASE_REF:packages/deriver/requirements/function.yaml"
          if git cat-file -e "$snapshot" 2>/dev/null && git cat-file -e "$catalog" 2>/dev/null; then
            git show "$snapshot" > /tmp/base-snapshot.json
            php ../requirements/bin/requirements coverage --snapshot /tmp/base-snapshot.json
          else
            echo 'Initial adoption: review the scope and enforce the configured total coverage gate.'
          fi
      - name: Install dependencies for linked Behat specifications
        run: composer install --no-interaction --prefer-dist
      - name: Run every linked test and require one for each specification
        run: php ../requirements/bin/requirements spec --strict
