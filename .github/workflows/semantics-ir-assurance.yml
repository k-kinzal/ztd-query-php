name: SemanticsIR assurance evidence

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Full candidate commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  initial-domain:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: container-registry.oracle.com/mysql/community-server@sha256:d41e2405f035982ef25911a3e21283cbbccd5e967bafffd3454031c050b37eac
        env:
          MYSQL_ROOT_PASSWORD: ir_fixture
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: ir_fixture
        ports:
          - 3306/tcp
        options: >-
          --health-cmd "mysqladmin ping -h localhost --silent"
          --health-interval 10s
          --health-start-period 40s
          --health-timeout 5s
          --health-retries 12
      postgres:
        image: postgres@sha256:3267c505060a0052e5aa6e5175a7b41ab6b04da2f8c4540fc6e98a37210aa2d3
        env:
          POSTGRES_PASSWORD: ir_fixture
          POSTGRES_DB: ir_fixture
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d ir_fixture"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    steps:
      - name: Validate the requested candidate identity
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: test "${#CANDIDATE}" -eq 40 && [[ "$CANDIDATE" =~ ^[0-9a-f]+$ ]]
      - name: Check out the acceptance tools from the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - name: Check out the candidate as input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate }}
          path: candidate
          persist-credentials: false
      - name: Set up PHP for the independent source audit
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_pgsql
          coverage: none
      - name: Install locked audit dependencies from the acceptance revision
        working-directory: trusted/packages/sql-semantics-sqlite
        env:
          COMPOSER_ROOT_VERSION: dev-main
        run: composer install --no-interaction --no-plugins --no-scripts --prefer-dist --no-progress
      - name: Prepare pinned engine and isolated candidate runtime
        run: |
          curl -fsSL https://sqlite.org/2024/sqlite-amalgamation-3470200.zip -o "$RUNNER_TEMP/sqlite.zip"
          echo "aa73d8748095808471deaa8e6f34aa700e37f2f787f4425744f53fdd15a89c40  $RUNNER_TEMP/sqlite.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/sqlite.zip" -d "$RUNNER_TEMP"
          cc -O2 -DSQLITE_THREADSAFE=1 -shared -fPIC "$RUNNER_TEMP/sqlite-amalgamation-3470200/sqlite3.c" -o "$RUNNER_TEMP/libsqlite3.so"
          docker pull php@sha256:f1ef73e865793418aac8cf6d8dbb44b33b527cdac62dbcf2e47061ed8f40b81a
      - name: Collect initial-domain observations
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 trusted/packages/sql-semantics/assurance/run.py \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --sqlite-library "$RUNNER_TEMP/libsqlite3.so" \
            --out "$RUNNER_TEMP/semantics-ir-evidence"
      - name: Collect the joined SQLite domain
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 trusted/packages/sql-semantics/assurance/run_sqlite_relational.py \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --sqlite-library "$RUNNER_TEMP/libsqlite3.so" \
            --out "$RUNNER_TEMP/semantics-ir-sqlite-relational-evidence"
      - name: Collect SQLite result selection observations
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 trusted/packages/sql-semantics/assurance/run_sqlite_result.py \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --sqlite-library "$RUNNER_TEMP/libsqlite3.so" \
            --out "$RUNNER_TEMP/semantics-ir-sqlite-result-evidence"
      - name: Collect SQLite write-effect observations
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 trusted/packages/sql-semantics/assurance/run_sqlite_delete.py \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --sqlite-library "$RUNNER_TEMP/libsqlite3.so" \
            --out "$RUNNER_TEMP/semantics-ir-sqlite-delete-evidence"
      - name: Collect SQLite VALUES observations
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 trusted/packages/sql-semantics/assurance/run_sqlite_values.py \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --sqlite-library "$RUNNER_TEMP/libsqlite3.so" \
            --out "$RUNNER_TEMP/semantics-ir-sqlite-values-evidence"
      - name: Collect SQLite local source observations
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 trusted/packages/sql-semantics/assurance/run_sqlite_local_source.py \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --sqlite-library "$RUNNER_TEMP/libsqlite3.so" \
            --out "$RUNNER_TEMP/semantics-ir-sqlite-local-source-evidence"
      - name: Collect SQLite recursive source observations
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 trusted/packages/sql-semantics/assurance/run_sqlite_recursive_source.py \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --sqlite-library "$RUNNER_TEMP/libsqlite3.so" \
            --out "$RUNNER_TEMP/semantics-ir-sqlite-recursive-source-evidence"
      - name: Collect SQLite INSERT effect observations
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 trusted/packages/sql-semantics/assurance/run_sqlite_insert.py \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --sqlite-library "$RUNNER_TEMP/libsqlite3.so" \
            --out "$RUNNER_TEMP/semantics-ir-sqlite-insert-evidence"
      - name: Collect SQLite UPDATE effect observations
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 trusted/packages/sql-semantics/assurance/run_sqlite_update.py \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --sqlite-library "$RUNNER_TEMP/libsqlite3.so" \
            --out "$RUNNER_TEMP/semantics-ir-sqlite-update-evidence"
      - name: Collect SQLite DROP TABLE effects
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 trusted/packages/sql-semantics/assurance/run_sqlite_drop_table.py \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --sqlite-library "$RUNNER_TEMP/libsqlite3.so" \
            --out "$RUNNER_TEMP/semantics-ir-sqlite-drop-table-evidence"
      - name: Collect SQLite CREATE TABLE effects
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 trusted/packages/sql-semantics/assurance/run_sqlite_create_table.py \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --sqlite-library "$RUNNER_TEMP/libsqlite3.so" \
            --out "$RUNNER_TEMP/semantics-ir-sqlite-create-table-evidence"
      - name: Collect SQLite scalar literal and expression observations
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 trusted/packages/sql-semantics/assurance/run_sqlite_scalars.py \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --sqlite-library "$RUNNER_TEMP/libsqlite3.so" --out "$RUNNER_TEMP/semantics-ir-sqlite-scalars-evidence"
      - name: Collect SQLite compound query observations
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 trusted/packages/sql-semantics/assurance/run_sqlite_compound.py \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --sqlite-library "$RUNNER_TEMP/libsqlite3.so" --out "$RUNNER_TEMP/semantics-ir-sqlite-compound-evidence"
      - name: Collect SQLite transaction state and lock observations
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 trusted/packages/sql-semantics/assurance/run_sqlite_transaction.py \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --sqlite-library "$RUNNER_TEMP/libsqlite3.so" --out "$RUNNER_TEMP/semantics-ir-sqlite-transaction-evidence"
      - name: Collect SQLite grouped count and collation observations
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 trusted/packages/sql-semantics/assurance/run_sqlite_grouped.py \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --sqlite-library "$RUNNER_TEMP/libsqlite3.so" --out "$RUNNER_TEMP/semantics-ir-sqlite-grouped-evidence"
      - name: Collect SQLite row and aggregate group filter observations
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 trusted/packages/sql-semantics/assurance/run_sqlite_group_filter.py \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --sqlite-library "$RUNNER_TEMP/libsqlite3.so" --out "$RUNNER_TEMP/semantics-ir-sqlite-group-filter-evidence"
      - name: Collect SQLite wildcard projection observations
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 trusted/packages/sql-semantics/assurance/run_sqlite_wildcard.py \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --sqlite-library "$RUNNER_TEMP/libsqlite3.so" --out "$RUNNER_TEMP/semantics-ir-sqlite-wildcard-evidence"
      - name: Collect SQLite INSERT query observations
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 trusted/packages/sql-semantics/assurance/run_sqlite_insert_query.py \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --sqlite-library "$RUNNER_TEMP/libsqlite3.so" --out "$RUNNER_TEMP/semantics-ir-sqlite-insert-query-evidence"
      - name: Collect SQLite INSERT input observations
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 trusted/packages/sql-semantics/assurance/run_sqlite_insert_input.py \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --sqlite-library "$RUNNER_TEMP/libsqlite3.so" --out "$RUNNER_TEMP/semantics-ir-sqlite-insert-input-evidence"
      - name: Collect SQLite CASE observations
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 trusted/packages/sql-semantics/assurance/run_sqlite_case.py \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --sqlite-library "$RUNNER_TEMP/libsqlite3.so" --out "$RUNNER_TEMP/semantics-ir-sqlite-case-evidence"
      - name: Collect SQLite CAST observations
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 trusted/packages/sql-semantics/assurance/run_sqlite_cast.py \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --sqlite-library "$RUNNER_TEMP/libsqlite3.so" --out "$RUNNER_TEMP/semantics-ir-sqlite-cast-evidence"
      - name: Collect SQLite numeric operator observations
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 trusted/packages/sql-semantics/assurance/run_sqlite_numeric.py \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --sqlite-library "$RUNNER_TEMP/libsqlite3.so" --out "$RUNNER_TEMP/semantics-ir-sqlite-numeric-evidence"
      - name: Collect SQLite prefix operator and NULL test observations
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 trusted/packages/sql-semantics/assurance/run_sqlite_unary.py \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --sqlite-library "$RUNNER_TEMP/libsqlite3.so" --out "$RUNNER_TEMP/semantics-ir-sqlite-unary-evidence"
      - name: Collect SQLite resolved truth-word and Boolean test observations
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 trusted/packages/sql-semantics/assurance/run_sqlite_truth.py \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --sqlite-library "$RUNNER_TEMP/libsqlite3.so" --out "$RUNNER_TEMP/semantics-ir-sqlite-truth-evidence"
      - name: Collect SQLite scalar range test observations
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 trusted/packages/sql-semantics/assurance/run_sqlite_between.py \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --sqlite-library "$RUNNER_TEMP/libsqlite3.so" --out "$RUNNER_TEMP/semantics-ir-sqlite-between-evidence"
      - name: Collect SQLite scalar membership and empty-list binding observations
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 trusted/packages/sql-semantics/assurance/run_sqlite_membership.py \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --sqlite-library "$RUNNER_TEMP/libsqlite3.so" --out "$RUNNER_TEMP/semantics-ir-sqlite-membership-evidence"
      - name: Collect SQLite folded membership binding observations
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 trusted/packages/sql-semantics/assurance/run_sqlite_folded_membership.py \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --sqlite-library "$RUNNER_TEMP/libsqlite3.so" --out "$RUNNER_TEMP/semantics-ir-sqlite-folded-membership-evidence"
      - name: Collect SQLite builtin collation and ordering observations
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 trusted/packages/sql-semantics/assurance/run_sqlite_collation.py \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --sqlite-library "$RUNNER_TEMP/libsqlite3.so" --out "$RUNNER_TEMP/semantics-ir-sqlite-collation-evidence"
      - name: Collect SQLite concatenation and TEXT byte observations
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 trusted/packages/sql-semantics/assurance/run_sqlite_concatenation.py \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --sqlite-library "$RUNNER_TEMP/libsqlite3.so" --out "$RUNNER_TEMP/semantics-ir-sqlite-concatenation-evidence"
      - name: Collect SQLite built-in pattern observations
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 trusted/packages/sql-semantics/assurance/run_sqlite_pattern.py \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --sqlite-library "$RUNNER_TEMP/libsqlite3.so" --out "$RUNNER_TEMP/semantics-ir-sqlite-pattern-evidence"
      - name: Collect SQLite literal default observations
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 trusted/packages/sql-semantics/assurance/run_sqlite_defaults.py \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --sqlite-library "$RUNNER_TEMP/libsqlite3.so" --out "$RUNNER_TEMP/semantics-ir-sqlite-defaults-evidence"
      - name: Collect SQLite DELETE RETURNING observations
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 trusted/packages/sql-semantics/assurance/run_sqlite_delete_returning.py \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --sqlite-library "$RUNNER_TEMP/libsqlite3.so" --out "$RUNNER_TEMP/semantics-ir-sqlite-delete-returning-evidence"
      - name: Collect SQLite UPDATE RETURNING observations
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 trusted/packages/sql-semantics/assurance/run_sqlite_update_returning.py \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --sqlite-library "$RUNNER_TEMP/libsqlite3.so" --out "$RUNNER_TEMP/semantics-ir-sqlite-update-returning-evidence"
      - name: Collect SQLite INSERT RETURNING observations
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 trusted/packages/sql-semantics/assurance/run_sqlite_insert_returning.py \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --sqlite-library "$RUNNER_TEMP/libsqlite3.so" --out "$RUNNER_TEMP/semantics-ir-sqlite-insert-returning-evidence"
      - name: Collect MySQL and PostgreSQL projection observations
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          ZTD_IR_MYSQL_DSN: mysql:host=127.0.0.1;port=${{ job.services.mysql.ports[3306] }};dbname=ir_fixture;charset=utf8mb4
          ZTD_IR_MYSQL_USER: root
          ZTD_IR_MYSQL_PASSWORD: ir_fixture
          ZTD_IR_POSTGRES_DSN: pgsql:host=127.0.0.1;port=${{ job.services.postgres.ports[5432] }};dbname=ir_fixture
          ZTD_IR_POSTGRES_USER: postgres
          ZTD_IR_POSTGRES_PASSWORD: ir_fixture
        run: |
          python3 trusted/packages/sql-semantics/assurance/run_server.py \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --out "$RUNNER_TEMP/semantics-ir-server-evidence"
      - name: Index the SQLite domains for the same candidate
        if: ${{ !cancelled() }}
        env:
          CANDIDATE: ${{ inputs.candidate }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 trusted/packages/sql-semantics/assurance/combine_sqlite_evidence.py \
            --root "$RUNNER_TEMP" --candidate "$CANDIDATE" --candidate-root candidate \
            --sqlite-library "$RUNNER_TEMP/libsqlite3.so" --out "$RUNNER_TEMP/sqlite-index"
      - name: Exercise evidence and package verification controls
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 trusted/packages/sql-semantics/assurance/assurance_controls.py \
            --root "$RUNNER_TEMP" --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --sqlite-library "$RUNNER_TEMP/libsqlite3.so" --out "$RUNNER_TEMP/assurance-controls"
      - name: Verify native constructor boundaries and guard faults
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 trusted/packages/sql-semantics/assurance/check_native_boundaries.py \
            --candidate candidate \
            --tool-autoload trusted/packages/sql-semantics-sqlite/vendor/autoload.php \
            --out "$RUNNER_TEMP/native-boundaries"
      - name: Verify installed Composer package bytes and publication
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 trusted/packages/sql-semantics/assurance/verify_release_layout.py \
            --candidate candidate --out "$RUNNER_TEMP/release-layout"
      - name: Compile the candidate evidence index
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          verifier="trusted/packages/sql-semantics/assurance"
          python3 "$verifier/index_evidence.py" \
            --candidate candidate --verifier "$verifier" \
            --evidence-root "$RUNNER_TEMP" --out "$RUNNER_TEMP/review-bundle"
      - name: Preserve observations and any failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semantics-ir-evidence
          path: |
            ${{ runner.temp }}/semantics-ir-evidence/
            ${{ runner.temp }}/semantics-ir-server-evidence/
            ${{ runner.temp }}/semantics-ir-sqlite-relational-evidence/
            ${{ runner.temp }}/semantics-ir-sqlite-result-evidence/
            ${{ runner.temp }}/semantics-ir-sqlite-delete-evidence/
            ${{ runner.temp }}/semantics-ir-sqlite-values-evidence/
            ${{ runner.temp }}/semantics-ir-sqlite-local-source-evidence/
            ${{ runner.temp }}/semantics-ir-sqlite-recursive-source-evidence/
            ${{ runner.temp }}/semantics-ir-sqlite-insert-evidence/
            ${{ runner.temp }}/semantics-ir-sqlite-update-evidence/
            ${{ runner.temp }}/semantics-ir-sqlite-drop-table-evidence/
            ${{ runner.temp }}/semantics-ir-sqlite-create-table-evidence/
            ${{ runner.temp }}/semantics-ir-sqlite-scalars-evidence/
            ${{ runner.temp }}/semantics-ir-sqlite-compound-evidence/
            ${{ runner.temp }}/semantics-ir-sqlite-transaction-evidence/
            ${{ runner.temp }}/semantics-ir-sqlite-grouped-evidence/
            ${{ runner.temp }}/semantics-ir-sqlite-group-filter-evidence/
            ${{ runner.temp }}/semantics-ir-sqlite-wildcard-evidence/
