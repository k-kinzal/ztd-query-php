name: Fuzz (ztd-query-mysqli-adapter)

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      max_runs:
        description: Maximum iterations per target
        default: '10000'
        type: string
      mysql_version:
        description: MySQL version
        default: all
        type: choice
        options: ['all', '8.0.44', '8.4.7']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: packages/ztd-query-mysqli-adapter

jobs:
  fuzz:
    name: ${{ matrix.target.corpus }} (MySQL ${{ matrix.mysql }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        mysql: ${{ inputs.mysql_version && inputs.mysql_version != 'all' && fromJson(format('["{0}"]', inputs.mysql_version)) || fromJson('["8.0.44", "8.4.7"]') }}
        target:
          - {script: fuzz_robustness_execute.php, corpus: robustness-execute}
          - {script: fuzz_correctness_select.php, corpus: correctness-select}
          - {script: fuzz_correctness_insert.php, corpus: correctness-insert}
          - {script: fuzz_correctness_replace.php, corpus: correctness-replace}
          - {script: fuzz_correctness_update.php, corpus: correctness-update}
          - {script: fuzz_correctness_delete.php, corpus: correctness-delete}
    env:
      MYSQL_VERSION: ${{ matrix.mysql }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: mbstring, mysqli, pdo_mysql, pcntl, dom, xml, xmlwriter, gd
          coverage: none
          ini-values: memory_limit=1G
      - name: Validate the Composer manifest
        run: composer validate --strict --no-check-publish --no-check-all
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
        with:
          working-directory: packages/ztd-query-mysqli-adapter
          dependency-versions: locked
          composer-options: --prefer-dist
          require-lock-file: true
      - name: Check installed platform requirements
        run: composer check-platform-reqs
      - name: Restore corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: packages/ztd-query-mysqli-adapter/fuzz/corpus/${{ matrix.target.corpus }}
          key: mysqli-fuzz-${{ matrix.mysql }}-${{ matrix.target.corpus }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mysqli-fuzz-${{ matrix.mysql }}-${{ matrix.target.corpus }}-
      - name: Run bounded fuzz campaign
        env:
          MAX_RUNS: ${{ inputs.max_runs || '10000' }}
          FUZZ_SCRIPT: ${{ matrix.target.script }}
          CORPUS: ${{ matrix.target.corpus }}
        run: |
          set -euo pipefail
          [[ "$MAX_RUNS" =~ ^[1-9][0-9]*$ ]] || { echo 'max_runs must be a positive integer' >&2; exit 1; }
          mkdir -p build/fuzz "fuzz/corpus/$CORPUS"
          if [[ -d "fuzz/seeds/$CORPUS" ]]; then
            cp "fuzz/seeds/$CORPUS/"* "fuzz/corpus/$CORPUS/"
          fi
          vendor/bin/php-fuzzer fuzz "fuzz/$FUZZ_SCRIPT" "fuzz/corpus/$CORPUS/" --timeout=15 --max-runs="$MAX_RUNS" 2>&1 | tee "build/fuzz/$CORPUS.log"
      - name: Open an issue for a finding
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          FUZZ_CORPUS: ${{ matrix.target.corpus }}
          FUZZ_SCRIPT: ${{ matrix.target.script }}
          FUZZ_MYSQL: ${{ matrix.mysql }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const corpus = process.env.FUZZ_CORPUS;
            const script = process.env.FUZZ_SCRIPT;
            const mysql = process.env.FUZZ_MYSQL;
            const root = path.resolve('packages/ztd-query-mysqli-adapter');
            const log = fs.readFileSync(path.join(root, `build/fuzz/${corpus}.log`), 'utf8');
            const finding = log.match(/^(?:CORPUS )?CRASH in (.+)!$/m);
            if (!finding) return;
            const input = fs.readFileSync(path.resolve(root, finding[1]));
            const hash = crypto.createHash('sha256').update(input).digest('hex');
            const marker = `<!-- ztd-query-mysqli-adapter-fuzz:${corpus}:${hash} -->`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', per_page: 100
            });
            if (issues.some(issue => !issue.pull_request && issue.body?.includes(marker))) return;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              `PHP-Fuzzer found a crash in the ${corpus} target on MySQL ${mysql}.`,
              `Commit: ${context.sha}`,
              `Workflow and input artifact: ${run} (mysqli-fuzz-${mysql}-${corpus})`,
              'Run from packages/ztd-query-mysqli-adapter after extracting the artifact:',
              '```sh',
              `MYSQL_VERSION=${mysql} vendor/bin/php-fuzzer run-single fuzz/${script} '${path.relative(root, path.resolve(root, finding[1]))}'`,
              '```',
              `Input SHA-256: ${hash}`,
              '<details><summary>PHP-Fuzzer output</summary>',
              '', '```text', log.slice(-45000), '```', '</details>'
            ].join('\n\n');
            await github.rest.issues.create({
              ...context.repo,
              title: `[ztd-query-mysqli-adapter fuzz] ${corpus}: ${hash.slice(0, 12)}`,
              body
            });
      - name: Save corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: packages/ztd-query-mysqli-adapter/fuzz/corpus/${{ matrix.target.corpus }}
          key: mysqli-fuzz-${{ matrix.mysql }}-${{ matrix.target.corpus }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload crash inputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mysqli-fuzz-${{ matrix.mysql }}-${{ matrix.target.corpus }}
          path: |
            packages/ztd-query-mysqli-adapter/crash-*
            packages/ztd-query-mysqli-adapter/build/fuzz/${{ matrix.target.corpus }}.log
            packages/ztd-query-mysqli-adapter/fuzz/corpus/
          if-no-files-found: ignore
