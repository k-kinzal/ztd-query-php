name: Fuzz (ztd-query-mysqli-adapter)

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      max_runs:
        description: Maximum iterations per target
        default: '10000'
        type: string
      mysql_version:
        description: MySQL version
        default: all
        type: choice
        options: ['all', '8.0.44', '8.4.7']
  pull_request:
    paths:
      - 'packages/ztd-query-mysqli-adapter/**'
      - 'packages/ztd-query-mysql/**'
      - 'packages/ztd-query-core/**'
      - 'packages/sql-faker/**'
      - 'packages/sql-fixture/**'
      - '.github/workflows/ztd-query-mysqli-adapter-fuzz.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: packages/ztd-query-mysqli-adapter

jobs:
  fuzz:
    name: ${{ matrix.target.corpus }} (MySQL ${{ matrix.mysql }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mysql: ${{ inputs.mysql_version && inputs.mysql_version != 'all' && fromJson(format('["{0}"]', inputs.mysql_version)) || fromJson('["8.0.44", "8.4.7"]') }}
        target:
          - {script: fuzz_robustness_execute.php, corpus: robustness-execute}
          - {script: fuzz_correctness_select.php, corpus: correctness-select}
          - {script: fuzz_correctness_insert.php, corpus: correctness-insert}
          - {script: fuzz_correctness_replace.php, corpus: correctness-replace}
          - {script: fuzz_correctness_update.php, corpus: correctness-update}
          - {script: fuzz_correctness_delete.php, corpus: correctness-delete}
    env:
      MYSQL_VERSION: ${{ matrix.mysql }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: mbstring, mysqli, pdo_mysql, pcntl, dom, xml, xmlwriter, gd
          coverage: none
          ini-values: memory_limit=1G
      - name: Validate the Composer manifest
        run: composer validate --strict --no-check-publish --no-check-all
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
        with:
          working-directory: packages/ztd-query-mysqli-adapter
          dependency-versions: locked
          composer-options: --prefer-dist
          require-lock-file: true
      - name: Check installed platform requirements
        run: composer check-platform-reqs
      - name: Restore corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: packages/ztd-query-mysqli-adapter/fuzz/corpus/${{ matrix.target.corpus }}
          key: mysqli-fuzz-${{ matrix.mysql }}-${{ matrix.target.corpus }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mysqli-fuzz-${{ matrix.mysql }}-${{ matrix.target.corpus }}-
      - name: Run bounded fuzz campaign
        env:
          MAX_RUNS: ${{ inputs.max_runs || (github.event_name == 'pull_request' && '100') || '10000' }}
          FUZZ_SCRIPT: ${{ matrix.target.script }}
          CORPUS: ${{ matrix.target.corpus }}
        run: |
          set -euo pipefail
          [[ "$MAX_RUNS" =~ ^[1-9][0-9]*$ ]] || { echo 'max_runs must be a positive integer' >&2; exit 1; }
          mkdir -p build/fuzz "fuzz/corpus/$CORPUS"
          if [[ -d "fuzz/seeds/$CORPUS" ]]; then
            cp "fuzz/seeds/$CORPUS/"* "fuzz/corpus/$CORPUS/"
          fi
          vendor/bin/php-fuzzer fuzz "fuzz/$FUZZ_SCRIPT" "fuzz/corpus/$CORPUS/" --timeout=15 --max-runs="$MAX_RUNS" 2>&1 | tee build/fuzz/run.log
          if compgen -G 'crash-*' > /dev/null || grep -Eq '^(CORPUS )?CRASH in |^DUPLICATE CRASH' build/fuzz/run.log; then
            echo 'Fuzzing produced crash artifacts; replay the uploaded inputs.' >&2
            exit 1
          fi
      - name: Save corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: packages/ztd-query-mysqli-adapter/fuzz/corpus/${{ matrix.target.corpus }}
          key: mysqli-fuzz-${{ matrix.mysql }}-${{ matrix.target.corpus }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload crash inputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mysqli-fuzz-${{ matrix.mysql }}-${{ matrix.target.corpus }}
          path: |
            packages/ztd-query-mysqli-adapter/crash-*
            packages/ztd-query-mysqli-adapter/build/fuzz/
            packages/ztd-query-mysqli-adapter/fuzz/corpus/
          if-no-files-found: ignore
