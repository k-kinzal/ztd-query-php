name: Fuzz (ztd-query-postgres)

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      max_runs:
        description: Maximum inputs evaluated by each fuzz target after the seed corpus is replayed
        required: true
        default: '1000'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  COMPOSER_NO_INTERACTION: '1'

jobs:
  fuzz:
    if: github.ref == 'refs/heads/main'
    name: Fuzz ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: behavior
            script: fuzz/fuzz_behavior.php
            corpus: fuzz/corpus/behavior
            fixtures: '0'
            extensions: pdo, pdo_pgsql, dom, filter, hash, iconv, json, libxml, mbstring, pcntl, pcre, phar, reflection, simplexml, spl, tokenizer, xml, xmlwriter
          - name: fixtures
            script: fuzz/fuzz_behavior.php
            corpus: fuzz/corpus/fixtures
            fixtures: '1'
            extensions: pdo, pdo_pgsql, dom, filter, hash, iconv, json, libxml, mbstring, pcntl, pcre, phar, reflection, simplexml, spl, tokenizer, xml, xmlwriter
    defaults:
      run:
        working-directory: packages/ztd-query-postgres
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: ${{ matrix.target.extensions }}
          coverage: none

      - name: Validate the Composer manifest and lock file
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          working-directory: packages/ztd-query-postgres
          dependency-versions: locked
          composer-options: --prefer-dist
          require-lock-file: true

      - name: Check runtime platform requirements
        run: composer check-platform-reqs --no-dev

      - name: Validate the manual run budget
        env:
          FUZZ_MAX_RUNS: ${{ inputs.max_runs || '1000' }}
        run: |
          case "$FUZZ_MAX_RUNS" in
            ''|*[!0-9]*) echo 'max_runs must be a positive integer.' >&2; exit 2 ;;
          esac
          if [ "${#FUZZ_MAX_RUNS}" -gt 8 ] || [ "$FUZZ_MAX_RUNS" -lt 1 ]; then
            echo 'max_runs must be between 1 and 99999999.' >&2
            exit 2
          fi

      - name: Restore the evolving corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/ztd-query-postgres/${{ matrix.target.corpus }}
          key: ztd-query-postgres-corpus-v3-${{ matrix.target.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ztd-query-postgres-corpus-v3-${{ matrix.target.name }}-

      - name: Run PHP-Fuzzer
        env:
          FUZZ_MAX_RUNS: ${{ inputs.max_runs || '1000' }}
          FUZZ_SCRIPT: ${{ matrix.target.script }}
          FUZZ_CORPUS: ${{ matrix.target.corpus }}
          FUZZ_TARGET: ${{ matrix.target.name }}
          ZTD_FUZZ_FIXTURES: ${{ matrix.target.fixtures }}
        run: |
          set -euo pipefail
          mkdir -p build/fuzz "$FUZZ_CORPUS"
          if [ "$ZTD_FUZZ_FIXTURES" = '0' ]; then
            cp ../sql-faker/seeds/pg/pg-17.2/* "$FUZZ_CORPUS/"
          fi
          php -d memory_limit=-1 vendor/bin/php-fuzzer fuzz \
            "$FUZZ_SCRIPT" \
            "$FUZZ_CORPUS/" \
            "--max-runs=$FUZZ_MAX_RUNS" --timeout=60 2>&1 | tee "build/fuzz/$FUZZ_TARGET.log"

      - name: Open an issue for a finding
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          FUZZ_TARGET: ${{ matrix.target.name }}
          FUZZ_SCRIPT: ${{ matrix.target.script }}
          ZTD_FUZZ_FIXTURES: ${{ matrix.target.fixtures }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const target = process.env.FUZZ_TARGET;
            const script = process.env.FUZZ_SCRIPT;
            const root = path.resolve('packages/ztd-query-postgres');
            const log = fs.readFileSync(path.join(root, `build/fuzz/${target}.log`), 'utf8');
            const finding = log.match(/^(?:CORPUS )?CRASH in (.+)!$/m);
            if (!finding) return;
            const input = fs.readFileSync(path.resolve(root, finding[1]));
            const hash = crypto.createHash('sha256').update(input).digest('hex');
            const marker = `<!-- ztd-query-postgres-fuzz:${target}:${hash} -->`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', per_page: 100
            });
            if (issues.some(issue => !issue.pull_request && issue.body?.includes(marker))) return;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              `PHP-Fuzzer found a contract violation in the ${target} target.`,
              `Commit: ${context.sha}`,
              `Workflow and input artifact: ${run} (ztd-query-postgres-fuzz-${target})`,
              'Run from packages/ztd-query-postgres after extracting the artifact:',
              '```sh',
              `ZTD_FUZZ_FIXTURES=${process.env.ZTD_FUZZ_FIXTURES} php -d memory_limit=-1 vendor/bin/php-fuzzer run-single ${script} '${path.relative(root, path.resolve(root, finding[1]))}' --timeout=60`,
              '```',
              `Input SHA-256: ${hash}`,
              '<details><summary>PHP-Fuzzer output</summary>',
              '', '```text', log.slice(-45000), '```', '</details>'
            ].join('\n\n');
            await github.rest.issues.create({
              ...context.repo,
              title: `[ztd-query-postgres fuzz] ${target}: ${hash.slice(0, 12)}`,
              body
            });

      - name: Save the evolving corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/ztd-query-postgres/${{ matrix.target.corpus }}
          key: ztd-query-postgres-corpus-v3-${{ matrix.target.name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload PHP-Fuzzer inputs and output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ztd-query-postgres-fuzz-${{ matrix.target.name }}
          path: |
            packages/ztd-query-postgres/crash-*
            packages/ztd-query-postgres/build/fuzz/${{ matrix.target.name }}.log
            packages/ztd-query-postgres/${{ matrix.target.corpus }}/
          if-no-files-found: ignore
          retention-days: 14
