name: Fuzz (ztd-query-postgres)

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      max_runs:
        description: Maximum mutation iterations after replaying the corpus
        required: true
        default: '10000'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  COMPOSER_NO_INTERACTION: '1'

jobs:
  robustness:
    name: Robustness / ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: classify, script: fuzz_robustness_classify.php, corpus: robustness-classify }
          - { name: rewrite, script: fuzz_robustness_rewrite.php, corpus: robustness-rewrite }
          - { name: full, script: fuzz_robustness.php, corpus: robustness }
    defaults:
      run:
        working-directory: packages/ztd-query-postgres
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: dom, mbstring, pcntl, pdo, xml, xmlwriter
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
        with:
          working-directory: packages/ztd-query-postgres
          composer-options: --prefer-dist

      - name: Check installed platform requirements
        run: composer check-platform-reqs

      - name: Validate the manual run budget
        env:
          FUZZ_MAX_RUNS: ${{ inputs.max_runs || '10000' }}
        run: |
          case "$FUZZ_MAX_RUNS" in
            ''|*[!0-9]*) echo 'max_runs must be a positive integer.' >&2; exit 2 ;;
          esac
          if [ "${#FUZZ_MAX_RUNS}" -gt 8 ] || [ "$FUZZ_MAX_RUNS" -lt 1 ]; then
            echo 'max_runs must be between 1 and 99999999.' >&2
            exit 2
          fi

      - name: Restore the evolving corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: packages/ztd-query-postgres/fuzz/corpus/${{ matrix.target.corpus }}
          key: fuzz-ztd-query-postgres-v2-${{ matrix.target.corpus }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fuzz-ztd-query-postgres-v2-${{ matrix.target.corpus }}-

      - name: Run PHP-Fuzzer
        env:
          FUZZ_MAX_RUNS: ${{ inputs.max_runs || '10000' }}
          FUZZ_SCRIPT: ${{ matrix.target.script }}
          FUZZ_CORPUS: ${{ matrix.target.corpus }}
        run: |
          set -euo pipefail
          mkdir -p build/fuzz "fuzz/corpus/${FUZZ_CORPUS}"
          vendor/bin/php-fuzzer fuzz "fuzz/${FUZZ_SCRIPT}" \
            "fuzz/corpus/${FUZZ_CORPUS}/" \
            "--max-runs=${FUZZ_MAX_RUNS}" 2>&1 | tee "build/fuzz/${FUZZ_CORPUS}.log"

      - name: Save the evolved corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: packages/ztd-query-postgres/fuzz/corpus/${{ matrix.target.corpus }}
          key: fuzz-ztd-query-postgres-v2-${{ matrix.target.corpus }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload crash inputs
        if: ${{ always() && hashFiles('packages/ztd-query-postgres/crash-*') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fuzz-crashes-ztd-query-postgres-robustness-${{ matrix.target.name }}
          path: packages/ztd-query-postgres/crash-*
          if-no-files-found: ignore

      - name: Upload execution logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: postgres-fuzz-${{ matrix.target.name }}
          path: packages/ztd-query-postgres/build/fuzz/
          if-no-files-found: ignore

  notify:
    name: Notify on crash
    runs-on: ubuntu-latest
    needs: [robustness]
    if: always() && needs.robustness.result == 'failure'
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Report a new fuzz crash
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });
            if (!data.artifacts.some(({ name }) => name.startsWith('fuzz-crashes-'))) {
              console.log('No fuzz crash artifacts found');
              return;
            }
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'fuzz',
              state: 'open'
            });
            if (issues.length > 0) {
              console.log('Open fuzz issue already exists, skipping creation');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Fuzz: Crash detected (ztd-query-postgres)`,
              body: `Fuzzing found a crash.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nCheck the uploaded artifacts for crash details.`,
              labels: ['bug', 'fuzz']
            });
