name: CI (ztd-query-sqlite)

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'packages/ztd-query-sqlite/**'
      - 'packages/phpstan-custom-rules/**'
      - '.github/workflows/ztd-query-sqlite.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: packages/ztd-query-sqlite

jobs:
  test:
    name: Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pcntl
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          working-directory: packages/ztd-query-sqlite
          dependency-versions: highest
          composer-options: --prefer-dist

      - name: Check installed platform requirements
        run: composer check-platform-reqs

      - name: Unit tests
        run: composer test

  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          working-directory: packages/ztd-query-sqlite
          dependency-versions: highest
          composer-options: --prefer-dist

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Coding standards
        run: composer format:check

      - name: Static analysis
        run: composer phpstan

      - name: Source tree
        run: composer tree-guard

      - name: Architecture boundaries
        run: composer deptrac

      - name: PHP compatibility
        run: composer compat

  bench:
    name: Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP '8.5'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: mbstring
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          working-directory: packages/ztd-query-sqlite
          dependency-versions: highest
          composer-options: --prefer-dist

      - name: Benchmarks
        run: composer bench

  mutation:
    name: Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up PHP '8.5'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: mbstring, pcntl
          coverage: pcov

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          working-directory: packages/ztd-query-sqlite
          dependency-versions: highest
          composer-options: --prefer-dist

      - name: Check installed platform requirements
        run: composer check-platform-reqs

      - name: Mutation testing on changed lines
        if: github.event_name == 'pull_request'
        run: >-
          php -d memory_limit=4G vendor/bin/infection
          --configuration=infection.json5
          --threads=max
          --git-diff-lines
          --git-diff-base="origin/${GITHUB_BASE_REF}"
          --ignore-msi-with-no-mutations
          --min-msi=85
          --min-covered-msi=85
          --no-progress
          --logger-github

      - name: Mutation testing on the whole source tree
        if: github.event_name != 'pull_request'
        run: >-
          php -d memory_limit=4G vendor/bin/infection
          --configuration=infection.json5
          --threads=max
          --no-progress
          --logger-github
