name: Fuzz (ztd-query-pdo-adapter)
permissions:
  contents: read
jobs:
  robustness-execute:
    name: Robustness / execute (MySQL ${{ matrix.mysql }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        mysql:
        - 8.0.44
        - 8.4.7
    defaults:
      run:
        working-directory: packages/ztd-query-pdo-adapter
    steps:
    - name: Check out the repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
      with:
        php-version: '8.3'
        extensions: ctype, dom, filter, hash, iconv, json, libxml, mbstring, pcntl, pcre, pdo, pdo_mysql, pdo_pgsql, pdo_sqlite,
          phar, reflection, simplexml, spl, tokenizer, xml, xmlwriter
        coverage: none
        ini-values: memory_limit=512M
    - name: Validate Composer metadata
      run: composer validate --strict --no-check-publish
    - name: Install dependencies
      uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      with:
        working-directory: packages/ztd-query-pdo-adapter
        dependency-versions: locked
        require-lock-file: true
        composer-options: --prefer-dist
    - name: Check installed platform requirements
      run: composer check-platform-reqs
    - name: Validate the run budget
      env:
        MAX_RUNS: ${{ inputs.max_runs || '10000' }}
      run: |
        if [[ ! "$MAX_RUNS" =~ ^[1-9][0-9]{0,6}$ ]]; then
          echo 'max_runs must be an integer between 1 and 1000000.' >&2
          exit 1
        fi
        if (( MAX_RUNS > 1000000 )); then exit 1; fi
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: packages/ztd-query-pdo-adapter/fuzz/corpus/robustness-execute
        key: fuzz-robustness-execute-pdo-${{ matrix.mysql }}-${{ github.run_id }}
        restore-keys: |
          fuzz-robustness-execute-pdo-${{ matrix.mysql }}-
      name: Restore the corpus
    - name: Run the fuzz target
      env:
        MYSQL_VERSION: ${{ matrix.mysql }}
        MAX_RUNS: ${{ inputs.max_runs || '10000' }}
      run: |
        set -euo pipefail
        mkdir -p build/fuzz fuzz/corpus/robustness-execute
        vendor/bin/php-fuzzer fuzz fuzz/fuzz_robustness_execute.php \
          fuzz/corpus/robustness-execute/ \
          --max-runs="$MAX_RUNS" 2>&1 | tee build/fuzz/run.log
    - name: Open an issue for a finding
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        FUZZ_CORPUS: robustness-execute
        FUZZ_SCRIPT: fuzz_robustness_execute.php
        FUZZ_DATABASE: MySQL ${{ matrix.mysql }}
        FUZZ_ARTIFACT: fuzz-results-robustness-execute-pdo-${{ matrix.mysql }}
        FUZZ_REPLAY_ENV: 'MYSQL_VERSION=${{ matrix.mysql }} '
      with:
        script: |
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const corpus = process.env.FUZZ_CORPUS;
          const script = process.env.FUZZ_SCRIPT;
          const root = path.resolve('packages/ztd-query-pdo-adapter');
          const log = fs.readFileSync(path.join(root, 'build/fuzz/run.log'), 'utf8');
          const finding = log.match(/^(?:CORPUS )?CRASH in (.+)!$/m);
          if (!finding) return;
          const input = fs.readFileSync(path.resolve(root, finding[1]));
          const hash = crypto.createHash('sha256').update(input).digest('hex');
          const marker = `<!-- ztd-query-pdo-adapter-fuzz:${corpus}:${hash} -->`;
          const issues = await github.paginate(github.rest.issues.listForRepo, {
            ...context.repo, state: 'open', per_page: 100
          });
          if (issues.some(issue => !issue.pull_request && issue.body?.includes(marker))) return;
          const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const body = [
            marker,
            `PHP-Fuzzer found a crash in the ${corpus} target on ${process.env.FUZZ_DATABASE}.`,
            `Commit: ${context.sha}`,
            `Workflow and input artifact: ${run} (${process.env.FUZZ_ARTIFACT})`,
            'Run from packages/ztd-query-pdo-adapter after extracting the artifact:',
            '```sh',
            `${process.env.FUZZ_REPLAY_ENV}vendor/bin/php-fuzzer run-single fuzz/${script} '${path.relative(root, path.resolve(root, finding[1]))}'`,
            '```',
            `Input SHA-256: ${hash}`,
            '<details><summary>PHP-Fuzzer output</summary>',
            '', '```text', log.slice(-45000), '```', '</details>'
          ].join('\n\n');
          await github.rest.issues.create({
            ...context.repo,
            title: `[ztd-query-pdo-adapter fuzz] ${corpus}: ${hash.slice(0, 12)}`,
            body
          });
    - if: always()
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: packages/ztd-query-pdo-adapter/fuzz/corpus/robustness-execute
        key: fuzz-robustness-execute-pdo-${{ matrix.mysql }}-${{ github.run_id }}
      name: Save the corpus
    - if: ${{ always() && hashFiles('packages/ztd-query-pdo-adapter/build/fuzz/run.log') != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: fuzz-results-robustness-execute-pdo-${{ matrix.mysql }}
        path: |
          packages/ztd-query-pdo-adapter/crash-*
          packages/ztd-query-pdo-adapter/build/fuzz/run.log
          packages/ztd-query-pdo-adapter/fuzz/corpus/
      name: Upload run log and replay inputs
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: '%'
        ports:
        - 3306:3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -proot" --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
