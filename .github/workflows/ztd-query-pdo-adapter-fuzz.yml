    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: fuzz_test
        ports:
        - 5432:5432
        options: --health-cmd="pg_isready -U test -d fuzz_test" --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      PG_HOST: 127.0.0.1
      PG_PORT: '5432'
'on':
  schedule:
  - cron: 23 5 * * *
  workflow_dispatch:
    inputs:
      max_runs:
        description: Max fuzzing iterations
        default: '10000'
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
