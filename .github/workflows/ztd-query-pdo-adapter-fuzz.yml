name: Fuzz (ztd-query-pdo-adapter)
permissions:
  contents: read
jobs:
  robustness-execute:
    name: Robustness / execute (MySQL ${{ matrix.mysql }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql:
        - 8.0.44
        - 8.4.7
    defaults:
      run:
        working-directory: packages/ztd-query-pdo-adapter
    steps:
    - name: Check out the repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Set up PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
      with:
        php-version: '8.3'
        extensions: ctype, dom, filter, hash, iconv, json, libxml, mbstring, pcntl, pcre, pdo, pdo_mysql, pdo_pgsql, pdo_sqlite,
          phar, reflection, simplexml, spl, tokenizer, xml, xmlwriter
        coverage: none
        ini-values: memory_limit=512M
    - name: Validate Composer metadata
      run: composer validate --strict --no-check-publish
    - name: Install dependencies
      uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
      with:
        working-directory: packages/ztd-query-pdo-adapter
        dependency-versions: locked
        require-lock-file: true
        composer-options: --prefer-dist
    - name: Check installed platform requirements
      run: composer check-platform-reqs
    - name: Validate the run budget
      env:
        MAX_RUNS: ${{ inputs.max_runs || '10000' }}
      run: |
        if [[ ! "$MAX_RUNS" =~ ^[1-9][0-9]{0,6}$ ]]; then
          echo 'max_runs must be an integer between 1 and 1000000.' >&2
          exit 1
        fi
        if (( MAX_RUNS > 1000000 )); then exit 1; fi
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: packages/ztd-query-pdo-adapter/fuzz/corpus/robustness-execute
        key: fuzz-robustness-execute-pdo-${{ matrix.mysql }}-${{ github.run_id }}
        restore-keys: |
          fuzz-robustness-execute-pdo-${{ matrix.mysql }}-
      name: Restore the corpus
    - name: Run the fuzz target
      env:
        MYSQL_VERSION: ${{ matrix.mysql }}
        MAX_RUNS: ${{ inputs.max_runs || '10000' }}
      run: |
        mkdir -p fuzz/corpus/robustness-execute
        vendor/bin/php-fuzzer fuzz fuzz/fuzz_robustness_execute.php \
          fuzz/corpus/robustness-execute/ \
          --max-runs="$MAX_RUNS"
    - if: always()
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: packages/ztd-query-pdo-adapter/fuzz/corpus/robustness-execute
        key: fuzz-robustness-execute-pdo-${{ matrix.mysql }}-${{ github.run_id }}
      name: Save the corpus
    - if: ${{ always() && hashFiles('packages/ztd-query-pdo-adapter/crash-*') != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: fuzz-crashes-robustness-execute-pdo-${{ matrix.mysql }}
        path: packages/ztd-query-pdo-adapter/crash-*
      name: Upload crash inputs
    - name: Fail when the fuzzer reports findings
      if: ${{ always() && hashFiles('packages/ztd-query-pdo-adapter/crash-*') != '' }}
      run: |
        echo 'Fuzzing found a counterexample. Download the crash input artifact and replay it before accepting this run.' >&2
        exit 1
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: '%'
        ports:
        - 3306:3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -proot" --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
  correctness-mysql:
    name: Correctness / ${{ matrix.target.name }}-pdo (MySQL ${{ matrix.mysql }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql:
        - 8.0.44
        - 8.4.7
        target:
        - name: select
          script: fuzz_correctness_select.php
          corpus: correctness-select
        - name: insert
