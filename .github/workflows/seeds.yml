name: Seeds

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'packages/sql-faker/**'
      - 'seeds/**'
      - '.github/workflows/seeds.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_NO_INTERACTION: '1'

defaults:
  run:
    shell: bash
    working-directory: packages/sql-faker

jobs:
  check:
    name: Replay the grammar coverage seeds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none
      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
        with:
          working-directory: packages/sql-faker
          dependency-versions: locked
          composer-options: --prefer-dist
          require-lock-file: true
      - name: Replay every corpus and require full production coverage
        run: php bin/seeds.php check --input ../../seeds
