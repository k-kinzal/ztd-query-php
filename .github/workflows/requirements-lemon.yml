name: Traceability (lemon-parser)

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'packages/requirements/**'
      - 'packages/lemon-parser/**'
      - '.github/workflows/requirements-lemon.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  traceability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/lemon-parser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: dom, mbstring, xml, xmlwriter
          coverage: none
      - name: Install the traceability tool
        run: composer install --working-dir=../requirements --no-interaction --prefer-dist
      - name: Install the grammar reader and its Behat suite
        run: composer install --no-interaction --prefer-dist
      - name: Validate definitions and download verified source caches
        run: |
          php ../requirements/bin/requirements lint
          php ../requirements/bin/requirements format --check
          php ../requirements/bin/requirements check
      - name: Enforce coverage and keep the checked-in baseline reproducible
        run: |
          php ../requirements/bin/requirements coverage --write-baseline /tmp/current-coverage.json
          cmp requirements-baseline.json /tmp/current-coverage.json
      - name: Enforce coverage of changed source units
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          baseline="origin/$BASE_REF:packages/lemon-parser/requirements-baseline.json"
          if git cat-file -e "$baseline" 2>/dev/null; then
            git show "$baseline" > /tmp/base-coverage.json
            php ../requirements/bin/requirements coverage --baseline /tmp/base-coverage.json --min-diff-coverage 100
          else
            echo 'Initial adoption: review the scope and enforce the configured total coverage gate.'
          fi
      - name: Verify the traced specifications
        run: php ../requirements/bin/requirements spec --json > requirements-results.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: lemon-requirements-results
          path: packages/lemon-parser/requirements-results.json
          if-no-files-found: ignore
