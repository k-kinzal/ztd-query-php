name: Docs Preview

on:
  pull_request:
    paths:
      - 'packages/sql-faker/**'
      - 'packages/sql-fixture/**'
      - '.github/actions/build-docs/**'
      - '.github/workflows/docs.yml'
      - '.github/workflows/docs-preview.yml'
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: read

concurrency:
  group: package-docs-publish
  cancel-in-progress: false

env:
  COMPOSER_NO_INTERACTION: '1'
  DOCS_BRANCH: gh-pages

jobs:
  preview:
    name: Generate and publish the pull request preview
    services:
      mysql:
        image: container-registry.oracle.com/mysql/community-server:8.4.7
        env:
          MYSQL_ROOT_PASSWORD: toolkit
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: sql_fixture
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptoolkit"
          --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:17.2
        env:
          POSTGRES_PASSWORD: toolkit
          POSTGRES_DB: sql_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d sql_fixture"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      SQL_FIXTURE_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=sql_fixture
      SQL_FIXTURE_PGSQL_DSN: pgsql:host=127.0.0.1;port=5432;dbname=sql_fixture
    if: github.event.action != 'closed' && !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      pull-requests: write
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          # The locked ParaTest version supports PHP 8.1 through 8.3.
          php-version: '8.3'
          extensions: mbstring, pcntl, gd, pdo_mysql, pdo_pgsql, pdo_sqlite
          coverage: pcov

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
        with:
          working-directory: packages/sql-faker
          dependency-versions: locked
          composer-options: --prefer-dist
          require-lock-file: true

      - name: Install sql-fixture dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
        with:
          working-directory: packages/sql-fixture
          dependency-versions: locked
          composer-options: --prefer-dist
          require-lock-file: true

      - name: Check installed platform requirements
        run: |
          composer --working-dir=packages/sql-faker check-platform-reqs
          composer --working-dir=packages/sql-fixture check-platform-reqs

      - name: Restore the DocGen cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build/docgen-cache
          key: packages-docgen-${{ runner.os }}-${{ hashFiles('packages/sql-faker/composer.lock', 'packages/sql-fixture/composer.lock') }}-${{ github.sha }}
          restore-keys: |
            packages-docgen-${{ runner.os }}-${{ hashFiles('packages/sql-faker/composer.lock', 'packages/sql-fixture/composer.lock') }}-
            packages-docgen-${{ runner.os }}-

      - name: Generate the coverage report the preview reads
        run: |
          composer --working-dir=packages/sql-faker test -- --coverage-xml build/coverage-xml
          composer --working-dir=packages/sql-fixture test -- --coverage-xml build/coverage-xml

      - name: Determine the documentation URL
        id: docs-url
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          repository="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          url="https://${repository%%/*}.github.io/${repository#*/}"
          if [ -n "$PR_NUMBER" ]; then
            url="$url/pr/$PR_NUMBER"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Generate the documentation
        uses: ./.github/actions/build-docs
        with:
          base-url: ${{ steps.docs-url.outputs.url }}
          diff: ${{ github.event.pull_request.base.sha }}

      - name: Check out the documentation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.DOCS_BRANCH }}
          path: .docs-branch

      - name: Publish the preview
        working-directory: .docs-branch
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          mkdir -p "pr/${PR_NUMBER}"
          rsync -a --checksum --delete ../build/docs/ "pr/${PR_NUMBER}/"
          touch .nojekyll

          git add --all
          if git diff --cached --quiet; then
            echo "The ${DOCS_BRANCH} branch already serves this preview."
            exit 0
          fi

          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --message "docs: preview pull request #${PR_NUMBER} at ${HEAD_SHA}"
          git push origin "HEAD:${DOCS_BRANCH}"

      - name: Build GitHub Pages and wait for publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          expected_sha="$(git -C .docs-branch rev-parse HEAD)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" > /dev/null
          for attempt in {1..60}; do
            build="$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest")"
            if [ "$(jq -r .commit <<< "$build")" = "$expected_sha" ]; then
              case "$(jq -r .status <<< "$build")" in
                built) exit 0 ;;
                errored) jq .error <<< "$build"; exit 1 ;;
              esac
            fi
            sleep 10
          done
          echo 'Timed out waiting for GitHub Pages publication.' >&2
          exit 1

      - name: Comment the preview link on the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          repository="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          preview_url="https://${repository%%/*}.github.io/${repository#*/}/pr/${PR_NUMBER}/"

          comment_file="$(mktemp)"
          cat > "$comment_file" <<EOF
          <!-- packages-docgen-preview -->
          **Documentation preview:** ${preview_url}

          Generated in diff mode against ${BASE_REF}. Use **Off**, **Diff**, or
          **Changes** at the top of the page to select the documentation view.

          Updated for ${HEAD_SHA}. The preview is removed when this pull request is closed.
          EOF
          comment_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- packages-docgen-preview -->"))) | .id' | tail -n 1)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -F "body=@${comment_file}"
          else
            gh pr comment "${PR_NUMBER}" --body-file "$comment_file"
          fi

  cleanup:
    name: Remove the pull request preview
    if: github.event.action == 'closed' && !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      pull-requests: write
    steps:
      - name: Check out the documentation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.DOCS_BRANCH }}

      - name: Remove the preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          rm -rf "pr/${PR_NUMBER}"

          git add --all
          if git diff --cached --quiet; then
            echo "The ${DOCS_BRANCH} branch carries no preview of this pull request."
            exit 0
          fi

          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --message "docs: remove the preview of pull request #${PR_NUMBER}"
          git push origin "HEAD:${DOCS_BRANCH}"

      - name: Build GitHub Pages and wait for publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          expected_sha="$(git rev-parse HEAD)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" > /dev/null
          for attempt in {1..60}; do
            build="$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest")"
            if [ "$(jq -r .commit <<< "$build")" = "$expected_sha" ]; then
              case "$(jq -r .status <<< "$build")" in
                built) exit 0 ;;
                errored) jq .error <<< "$build"; exit 1 ;;
              esac
            fi
            sleep 10
          done
          echo 'Timed out waiting for GitHub Pages publication.' >&2
          exit 1

      - name: Note the removal on the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          comment_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- packages-docgen-preview -->"))) | .id' | tail -n 1)"
          if [ -n "$comment_id" ]; then
            comment_file="$(mktemp)"
            cat > "$comment_file" <<'EOF'
          <!-- packages-docgen-preview -->
          The documentation preview of this pull request has been removed.
          EOF
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -F "body=@${comment_file}"
          fi
